of-view IR sensors that pass fire-control-quality tracks to interceptors.</li><li>Expands the Tranche 3 tracking constellation from 72 to 108 satellites.</li></ul>","<p>2026年7月13–14日與Sierra Space（$7.98億）同時授予：36顆衛星、分布於4個低軌軌道面，為2028年Golden Dome能力加速部署（原T3追蹤層於2029年發射）。</p><ul><li>L3Harris打造18顆「類HBTSS」導彈防禦型衛星，搭載中視場紅外感測器，向攔截器提供火控級追蹤。</li><li>T3追蹤星座由72顆擴至108顆。</li></ul>"]},{name:"SDA Tracking Layer (All Tranches T0-T3)",value:"><b>$2B</b> cumulative",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Firm-Fixed-Price OTA (all tranches)","FFP OTA（所有批次）"],pop:["2022 – FY2029 (T3 launch)","2022–FY2029（T3發射）"],desc:["<p>Only company awarded every SDA tracking tranche. T3 part of <b>$3.5B</b> batch (Dec 2025, 72 sats across 4 vendors).</p><ul><li>SDA acting director Sandhoo: T3 achieves 'near-continuous global coverage for missile warning and tracking, with fire control-quality tracks.' FY2029 launch.</li><li>Ed Zoiss confirmed full-rate production at Palm Bay.</li><li>Production floor expanded Aug 2025 for increased demand.</li><li>Bloomberg: awards are 'significant investment in capabilities seen as part of Golden Dome.'</li></ul>","<p>唯一入選所有SDA追蹤層批次。</p><ul><li>T3屬於<b>$35億</b>批次（2025年12月，72顆衛星，4家供應商）。</li><li>SDA代理主任Sandhoo：T3實現「近乎連續全球覆蓋和火控級追蹤」。</li><li>2025年8月擴建產線。</li><li>Bloomberg：「Golden Dome相關能力的重大投資」。</li></ul>"]},{name:"Fort Wayne IR Payload Expansion",value:"<b>$125M</b> investment",agency:["L3Harris (company capex)","L3Harris（公司資本支出）"],type:["Internal investment","內部投資"],pop:["2025 – ongoing","2025–進行中"],desc:["<p><b>$125M</b> expansion at Fort Wayne, IN for IR sensing payload production — central technology for Golden Dome's tracking layer detecting missile heat signatures across flight phases.</p><ul><li>Complements Palm Bay satellite assembly.</li></ul>","<p><b>$1.25</b>億Fort Wayne擴建紅外感測載荷產能。</p><ul><li>Golden Dome追蹤層核心技術。</li></ul>"]},{name:"SHIELD IDIQ Awardee",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Positioned for digital engineering, next-gen OPIR sensor trials, tracking algorithms, C2 fusion.</p><ul><li>Consistent selection across every tranche gives institutional knowledge advantage.</li></ul>","<p>數位工程、OPIR感測器、追蹤算法、C2融合。</p><ul><li>跨所有批次的持續入選賦予制度知識優勢。</li></ul>"]}],partners:["SDA","Northrop Grumman","Rocket Lab (StarLite)"],mkt:"public",rev:["~$22B (FY2025); FY26 guide $23.2–23.7B","約$220億（FY2025）；FY26指引$232–237億"],gdVal:[">$3B cumulative SDA tracking (T0–T3 + AMDT3, est.) + Aerojet SRMs","累計>$30億SDA追蹤（T0–T3＋AMDT3，估計）＋Aerojet固體火箭發動機"],exp:"med",invNote:["The most bankable tracking-layer play just got more bankable: AMDT3 adds ~$955M on firm-fixed-price terms and puts L3Harris satellites on the 2028 critical path. Aerojet Rocketdyne SRMs add a second Golden Dome vector (interceptor propulsion). GD is roughly 10–15% of revenue (est.); FFP terms carry execution risk, but the franchise is proven with satellites already on orbit.","最「可靠」的追蹤層標的更加穩固：AMDT3以固定價格新增約$9.55億，並使L3Harris衛星進入2028年關鍵路徑。Aerojet Rocketdyne固體火箭發動機提供第二條Golden Dome路徑（攔截器推進）。GD約佔營收10–15%（估計）；固定價格有執行風險，但已有衛星在軌，實力經驗證。"]},
{name:"Rocket Lab",ticker:"Nasdaq: RKLB",cat:"newspace",tags:[{label:["SBI w/ Raytheon","SBI(與Raytheon)"],color:"red"},{label:["Satellite Manufacturer","衛星製造商"],color:"cyan"},{label:["HASTE Launch","HASTE發射"],color:"blue"},{label:["<b>$1.5B+</b> Backlog","<b>$15</b>億+積壓"],color:"emerald"}],summary:["Record Q2'26 revenue <b>$234M</b> (+62%), backlog <b>$2.36B</b> (+137%); >$1B new contracts incl. $397M Space Force Flatellite + $266M suborbital (up to 18 missions); SBI support via Raytheon; SDA T3 $816M; Iridium acquisition pending; Neutron to pad Q4 2026.","2026年Q2營收創紀錄<b>$2.34億</b>（+62%），積壓<b>$23.6億</b>（+137%）；新簽逾$10億合約，含太空軍$3.97億Flatellite＋$2.66億亞軌道（最多18次任務）；經Raytheon支援SBI；SDA T3 $8.16億；收購Iridium待完成；Neutron預計Q4運抵發射台。"],role:["Disrupting legacy primes via vertical integration. Only commercial provider producing both spacecraft and payloads in-house for SDA Tracking Layer. Phoenix IR sensor and StarLite protection sensors adopted by other TRKT3 primes. <b>CEO Sir</b> Peter Beck: 'Rocket Lab's vertically integrated approach is enabling a fundamental shift in how national security space programs are executed.' 21 launches in 2025 (record). 28 new launches sold in Q1 2026 alone. 70+ backlog. ><b>$2B</b> total backlog. CDR phase for T2TL — first flight units to Vandenberg SFB mid-2027.","通過垂直整合顛覆傳統主承商。唯一為SDA追蹤層自主製造衛星與載荷。Phoenix和StarLite感測器被其他主承商採用。<b>CEO Beck</b>：「正在實現國安太空計劃執行的根本轉變。」2025年21次發射。Q1 2026售出28次。70+積壓。總積壓><b>$20</b>億。"],contracts:[{name:"Space Force Flatellite + Suborbital Missions (Q2–Q3 2026)",value:"<b>$397M</b> + <b>$266M</b>",agency:["U.S. Space Force","美國太空軍"],type:["Spacecraft production + launch services","航天器生產＋發射服務"],pop:["2026 – ongoing","2026年–進行中"],desc:["<p>Part of >$1B of contracts signed in Q2 and after quarter-end: a $397M Space Force deal for Flatellite spacecraft and a record $266M Space Force contract for up to 18 suborbital missions, plus $160M for three GEO satellites.</p><ul><li>Adds to the $816M SDA Tranche 3 Tracking award and the $190M HASTE contract.</li><li>Victus Haze (Jun 2026): Electron launched on 16h42m notice — a responsive-space record.</li></ul>","<p>屬Q2及季後所簽逾$10億合約：太空軍$3.97億Flatellite航天器合約、創紀錄$2.66億最多18次亞軌道任務合約，另有$1.6億三顆同步軌道衛星。</p><ul><li>疊加$8.16億SDA T3追蹤與$1.9億HASTE合約。</li><li>Victus Haze（2026年6月）：Electron在16小時42分鐘通知內發射——快速響應太空紀錄。</li></ul>"]},{name:"SDA Tracking Layer Tranche 3 (TRKT3)",value:"<b>$816M</b> (<b>$806M</b> + <b>$10.45M</b> options)",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Firm-Fixed-Price OTA","FFP OTA"],pop:["Dec 2025 – FY2029 (3-yr production → launch)","2025年12月–FY2029（3年生產→發射）"],desc:["<p>Awarded Dec 19, 2025. Largest single contract. 18 satellites with Phoenix IR (WFOV) and StarLite protection sensors.</p><ul><li>StarLite also adopted by other TRKT3 primes — additional ~<b>$184M</b> subsystem supply could push total capture to ~<b>$1B</b> (payloads, solar, ADAC, software).</li><li>SDA acting director Sandhoo: T3 achieves 'near-continuous global coverage.' Part of <b>$3.5B</b> across 4 companies for 72 sats.</li><li>FY2029 launch.</li><li>Bloomberg: 'significant investment as part of Golden Dome.'</li></ul>","<p>2025年12月19日授標。</p><ul><li>最大單一合約。</li><li>18顆衛星搭載Phoenix紅外和StarLite感測器。</li><li>StarLite被其他主承商採用——額外~<b>$1.84億</b>子系統供應，總捕獲潛在~<b>$10億</b>。</li><li>Bloomberg：「Golden Dome相關重大投資。</li></ul>"]},{name:"SDA Transport Layer-Beta Tranche 2",value:"<b>$515M</b>",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Firm-Fixed-Price OTA","FFP OTA"],pop:["Jan 2024 – mid-2027 (CDR → delivery)","2024年1月–2027年中（CDR→交付）"],desc:["<p>18 satellites for secure low-latency encrypted comms across PWSA — the data backbone connecting tracking sats to ground fire control.</p><ul><li>Uses Lightning platform.</li><li>CDR phase; hardware qualification late 2026; first flight units to Vandenberg SFB mid-2027.</li><li><b>Combined</b> SDA total ><b>$1.3B</b>.</li></ul>","<p>18顆衛星為PWSA提供安全低延遲加密通訊。</p><ul><li>使用Lightning平台。</li><li>處於CDR階段。</li><li>合計SDA><b>$13億</b>。</li></ul>"]},{name:"HASTE — MACH-TB 2.0 (20 Launches)",value:"<b>$190M</b> (announced Mar 18, 2026)",agency:["TRMC / NSWC Crane (via Kratos prime)","TRMC/NSWC Crane（經Kratos主承商）"],type:["Subcontract under OTA (MACH-TB 2.0 TA1)","OTA下分包合約"],pop:["Mar 2026 – 2030 (4 yrs, 20 launches)","2026年3月–2030年（4年，20次發射）"],desc:["<p>Announced today (March 18, 2026). Single largest launch contract in Rocket Lab history. 20 hypersonic test flights over 4 years with HASTE (Mach 5+ suborbital Electron variant) under MACH-TB 2.0 Task Area 1, prime contractor Kratos (KTOS).</p><ul><li>Partnership with TRMC/NSWC Crane.</li><li>First mission within months. 100% HASTE success rate since 2023.</li><li>Supports Golden Dome by accelerating hypersonic test cadence for interceptor development.</li><li>Pushes backlog to ><b>$2B</b> and 70+ launches.</li><li><b>CEO Beck</b>: 'Our expanded partnership strengthens America's national security with speed and affordability.' Q1 2026: 28 new launches sold — almost equal to full year 2025.</li></ul>","<p>2026年3月18日公布。Rocket Lab歷史最大發射合約。</p><ul><li>在MACH-TB 2.0下（主承商Kratos）4年20次HASTE高超音速試飛。</li><li>首次任務數月內。</li><li>100%成功率。</li><li>通過加速試飛節奏支持Golden Dome。</li><li>總積壓><b>$20億</b>。</li><li>Q1 2026售出28次新發射。</li></ul>"]},{name:"Space-Based Interceptor (Raytheon partnership, Jun 2026)",value:"Launch/orbital infrastructure (under RTX SBI work)",agency:["U.S. Space Force (via Raytheon/RTX)","美國太空軍（經Raytheon/RTX）"],type:["Subcontract/partnership","分包/合作"],pop:["Jun 2026 – ongoing","2026年6月–進行中"],desc:["<p>Early June 2026: CEO Peter Beck confirmed Rocket Lab was 'selected to support the Department of War's Space-Based Interceptor program under Golden Dome for America in partnership with Raytheon.'</p><ul><li><b>RKLB role:</b> Launch and orbital infrastructure for the SBI constellation — leveraging Electron, HASTE, and forthcoming Neutron medium-lift (NET late 2026).</li><li><b>Q1 2026 momentum:</b> Revenue $200.35M (+63.5% YoY); backlog $2.2B (+20.2% sequentially).</li><li>Adds an SBI vector on top of RKLB's $1.5B+ SDA tracking/transport + HASTE hypersonic test backlog.</li><li>Reinforces RKLB's transformation from launch provider into vertically-integrated defense space prime.</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>2026年6月初：CEO Peter Beck確認Rocket Lab「被選中支持Golden Dome的太空攔截器計劃，與Raytheon合作」。</p><ul><li><b>RKLB角色：</b>SBI星座的發射和軌道基礎設施——利用Electron、HASTE和即將推出的Neutron中型運載火箭（2026年底）。</li><li><b>Q1 2026動能：</b>營收$2.0035億（YoY +63.5%）；積壓$22億（環比+20.2%）。</li><li>在RKLB的$15億+ SDA追蹤/傳輸+HASTE之上增添SBI向量。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["SDA","Kratos (MACH-TB 2.0 prime)","L3Harris (StarLite)"],mkt:"public",rev:["$602M (FY2025, 10-K); Q2'26 $234M (+62%)","$6.02億（FY2025，10-K）；2026年Q2 $2.34億（+62%）"],gdVal:["$816M SDA T3 + $190M HASTE + $663M new Space Force + SBI (via RTX)","$8.16億SDA T3＋$1.9億HASTE＋$6.63億新太空軍合約＋SBI（經RTX）"],exp:"vhigh",invNote:["Still the purest listed space-defense proxy, but the mix is about to change: the pending Iridium acquisition (66-sat constellation, ~$870M revenue) adds commercial recurring revenue and PNT optionality, diluting GD share post-close; it is partly funded by a $1.944B ATM (dilution). Neutron is the swing factor — management targets the pad in Q4 2026 and concedes the window for a 2026 launch is narrowing. Q3 margin guide was soft; FCF positive only 18–24 months after Neutron's first flight.","仍是最純正的上市太空國防標的，但業務結構即將改變：待完成的Iridium收購（66顆星座、營收約$8.7億）帶來商業經常性收入與PNT選擇權，完成後將稀釋GD占比；部分資金來自$19.44億ATM增發（稀釋）。Neutron是關鍵變數——管理層目標Q4運抵發射台，並承認2026年發射窗口正在收窄。Q3利潤率指引偏弱；Neutron首飛後18–24個月才可望自由現金流轉正。"]},
{name:"Boeing",ticker:"NYSE: BA",cat:"prime",tags:[{label:["Defense Prime","國防主承商"],color:"blue"},{label:["MWT MEO (12 sats)","MWT中軌(12顆)"],color:"cyan"},{label:["X-37B / Foo Fighter","X-37B/Foo Fighter"],color:"amber"}],summary:["BDS Q2'26 revenue $7.5B (+13%) but an operating loss ($280M VC-25B charge); BDS backlog $85B; Space Force proprietary-comms award (Q2); 12 Resilient MWT MEO sats via Millennium (ground by KTOS GMI); X-37B testbed.","BDS 2026年Q2營收$75億（+13%），但因VC-25B $2.8億減值錄得營業虧損；BDS積壓$850億；Q2獲太空軍專有通訊合約；透過Millennium打造12顆彈性MWT中軌衛星（地面系統由KTOS GMI營運）；X-37B試驗平台。"],role:["Participates via subsidiary Millennium Space Systems — 12 Resilient MWT MEO satellites. New 9,000 sq ft El Segundo production line for dual-spectrum EO/IR payloads. Boeing Space targets 26 satellites in 2026 (2x 2025). X-37B serves as orbital testbed for sensitive Golden Dome tech. 'Foo Fighter' tracking satellites provide persistent detection. Arrow heritage with Israel's IAI.","透過Millennium Space子公司參與——12顆MWT中軌衛星。新建El Segundo產線。2026年目標26顆衛星。X-37B為Golden Dome技術軌道試驗台。與IAI的Arrow合作。"],contracts:[{name:"Resilient MWT MEO Satellites",value:"Classified (12 sats, mid-2027)",agency:["U.S. Space Force (SSC)","太空軍（SSC）"],type:["Classified","機密"],pop:["Ongoing – mid-2027 (delivery)","進行中–2027年中（交付）"],desc:["<p>12 MEO satellites via Millennium Space Systems.</p><ul><li>New 9,000 sq ft El Segundo production line (size of two basketball courts) for dual-spectrum detection assembly.</li><li>Delivery mid-2027 after supply chain delays.</li><li>MEO provides broader coverage with fewer sats, complementing LEO SDA tracking layer.</li></ul>","<p>透過Millennium Space製造12顆中軌衛星。</p><ul><li>新建El Segundo產線。</li><li>2027年中交付。</li><li>中軌以較少衛星提供更廣覆蓋，互補低軌SDA追蹤層。</li></ul>"]},{name:"'Foo Fighter' + X-37B",value:"Classified",agency:["U.S. Space Force","太空軍"],type:["Classified","機密"],pop:["Ongoing","進行中"],desc:["<p>Foo Fighter: dual-spectrum EO/IR detection satellites for persistent sensing.</p><ul><li>X-37B: autonomous orbital testbed for classified Golden Dome technologies.</li><li>Boeing pitched X-37B for broader orbital missions beyond testing.</li></ul>","<p>Foo Fighter：雙頻譜偵測衛星。</p><ul><li>X-37B：機密Golden Dome技術的軌道試驗台。</li><li>Boeing推銷X-37B用於更廣泛軌道任務。</li></ul>"]},{name:"SHIELD IDIQ Awardee",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Qualified.</p><ul><li>New El Segundo line commissioned for Golden Dome EO/IR payloads. 26-satellite 2026 target demonstrates production scaling.</li></ul>","<p>已取得資格。</p><ul><li>新El Segundo產線專供Golden Dome載荷。</li><li>2026年目標26顆展示產能擴展。</li></ul>"]}],partners:["IAI (Arrow)","Millennium Space (subsidiary)"],mkt:"public",rev:["$89.5B (FY2025, 10-K); BDS Q2'26 $7.5B","$895億（FY2025，10-K）；BDS 2026年Q2 $75億"],gdVal:["Classified (12 MWT sats + Foo Fighter + X-37B)","機密（12顆MWT+Foo Fighter+X-37B）"],exp:"low",invNote:["Golden Dome is a rounding error for Boeing (FY2025 revenue $89.5B); the equity story is 737 MAX 7/10 and 777X certification and cash flow. BDS is growing (+17% in H1) but still loss-making on legacy fixed-price programs. Millennium's MWT MEO satellites remain the cleanest GD link.","Golden Dome對波音而言微不足道（FY2025營收$895億）；股權故事在737 MAX 7/10與777X認證及現金流。BDS持續成長（上半年+17%），但舊有固定價格計劃仍虧損。Millennium的MWT中軌衛星仍是最直接的GD連結。"]},
{name:"BAE Systems",ticker:"LON: BA./OTC: BAESY",cat:"satellite",tags:[{label:["Epoch 2 Prime","Epoch 2主承商"],color:"blue"},{label:["<b>$1.2B</b> Award","<b>$12</b>億"],color:"amber"},{label:["MWT Satellites","MWT衛星"],color:"emerald"}],summary:["H1'26 sales £15.8B (+9%), record <b>£84.0B</b> backlog, full-year guidance upgraded; MEO missile-warning/tracking satellites (ground via KTOS GMI); £5.9B UK submarine contract (Jul 2026).","2026上半年銷售£158億（+9%），創紀錄<b>£840億</b>積壓，全年指引上調；中軌導彈預警/追蹤衛星（地面系統經KTOS GMI）；£59億英國潛艇合約（2026年7月）。"],role:["Prime for Space Force Epoch 2 missile warning program. <b>$1.2B</b> for 10 additional satellites advancing the multi-orbit sensor architecture feeding Golden Dome's kill chain.","太空軍Epoch 2導彈預警計劃主承商。<b>$12</b>億10顆衛星。推進多軌道感測器架構。"],contracts:[{name:"Epoch 2 MWT Satellites",value:"<b>$1.2B</b> (June 2025)",agency:["U.S. Space Force (SSC)","太空軍（SSC）"],type:["Contract (details classified)","合約（詳情機密）"],pop:["Jun 2025 – TBD","2025年6月–待定"],desc:["<p>10 additional missile warning/tracking satellites.</p><ul><li>Advances the Resilient MWT constellation in MEO.</li><li>Operates with Boeing/Millennium Space MWT sats and L3Harris SDA tracking to create multi-orbit, multi-phenomenology sensor mesh.</li><li>The Epoch 2 award represents significant expansion of Golden Dome's orbital sensor backbone.</li></ul>","<p>10顆額外導彈預警追蹤衛星。</p><ul><li>推進中軌彈性MWT星座。</li><li>與Boeing/Millennium Space和L3Harris SDA追蹤層協同形成多軌道感測器網。</li></ul>"]}],partners:["U.S. Space Force","SDA","Boeing (MWT)"],mkt:"public",rev:["H1'26 sales £15.8B (+9%); FY2025 ~£30B","2026上半年銷售£158億（+9%）；FY2025約£300億"],gdVal:["$1.2B (Epoch 2)","$12億（Epoch 2）"],exp:"low",invNote:["Golden Dome is marginal for BAE; European rearmament, submarines and munitions drive the upgrade cycle. The US space business (ex-Ball Aerospace) is the GD-relevant piece via MEO missile-warning satellites.","Golden Dome對BAE影響有限；歐洲重整軍備、潛艇與彈藥驅動此輪上修。美國太空業務（原Ball Aerospace）透過中軌導彈預警衛星與GD相關。"]},
{name:"Kratos Defense & Security",ticker:"Nasdaq: KTOS",cat:"prime",tags:[{label:["GMI Prime <b>$446.8M</b>","GMI主承商 <b>$4.468</b>億"],color:"red"},{label:["MACH-TB 2.0 (<b>$1.45B</b>)","MACH-TB 2.0(<b>$14.5</b>億)"],color:"amber"},{label:["Hypersonics Leader","高超音速領導者"],color:"red"},{label:["Golden Dome Adjacent","Golden Dome關聯"],color:"purple"}],summary:["<b>$446.8M</b> SSC GMI prime (Apr 2026, NOC as sub); Q2'26 revenue $458.8M (+30.5%, 19.1% organic); FY26 guide raised to $1.75–1.81B; backlog $2.08B ($1.57B funded); $1.44B cash, no LT debt; MACH-TB 2.0; Prometheus SRM JV with Rafael (2027 production).","<b>$4.468億</b>SSC GMI主承商（2026年4月，NOC為分包）；2026年Q2營收$4.588億（+30.5%，內生19.1%）；FY26指引上調至$17.5–18.1億；積壓$20.8億（已資助$15.7億）；現金$14.4億、無長期債務；MACH-TB 2.0；與Rafael合資Prometheus固體火箭發動機（2027年量產）。"],role:["Golden Dome-adjacent via multiple vectors. MACH-TB 2.0 prime provides the affordable hypersonic test infrastructure Golden Dome interceptors need. 10-K explicitly cites 'Golden Dome strategic defense system' alignment. Erinyes flew Mach 5+ for MDA HTB-1 (Jun 2024, developed in 3 years for <<b>$15M</b>). Prometheus JV with Rafael USA (Iron Dome/David's Sling manufacturer) for SRMs and warheads. <b>CEO DeMarco</b>: 'step function catalyst.' Microwave electronics embedded in Iron Dome, Arrow, Patriot, THAAD, IBCS, IFPC — virtually every ground system Golden Dome integrates. 55,000 sq ft Princess Anne MD facility near NASA Wallops. Expanding Israel facilities including space-qualified. Subcontracted Rocket Lab <b>$190M</b> for 20 HASTE launches (Mar 18, 2026).","通過多重渠道與Golden Dome關聯。MACH-TB 2.0主承商提供攔截器開發所需的測試基礎設施。年報明確引述Golden Dome。Erinyes 2024年6月以超5馬赫為MDA試飛。與Rafael USA成立Prometheus合資。微波電子元件嵌入所有地面系統。55,000平方英尺Princess Anne工廠。分包RKLB <b>$1.9</b>億/20次HASTE（2026年3月18日）。"],contracts:[{name:"MACH-TB 2.0 Task Area 1 (Prime)",value:"<b>$1.45B</b> (5-yr OTA, Jan 6 2025)",agency:["TRMC / NSWC Crane Division (OUSD R&E)","TRMC/NSWC Crane（研發工程次長辦公室）"],type:["Other Transaction Agreement (OTA)","OTA"],pop:["Jan 2025 – Jan 2030 (5-yr if all options)","2025年1月–2030年1月（5年全選項）"],desc:["<p>Largest KTOS contract ever.</p><ul><li>SEIT including subscale, full-scale, air launch services to increase hypersonic flight test cadence.</li><li>Team: Leidos, Rocket Lab (<b>$190M</b>/20 HASTE, announced Mar 18 2026), Stratolaunch, Koda, Corvid, Northwind, JRC, PAR Systems, CFD Research, UMN, Purdue.</li><li>Erinyes is one hypersonic frontend.</li><li>TRMC Director Rumford: 'essential tool to accelerate science and technology into next-gen hypersonic capabilities.' NOT a direct Golden Dome contract but provides critical test infrastructure. 55,000 sq ft Princess Anne facility established for MACH-TB.</li></ul>","<p>KTOS歷史最大合約。</p><ul><li>團隊：Leidos、Rocket Lab（<b>$1.9億</b>/20次HASTE，2026年3月18日）、Stratolaunch等。</li><li>Erinyes為高超音速前端之一。</li><li>TRMC主任Rumford：「加速科技轉化的關鍵工具。</li><li>」非直接Golden Dome合約但提供關鍵測試基礎設施。</li></ul>"]},{name:"MDA HTB-1 / Erinyes Flight",value:"Undisclosed",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["Contract + Company IR&D","合約+公司內部研發"],pop:["~2021 – Jun 2024 (first flight)","~2021–2024年6月（首飛）"],desc:["<p>Erinyes flew Mach 5+ for MDA's first Hypersonic Testbed mission (Jun 2024).</p><ul><li>Developed in 3 years for <<b>$15M</b>.</li><li>Vehicle cost ~<b>$5M</b> without motor.</li><li>Directly relevant to SBI development — Pentagon needs to dramatically increase flight test frequency for 2028 IOC.</li></ul>","<p>Erinyes 2024年6月以超5馬赫為MDA首次HTB-1任務試飛。</p><ul><li>3年<<b>$1,500萬</b>開發。</li><li>載具不含發動機~<b>$500萬</b>。</li><li>與SBI開發直接相關。</li></ul>"]},{name:"Prometheus JV with Rafael USA",value:"Undisclosed ('step function catalyst' — CEO)",agency:["N/A (commercial JV)","不適用（商業合資）"],type:["Joint Venture Agreement","合資協議"],pop:["2025 – ongoing (ramp to FRP)","2025–進行中（爬坡至全速生產）"],desc:["<p>JV with Rafael (Iron Dome/David's Sling/Iron Beam manufacturer).</p><ul><li>Full-rate SRM and warhead production, <b>'Americanizing'</b> Israeli energetics.</li><li><b>CEO DeMarco</b>: 'tens of thousands of SRMs and warheads for both Israel and U.S. national security demand.' Feeds Golden Dome interceptor supply chain directly.</li></ul>","<p>與Rafael（Iron Dome/David's Sling/Iron Beam製造商）合資。</p><ul><li>量產固體火箭發動機和戰鬥部。</li><li>CEO：「數萬枚為以色列和美國國安需求。</li><li>」直接供應Golden Dome攔截器供應鏈。</li></ul>"]},{name:"Oriole SRM + Microwave Electronics",value:"60 units ordered + multi-program ongoing",agency:["Multiple (MDA, USSF, intl)","多個（MDA、太空軍、國際）"],type:["FFP production orders","FFP生產訂單"],pop:["Ongoing","進行中"],desc:["<p>Oriole: up to 60 SRMs for 'ballistic missile defense-related' missions.</p><ul><li>Microwave electronics embedded in Iron Dome, Iron Sting, Arrow, Patriot, THAAD, IBCS, IFPC — virtually every ground system Golden Dome integrates.</li><li>Expanding Israel manufacturing including space-qualified facility.</li></ul>","<p>Oriole：最多60枚SRM用於「彈道導彈防禦」任務。</p><ul><li>微波電子元件嵌入Iron Dome、Arrow、愛國者、THAAD、IBCS、IFPC——幾乎所有Golden Dome整合的地面系統。</li></ul>"]},{name:"Resilient MWT Ground Management & Integration (GMI)",value:"Up to <b>$446.8M</b> (OTA, all options)",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["Other Transaction Agreement (OTA) — Prime Contractor / System Integrator","OTA——主承商/系統整合商"],pop:["Apr 2026 – ongoing (multi-year)","2026年4月–進行中（多年期）"],desc:["<p>Announced <b>April 8, 2026</b>. Kratos awarded up to <b>$446.8M</b> as PRIME contractor for the U.S. Space Force Space Systems Command's Ground Management & Integration (GMI) program — the ground architecture for the Resilient Missile Warning & Tracking (MWT) constellation in Medium Earth Orbit (MEO).</p><ul><li><b>Materiality:</b> Contract equals ~33% of Kratos's FY2025 revenue ($1.35B). Stock up ~7% on announcement.</li><li><b>Golden Dome Relevance:</b> MWT MEO tracks hypersonic glide vehicles and maneuvering ballistic missiles — a cornerstone sensor layer for Golden Dome's detection chain. Kratos operates the GROUND system that receives data from Boeing's 12 Resilient MWT sats + BAE's Epoch 2 sats + future additions.</li><li><b>Structural Reversal:</b> Kratos leads a team including <b>Northrop Grumman</b> (as subcontractor!), Auria, ASRC Federal, and Rise8 — mirroring the C2 consortium pattern where traditional primes now work as subs to specialized integrators.</li><li><b>OpenSpace Platform:</b> Leverages Kratos's software-defined ground system, integrated with DoW's Future Operationally Resilient Ground Evolution (FORGE) platform for multi-vendor interoperability.</li><li><b>Phil Carrai (President, Kratos Space/Training/Cyber):</b> 'Our long-standing investments in advanced space and communications technologies are enabling us to take on programs of increasing scale and importance.'</li><li><b>Greg Caicedo (SVP Kratos Space):</b> 'A globally distributed ground architecture is essential for integrating multiple satellites, providers and mission systems.'</li><li><b>Existing GD-adjacent work:</b> Also holds CCS-C Sustainment (C-SAR) contract with SSC, and Advanced Fire Control Ground Infrastructure (AFCGI) with SDA.</li></ul>","<p>2026年4月8日宣布。Kratos獲高達<b>$4.468億</b>OTA，擔任美國太空軍太空系統司令部（SSC）地面管理與整合（GMI）計劃的主承商——為中地球軌道（MEO）韌性導彈預警與追蹤（MWT）星座提供地面架構。</p><ul><li><b>重要性：</b>合約價值相當於Kratos FY2025營收（$13.5億）的~33%。宣布後股價上漲~7%。</li><li><b>Golden Dome相關性：</b>MWT MEO追蹤高超音速滑翔載具和機動彈道導彈——Golden Dome偵測鏈的基石感測器層。Kratos運營接收Boeing 12顆Resilient MWT衛星+BAE Epoch 2衛星的地面系統。</li><li><b>結構性逆轉：</b>Kratos領導團隊包括<b>Northrop Grumman（作為分包商！）</b>、Auria、ASRC Federal和Rise8——呼應C2財團模式，傳統巨頭為專業整合商的分包商。</li><li><b>OpenSpace平台：</b>利用Kratos軟體定義地面系統，整合DoW的FORGE平台實現多供應商互操作。</li><li><b>Carrai（Kratos太空/訓練/網路部總裁）：</b>「我們在先進太空和通訊技術的長期投資正使我們能承擔規模和重要性不斷提升的計劃。」</li><li><b>既有GD相關工作：</b>亦持有SSC的CCS-C維護（C-SAR）合約，以及SDA的先進火控地面基礎設施（AFCGI）。</li></ul>"]}],partners:["Northrop Grumman (GMI sub)","Auria","ASRC Federal","Rise8","Rafael USA (Prometheus)","Rocket Lab (<b>$190M</b> HASTE)","Leidos","Stratolaunch"],mkt:"public",rev:["$1.347B (FY2025, 10-K); FY26 guide $1.75–1.81B","$13.47億（FY2025，10-K）；FY26指引$17.5–18.1億"],gdVal:["GD-related ceilings ~$1.9B (MACH-TB 2.0 $1.45B IDIQ + GMI ≤$446.8M) — ceilings, not funded backlog","GD相關合約上限約$19億（MACH-TB 2.0 $14.5億IDIQ＋GMI≤$4.468億）——為上限而非已資助積壓"],exp:"high",invNote:["<b>Correction and re-rating to High.</b> Earlier versions described ~$1.9B of 'funded' GD backlog — that figure sums contract ceilings (MACH-TB 2.0 IDIQ + GMI OTA), not funded orders; company-wide backlog is $2.08B ($1.57B funded) across all programs. The thesis is intact: Kratos is prime on the MWT ground layer (GMI, with Northrop as sub), runs hypersonic test infrastructure (MACH-TB) and is building SRM capacity with Rafael (Prometheus, 2027) as Congress pushes for a second SRM source. Q2 was a clean beat-and-raise with a net-cash balance sheet; profitability stays thin (~1% net margin) through the investment cycle.","<b>更正並調整評級為「高」。</b>先前版本稱約$19億「已資助」GD積壓——該數字為合約上限加總（MACH-TB 2.0 IDIQ＋GMI OTA），並非已資助訂單；全公司積壓為$20.8億（已資助$15.7億），涵蓋所有計劃。投資論點不變：Kratos為MWT地面層主承商（GMI，諾格為分包）、營運高超音速測試基礎設施（MACH-TB），並與Rafael建立SRM產能（Prometheus，2027年），正值國會推動第二SRM來源。Q2業績超預期並上調指引，資產負債表為淨現金；投資期間獲利仍薄（淨利率約1%）。"]},
{name:"True Anomaly",ticker:"Private (<b>$2.2B</b> val., Apr 2026)",cat:"startup",tags:[{label:["Space Startup","太空新創"],color:"orange"},{label:["SBI Prototype","太空攔截器原型"],color:"cyan"},{label:["Jackal/Mosaic","Jackal/Mosaic"],color:"purple"}],summary:["Series D <b>$650M</b> at $2.2B (Apr 28, 2026), ~$1B raised; SBI prime (OTA, Gate 1 passed); selected for Andromeda GEO surveillance ($1.8B program); Jackal RPO vehicles + Mosaic autonomy; VICTUS HAZE; target 50 Jackals/yr.","D輪<b>$6.5億</b>、估值$22億（2026年4月28日），累計約$10億；SBI主承商（OTA，已過第一關）；入選Andromeda同步軌道監視計劃（$18億）；Jackal交會接近載具＋Mosaic自主軟體；VICTUS HAZE；目標年產50架Jackal。"],role:["Builds Jackal (autonomous orbital vehicle) and Mosaic (AI space domain awareness OS). Classified OTA for SBI prototypes (Nov 2025). <b>$30M</b> VICTUS HAZE with Firefly. SVP Kitay (ex-Pentagon space policy lead). <b>$389M</b> raised. JD Vance-linked VC. Jackal/Mosaic scheduled for first independent GEO and cislunar missions 2026.","Jackal自主軌道載具和Mosaic AI太空態勢感知OS。獲機密OTA太空攔截器原型合約。<b>$3,000</b>萬VICTUS HAZE。2026年首次GEO和月球軌道獨立任務。"],contracts:[{name:"SBI Prototype — Part of $3.2B/12-firm Pool",value:"Share of <b>$3.2B</b> pool (Apr 24, 2026 — 20 OTAs to 12 firms)",agency:["U.S. Space Force (SSC)","太空軍（SSC）"],type:["OTA","OTA"],pop:["Nov 2025 – TBD","2025年11月–待定"],desc:["<p>Among 18 firms.</p><ul><li>Jackal provides maneuverable platform potentially adaptable for SBI — autonomous rendezvous and proximity operations capability.</li><li>Company publicly named despite classification.</li><li>Future production contracts worth billions annually.</li></ul><p>Named an SBI prime on Apr 24, 2026; four days later raised a $650M Series D at $2.2B.</p><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>18家之一。</p><ul><li>Jackal提供可適用於SBI的可機動平台。</li><li>儘管屬機密，公司名稱已公開。</li><li>未來生產合約每年價值數十億。</li></ul><p>2026年4月24日獲列SBI主承商；四天後完成$6.5億D輪、估值$22億。</p><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]},{name:"VICTUS HAZE",value:"<b>$30M</b> (Space Force)",agency:["U.S. Space Force (SpaceWERX)","太空軍（SpaceWERX）"],type:["OTA","OTA"],pop:["2024 – 2026","2024–2026年"],desc:["<p>Tactically responsive space demonstration with Firefly Aerospace.</p><ul><li>Demonstrates rapid orbital maneuver and quick-reaction space operations relevant to Golden Dome responsive orbital engagement requirements.</li></ul>","<p>與Firefly的太空軍戰術響應演示。</p><ul><li>展示Golden Dome所需的快速軌道機動能力。</li></ul>"]}],partners:["Firefly Aerospace","Anduril"],mkt:"private",rev:["Early revenue (~$1B raised to date)","早期營收（累計籌資約$10億）"],gdVal:["~$40M (SBI OTA + VICTUS HAZE)","~$4,000萬（SBI OTA + VICTUS HAZE）"],exp:"vhigh",invNote:["Private. The only venture-backed company built purely for space defense — a strength (focus) and a risk (no commercial fallback if SBI is descoped). After the SBI selection the Series D funds a push to 500+ staff by end-2026 and 1,000 by 2028. Watch Gate 2 and VICTUS HAZE execution; an early Jackal mission (2024) had communications issues.","未上市。唯一純粹為太空國防而建的創投支持企業——專注是優勢，若SBI被刪減則缺乏商業退路是風險。獲選SBI後，D輪資金支持2026年底擴至500+人、2028年1,000人。關注第二關及VICTUS HAZE執行；2024年早期Jackal任務曾出現通訊問題。"]},
{name:"Apex Space",ticker:"Private (<b>$2.3B</b> val., Jun 2026)",cat:"startup",tags:[{label:["NOC SBI Collaborator","NOC SBI合作"],color:"red"},{label:["Satellite Bus Mfr.","衛星平台製造"],color:"orange"},{label:["Orbital Magazine","軌道彈藥庫"],color:"red"},{label:["Anduril Partner","Anduril合作"],color:"purple"}],summary:[">$200M at <b>$2.3B</b> (Jun 5, 2026), ~$718M raised; Northrop SBI demo partner (on-orbit 2027); Project Shadow (Nova 1) self-funded SBI host demo targeted 2026 — launch not yet publicly confirmed; Anduril partner; 200+ buses/yr capacity.","2026年6月5日融資逾$2億、估值<b>$23億</b>，累計約$7.18億；諾格SBI演示合作夥伴（2027年在軌）；Project Shadow（Nova 1）自籌SBI載台演示目標2026年——發射尚未公開確認；Anduril合作夥伴；年產能200+平台。"],role:["Builds interceptor platforms, not interceptors. Aries (~100kg), Nova (~500kg), Comet (~5,000kg). Orbital Magazine: Comet carries up to 6 interceptors. 200+/yr factory capacity. <b>CEO Cinnamon</b>: unit cost <b>$6</b>-10M depending on config. Self-funded <b>$15M</b> Project Shadow (launch NET Jun 2026): Nova bus with software-defined radio transmitting Link-182 (USSF Milnet standard). Pre-integrating into DoD architecture. Anduril partnership for defense payload buses. Two <b>$200M</b> rounds. <b>$1B+</b> valuation.","製造攔截器載台。Comet可搭載6枚攔截器。年產能200+。單價<b>$600</b>-1,000萬。<b>$1,500</b>萬Project Shadow（2026年6月）：Link-182預整合Milnet。與Anduril合作。兩輪各<b>$2</b>億融資。"],contracts:[{name:"Project Shadow (Self-funded Demo)",value:"<b>$15M</b> (NET Jun 2026)",agency:["N/A (company self-funded)","不適用（公司自資）"],type:["Internal investment","內部投資"],pop:["2025 – NET Jun 2026 (launch)","2025–預計2026年6月"],desc:["<p>In-orbit demo of Orbital Magazine — spacecraft storing, thermally controlling, deploying kinetic interceptors. Nova bus with Link-182 (USSF Milnet standard).</p><ul><li><b>CEO Cinnamon</b>: 'We want to mature the tech to make sure it works.</li><li>Then we go to large primes and say we're really good at the Orbital Magazine.' No live interceptors — proving enabling tech.</li><li>Unit cost ~<b>$6</b>-10M.</li><li>Experts estimate thousands of interceptors needed for coverage.</li></ul><p><b>Status (Sep 2026):</b> targeted for summer 2026 on Nova 1 (first Nova flight); no public confirmation of launch as of this update.</p>","<p>軌道彈藥庫在軌演示。</p><ul><li>Nova平台搭載Link-182（Milnet標準）。</li><li><b>CEO Cinnamon</b>：「我們要確保技術可行，然後告訴大型主承商我們在軌道彈藥庫方面很出色。</li><li>」不搭載實彈。</li><li>專家估計需數千枚攔截器。</li></ul><p><b>狀態（2026年9月）：</b>原定2026年夏季搭載Nova 1（Nova首飛）；截至本次更新尚無公開發射確認。</p>"]},{name:"Anduril Bus Supply Partnership",value:"Undisclosed",agency:["N/A (commercial partnership)","不適用（商業合作）"],type:["Strategic supply agreement","戰略供應協議"],pop:["2024 – ongoing","2024–進行中"],desc:["<p>Strategic bus supply for Anduril defense payloads.</p><ul><li>Tier-1-to-tier-2 relationship forming ahead of formal Golden Dome production awards.</li><li>Anduril payloads (including SBI components) on Apex mass-manufactured platforms.</li></ul>","<p>為Anduril國防載荷供應衛星平台。</p><ul><li>在正式授標前形成的供應鏈關係。</li></ul>"]},{name:"Northrop Grumman SBI Demonstration (Collaborator)",value:"Subcontract/collaboration (NOC company-funded demo)",agency:["U.S. Space Force (via Northrop Grumman)","美國太空軍（經Northrop Grumman）"],type:["Industrial collaboration","工業合作"],pop:["Jun 2026 – 2027 (on-orbit demo)","2026年6月–2027年（在軌演示）"],desc:["<p>June 1, 2026: When Space Force selected Northrop Grumman to demonstrate space-based interceptor capabilities, Apex was named as a key industrial collaborator.</p><ul><li><b>Apex role:</b> Satellite bus/platform provider for NOC's SBI demonstration spacecraft.</li><li><b>CEO Ian Cinnamon:</b> 'Apex was founded specifically to support proliferated constellations like Golden Dome, which will require satellites to create a decisive defensive advantage for our nation.'</li><li><b>Timeline:</b> NOC on track for on-orbit demonstration by 2027 following successful 2026 ground tests.</li><li>Reinforces Apex's position as the go-to bus supplier for SBI hosts across multiple primes (also Anduril partner).</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>2026年6月1日：太空軍選擇Northrop Grumman演示太空攔截器能力時，Apex被列為關鍵工業合作夥伴。</p><ul><li><b>Apex角色：</b>為NOC的SBI演示航天器提供衛星平台。</li><li><b>CEO Cinnamon：</b>「Apex專為支持Golden Dome這類大規模星座而創立。」</li><li><b>時間線：</b>NOC在2026年地面測試成功後，預計2027年進行在軌演示。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["Anduril","Link-182/Milnet"],mkt:"private",rev:["Early revenue (~$718M raised)","早期營收（累計籌資約$7.18億）"],gdVal:["$15M self-funded demo + Anduril partnership (TBD)","$1,500萬自資演示 + Anduril合作（待定）"],exp:"vhigh",invNote:["Private. Apex is positioning as the bus supplier to every SBI team (Anduril, Northrop) rather than an interceptor maker — a picks-and-shovels stance that wins regardless of which prime prevails, provided SBI survives the affordability gates. Valuation more than doubled in nine months with limited flight heritage (one Aries flown; Nova and Comet unflown).","未上市。Apex定位為所有SBI團隊（Anduril、諾格）的衛星平台供應商而非攔截器製造商——只要SBI通過可負擔性關卡，不論哪家主承商勝出皆受惠的「賣鏟子」策略。估值九個月內翻倍以上，但飛行實績有限（僅一顆Aries升空；Nova與Comet尚未飛行）。"]},
{name:"Booz Allen Hamilton",ticker:"NYSE: BAH",cat:"services",tags:[{label:["SBI $3.2B Pool","SBI $32億池"],color:"red"},{label:["Advisory","顧問"],color:"amber"},{label:["Brilliant Swarms","智能蜂群"],color:"pink"},{label:["SHIELD Phase 1","SHIELD第1階段"],color:"emerald"}],summary:["SBI OTA holder; Q1 FY27 revenue $2.8B (−4.2%) amid civil weakness, national-security funded backlog +23%; backlog $39B; FY27 guide $11.2–11.7B; Booz Allen Ventures backs Quindar (fellow SBI awardee); acquiring Ultra IMC Mission Solutions.","SBI OTA持有者；FY27 Q1營收$28億（−4.2%），民用業務疲弱，國安已資助積壓+23%；積壓$390億；FY27指引$112–117億；Booz Allen Ventures投資Quindar（同為SBI得主）；收購Ultra IMC Mission Solutions。"],role:["Proposed 'Brilliant Swarms' 1,000-2,000 satellite architecture for Golden Dome custody layer. Partners TBD. Competes vs SpaceX-Palantir-Anduril consortium. SHIELD Phase 1 awardee (Dec 2, 2025). Systems engineering, digital twin, simulation.","提出「智能蜂群」1,000-2,000衛星架構。合作夥伴待定。與SpaceX-Palantir-Anduril競爭。SHIELD第1階段授標（2025年12月2日）。"],contracts:[{name:"SBI Prototype OTA (part of $3.2B/12-firm pool)",value:"Share of <b>$3.2B</b> pool (20 OTAs)",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["OTA (prize-based, 4 gates)","OTA（獎勵制，4道關卡）"],pop:["Late 2025 – 2028 demo","2025年底–2028年演示"],desc:["<p>Booz Allen holds one of the 20 SBI OTAs (Apr 24, 2026 disclosure). Its venture arm is also an investor in fellow awardee Quindar.</p><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>Booz Allen持有20份SBI OTA之一（2026年4月24日披露）。其創投部門亦投資同為得主的Quindar。</p><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]},{name:"'Brilliant Swarms' Proposal",value:"TBD (bid stage)",agency:["DoD / Golden Dome Office (bid stage)","國防部（競標階段）"],type:["Proposal (not yet awarded)","提案（尚未授標）"],pop:["TBD","待定"],desc:["<p>Proposed architecture of 1,000–2,000 satellites for Golden Dome's sensing/custody layer — the most ambitious constellation proposal publicly announced. Competes directly against the SpaceX-Palantir-Anduril consortium's 400–1,000 tracking + 200 attack satellite proposal.</p><ul><li>The <b>'Brilliant Swarms'</b> name deliberately echoes the SDI-era <b>'Brilliant Pebbles'</b> concept from the 1980s that Northrop Grumman originally developed.</li><li>Partner companies have not been publicly identified, suggesting either early-stage negotiations or intentional secrecy.</li><li>If selected, this would represent one of the largest satellite constellation procurements in history, potentially exceeding SpaceX's Starlink in total unit count.</li><li>Booz Allen's deep institutional knowledge of DoD acquisition processes and systems engineering experience positions it as an integrator rather than a hardware manufacturer — it would likely orchestrate a consortium of satellite and component manufacturers.</li></ul>","<p>為Golden Dome感知/監測層提出1,000–2,000顆衛星架構——公開宣布中最具雄心的星座提案。直接與SpaceX-Palantir-Anduril聯盟的400–1,000+200顆方案競爭。</p><ul><li>「智能蜂群」名稱刻意呼應1980年代SDI「Brilliant Pebbles」概念。</li><li>合作夥伴未公開。</li><li>如獲選將是有史以來最大的衛星星座採購之一。</li><li>Booz Allen作為整合商而非硬體製造商定位。</li></ul>"]},{name:"SHIELD IDIQ (Phase 1)",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>First-tranche awardee (Dec 2, 2025) — among the initial 1,014 companies selected from 2,463 offers.</p><ul><li>Positioned for systems engineering, digital twin environments, simulation, and modeling task orders.</li><li>Booz Allen's deep institutional knowledge of DoD acquisition processes — spanning decades of advisory work across every military service and defense agency — makes it particularly valuable for the enormously complex integration challenges Golden Dome presents.</li><li>Gen.</li><li>Guetlein has described Golden Dome as a 'monster systems engineering problem,' which plays directly to Booz Allen's core competencies in large-scale defense system architecture and integration.</li></ul>","<p>第一批授標（2025年12月2日）——從2,463份投標中選出的1,014家公司之一。</p><ul><li>定位於系統工程、數位孿生、模擬和建模任務訂單。</li><li>Booz Allen對國防部採購流程的深厚制度知識——跨越數十年軍事諮詢——使其在Golden Dome呈現的巨大複雜整合挑戰中特別有價值。</li><li>Guetlein將軍描述Golden Dome為「巨型系統工程問題」，直接契合Booz Allen的核心能力。</li></ul>"]}],partners:["TBD"],mkt:"public",rev:["$11.22B (FY2026 ended Mar, 10-K); FY27 guide $11.2–11.7B","$112.2億（FY2026，截至3月，10-K）；FY27指引$112–117億"],gdVal:["SBI OTA + SHIELD IDIQ (no disclosed GD task orders)","SBI OTA＋SHIELD IDIQ（未披露GD任務訂單）"],exp:"low",invNote:["Holding an SBI OTA moves BAH beyond a pure 'hunting licence', but its role is likely systems engineering/integration rather than hardware, and values are undisclosed. The stock's drivers are civil-agency cuts and the pivot to defense tech; Golden Dome is optionality.","持有SBI OTA使BAH不再只是「狩獵許可證」，但角色較可能是系統工程/整合而非硬體，且金額未披露。股價驅動因素為民用機構削減及轉向國防科技；Golden Dome屬選擇權。"]},
{name:"Viasat",ticker:"Nasdaq: VSAT",cat:"satellite",tags:[{label:["Secure Comms","安全通訊"],color:"emerald"},{label:["SHIELD Phase 1","SHIELD第1階段"],color:"blue"}],summary:["SHIELD Phase 1; protected waveforms, resilient satcom transport, network-of-networks modeling, C2 interface simulation.","SHIELD第1階段；保護波形、彈性衛星通訊、網絡建模、C2介面模擬。"],role:["Protected waveforms, resilient satcom transport, C2 interface simulation. Critical for Golden Dome data distribution ensuring sensor data reaches interceptors securely with sufficient bandwidth.","保護波形、彈性衛星通訊、C2介面模擬。確保感測器數據安全到達攔截器。"],contracts:[{name:"SHIELD IDIQ (Phase 1)",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Early-confirmed Phase 1 awardee (Dec 2, 2025).</p><ul><li>Viasat's expertise in protected waveforms, resilient satellite communications transport layers, and network-of-networks modeling makes it a natural fit for Golden Dome's data distribution challenge — ensuring that weapons-quality targeting data from orbital sensors (AMTI, SDA tracking layer, Starshield, MWT) reaches ground interceptors, battle management nodes, and fighter crews securely and with sufficient bandwidth in contested electromagnetic environments.</li><li>C2 interface simulation and verification capability is particularly relevant as Golden Dome integrates multiple constellation architectures (AMTI ~600 sats, PWSA tracking/transport layers, Milnet, MWT MEO) into a unified data fabric that must function under peer adversary EW jamming conditions.</li></ul>","<p>早期Phase 1授標者（2025年12月2日）。</p><ul><li>Viasat在保護波形、彈性衛星通訊傳輸層和網絡建模方面的專業使其適合Golden Dome的數據分配挑戰——確保來自軌道感測器（AMTI、SDA追蹤層、Starshield、MWT）的武器級瞄準數據在受電磁對抗的環境中安全且足夠帶寬地到達地面攔截器、戰鬥管理節點和飛行員。</li><li>C2介面模擬能力在Golden Dome整合多個星座架構（AMTI~600顆、PWSA追蹤/傳輸層、Milnet、MWT中軌）為統一數據結構時尤為關鍵——該結構必須在對等對手電子戰干擾條件下運作。</li></ul>"]}],partners:["MDA","USSF"],mkt:"public",rev:["$4.64B (FY2026 ended Mar, 10-K); Q1 FY27 $1.16B","$46.4億（FY2026，截至3月，10-K）；FY27 Q1 $11.6億"],gdVal:["IDIQ qualification only — no funded Task Orders yet","僅IDIQ資格——尚無已資助任務訂單"],exp:"low",invNote:["<b>⚠ IDIQ qualification only.</b> Well-positioned for secure comms task orders but zero funded GD backlog currently. Viasat's primary growth driver remains commercial broadband and government satcom, not Golden Dome.","<b>⚠ 僅IDIQ資格。</b>在安全通訊任務訂單方面有競爭力但目前零GD已資助積壓。Viasat主要增長動力仍是商用寬頻和政府衛星通訊。"]},
{name:"Elbit America (Elbit Systems)",ticker:"Nasdaq: ESLT",cat:"prime",tags:[{label:["Israeli Defense","以色列國防"],color:"blue"},{label:["Iron Dome Expertise","Iron Dome專業"],color:"red"},{label:["SHIELD","SHIELD"],color:"emerald"}],summary:["US arm of Elbit Systems (Iron Dome/Iron Beam know-how); parent Q2'26 revenue $2.29B (+15.9%), record <b>$32B</b> backlog; Elbit America +17%; new airborne high-power laser; SHIELD-qualified.","Elbit Systems美國子公司（Iron Dome/Iron Beam經驗）；母公司2026年Q2營收$22.9億（+15.9%），創紀錄<b>$320億</b>積壓；Elbit America +17%；新推機載高能雷射；具SHIELD資格。"],role:["U.S. subsidiary of Israel's Elbit Systems, key Iron Dome contractor. Bridges decades of Israeli missile defense technology and thousands of real-world intercept engagements into Golden Dome.","以色列Elbit Systems美國子公司。將數十年以色列導彈防禦技術和數千次實戰攔截經驗引入Golden Dome。"],contracts:[{name:"SHIELD IDIQ Awardee",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Iron Dome operational data from thousands of real-world engagements provides unique differentiation directly applicable to Golden Dome's multi-layer architecture.</p><ul><li>Intercept algorithms refined through thousands of actual rocket, missile, and drone engagements since Iron Dome became operational in 2011.</li><li>Sensor fusion techniques proven in the most demanding operational environment — simultaneous multi-threat salvos from Hamas, Hezbollah, and Iranian forces.</li><li>Rapid engagement decision logic enabling sub-second shoot/no-shoot determinations, critical for Golden Dome's automated battle management layer.</li><li>Elbit's EW, C4ISR, and UAV capabilities provide additional touchpoints across Golden Dome's ground and airborne sensing layers.</li></ul>","<p>Iron Dome數千次實戰攔截數據為Golden Dome的多層架構提供獨特且直接適用的優勢。</p><ul><li>自2011年Iron Dome投入運營以來，攔截算法經過數千次實際火箭、導彈和無人機交戰的精煉。</li><li>感測器融合技術在最嚴苛的作戰環境中得到驗證——哈馬斯、真主黨和伊朗同時多重威脅齊射。</li><li>快速交戰決策邏輯實現亞秒級射擊/不射擊判斷，對Golden Dome自動化戰鬥管理層至關重要。</li><li>Elbit的電子戰、C4ISR和無人機能力為Golden Dome的地面和空中感知層提供額外觸點。</li></ul>"]}],partners:["Iron Dome","Rafael"],mkt:"public",rev:["$7.94B (parent FY2025, 20-F); Q2'26 $2.29B (+15.9%)","$79.4億（母公司FY2025，20-F）；2026年Q2 $22.9億（+15.9%）"],gdVal:["IDIQ qualification only","僅IDIQ資格"],exp:"low",invNote:["Iron Dome/Iron Beam heritage and high-power-laser work fit Golden Dome's Epic 2 directed-energy phase (post-2028), but there are still no disclosed GD awards. Growth comes from Israeli replenishment and European demand; the US arm grew 17% in Q2.","Iron Dome/Iron Beam經驗與高能雷射研發契合Golden Dome Epic 2定向能階段（2028年後），但仍無已披露GD合約。成長來自以色列補庫與歐洲需求；美國子公司Q2成長17%。"]},
{name:"General Atomics",ticker:"Private",cat:"prime",tags:[{label:["Directed Energy","定向能"],color:"red"},{label:["SHIELD","SHIELD"],color:"emerald"}],summary:["SHIELD-qualified; high-energy lasers, satellite systems, electromagnetic launch — the non-kinetic layer explicitly funded in Golden Dome's <b>$25B</b> reconciliation act.","SHIELD授標；高能雷射、衛星系統、電磁發射——<b>$250</b>億調和法案明確資助的非動能層。"],role:["High-energy lasers, satellite systems, electromagnetic launch. Golden Dome's <b>$25B</b> reconciliation act explicitly funds 'non-kinetic missile defense effects.' Lasers could defeat drone swarms and small missiles at dollars-per-shot versus millions-per-interceptor.","高能雷射、衛星系統、電磁發射。<b>$250</b>億調和法案明確資助「非動能導彈防禦效果」。雷射可以每發數美元擊敗無人機群。"],contracts:[{name:"SHIELD IDIQ Awardee",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Directed energy, satellite, electromagnetic systems.</p><ul><li><b>$25B</b> reconciliation act explicitly funds 'non-kinetic missile defense effects.<b>' GA'</b>s high-energy lasers could defeat swarms at cents-per-shot — a transformative capability for Golden Dome's lower defense tiers where kinetic interceptors are economically impractical.</li></ul>","<p>定向能、衛星、電磁系統。</p><ul><li><b>$250億</b>調和法案明確資助「非動能效果」。</li><li>GA雷射每發數美元——對Golden Dome低層防禦具變革性。</li></ul>"]}],partners:["MDA","USSF"],mkt:"private",rev:["~$4-5B (private estimate)","~$40-50億（私人估計）"],gdVal:["IDIQ qualification only","僅IDIQ資格"],exp:"low",invNote:["Private — not directly investable. Directed energy is explicitly an Epic 2 (2028–2035) capability per Guetlein (Sep 2026), so near-term Golden Dome revenue for GA's lasers is unlikely; its UAS/CCA and satellite businesses matter more in the interim.","未上市——無法直接投資。Guetlein（2026年9月）明確將定向能列為Epic 2（2028–2035年）能力，GA雷射短期內難有Golden Dome營收；過渡期其無人機/CCA與衛星業務更重要。"]},
{name:"General Dynamics",ticker:"NYSE: GD",cat:"prime",tags:[{label:["SBI $3.2B Pool","SBI $32億池"],color:"red"},{label:["Defense Prime","國防主承商"],color:"blue"},{label:["C4ISR/Cyber","C4ISR/網安"],color:"amber"},{label:["SHIELD","SHIELD"],color:"emerald"}],summary:["GD Mission Systems holds an SBI OTA; Q2'26 revenue $14.1B (+8.1%), record <b>$136.5B</b> backlog (+32%); FY26 revenue ~$55.7B; GDIT won more OTAs in H1'26 than in all of 2025; SHIELD C4ISR/cyber.","GD任務系統持有SBI OTA；2026年Q2營收$141億（+8.1%），創紀錄<b>$1,365億</b>積壓（+32%）；FY26營收約$557億；GDIT上半年所獲OTA多於2025全年；SHIELD C4ISR/網安。"],role:["C4ISR, cybersecurity, secure comms, network integration. Golden Dome's interconnected architecture creates enormous cyber risks across 19 SHIELD performance areas. GD's cybersecurity expertise directly relevant.","C4ISR、網路安全、安全通訊、網絡整合。Golden Dome互聯架構帶來巨大網路風險。GD的網安專業直接相關。"],contracts:[{name:"SBI Prototype OTA (part of $3.2B/12-firm pool)",value:"Share of <b>$3.2B</b> pool (20 OTAs)",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["OTA (prize-based, 4 gates)","OTA（獎勵制，4道關卡）"],pop:["Late 2025 – 2028 demo","2025年底–2028年演示"],desc:["<p>General Dynamics Mission Systems holds one of the 20 SBI OTAs (Apr 24, 2026 disclosure).</p><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>General Dynamics任務系統持有20份SBI OTA之一（2026年4月24日披露）。</p><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]},{name:"SHIELD IDIQ Awardee",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>C4ISR, ground systems, network integration, cybersecurity.</p><ul><li>Golden Dome's cybersecurity challenge is unprecedented — 19 SHIELD performance areas, multiple system classes, cross-classification data flows all requiring hardened architectures against peer EW capabilities.</li><li>An internal analysis (Washington Technology, Jan 2026) calls it the most complex national security endeavor ever.</li></ul>","<p>C4ISR、地面系統、網絡整合、網路安全。</p><ul><li>Golden Dome的網安挑戰前所未有——19個SHIELD績效領域需要抵禦對等電子戰的加固架構。</li><li>被稱為有史以來最複雜的國安工程。</li></ul>"]}],partners:["Lockheed Martin","RTX"],mkt:"public",rev:["$52.55B (FY2025, 10-K); FY26 guide ~$55.7B","$525.5億（FY2025，10-K）；FY26指引約$557億"],gdVal:["SBI OTA (GDMS) + SHIELD IDIQ","SBI OTA（GDMS）＋SHIELD IDIQ"],exp:"low",invNote:["The SBI OTA (via Mission Systems) gives GD a real, if small, Golden Dome foothold; the investment case is Gulfstream deliveries and submarines. Exposure stays Low.","透過任務系統取得的SBI OTA為GD提供雖小但實質的Golden Dome立足點；投資主軸仍是灣流交付與潛艇。曝險維持「低」。"]},
{name:"Redwire Corporation",ticker:"NYSE: RDW",cat:"satellite",tags:[{label:["Space Infrastructure","太空基礎設施"],color:"emerald"},{label:["Sensors / Payloads","感測器/載荷"],color:"cyan"},{label:["SHIELD","SHIELD"],color:"blue"}],summary:["SHIELD-qualified space infrastructure and sensor payload company; merchant supplier of critical components (solar arrays, sensors, avionics) across multiple Golden Dome prime contractors.","SHIELD授標的太空基礎設施和感測器載荷公司；為多個Golden Dome主承商供應關鍵組件（太陽能陣列、感測器、航電）。"],role:["Redwire is a merchant supplier of space-qualified components and sensor payloads feeding into the Golden Dome constellation manufacturing ecosystem. As the number of satellites across SDA tracking, transport, MWT, and interceptor constellations scales into the hundreds and eventually thousands, demand for standardized space-qualified components — solar arrays, sensors, avionics, structural elements — grows proportionally. Redwire's SHIELD qualification positions it to compete for digital engineering, sensor development, and space systems manufacturing task orders that support the broader Golden Dome architecture.","Redwire是太空認證組件和感測器載荷的商售供應商，供應Golden Dome星座製造生態系統。隨著SDA追蹤、傳輸、MWT和攔截器星座擴展至數百甚至數千顆，對標準化太空組件的需求同步增長。SHIELD資格使其可競標支持Golden Dome架構的數位工程、感測器開發和太空系統製造任務訂單。"],contracts:[{name:"SHIELD IDIQ Awardee",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Qualified for space infrastructure, sensor payload, and digital engineering task orders.</p><ul><li>As Golden Dome's constellation scales — SDA tracking layer (72+ sats in T3 alone), transport layer, MWT MEO, AMTI (600 sats), plus SBI constellations potentially numbering in the thousands — demand for Redwire's standardized space-qualified components (solar arrays, avionics, structural systems, sensors) grows proportionally.</li><li>The company's role expands as a merchant supplier into the ecosystem rather than a single-program prime.</li></ul>","<p>可競標太空基礎設施、感測器載荷和數位工程任務訂單。</p><ul><li>隨著Golden Dome星座擴展——僅T3就有72+衛星，加上傳輸層、MWT、AMTI(600顆)、SBI(潛在數千顆)——對Redwire標準化太空組件的需求同步增長。</li><li>作為生態系統商售供應商角色隨規模擴大。</li></ul>"]}],partners:["Multiple SHIELD primes"],mkt:"public",rev:["$335M (FY2025, 10-K); Q2'26 $117M","$3.35億（FY2025，10-K）；2026年Q2 $1.17億"],gdVal:["IDIQ qualification only — but merchant supplier upside","僅IDIQ資格——但商售供應商有上行空間"],exp:"med",invNote:["Small-cap with high potential GD leverage. As the constellation scales to thousands of satellites, demand for Redwire's space-qualified components grows proportionally. No funded GD backlog yet, but the merchant supplier model means wins by other primes (L3Harris, Rocket Lab, Northrop) indirectly benefit Redwire. High volatility, speculative.","小型股，高潛在GD槓桿。隨星座擴展至數千顆衛星，對Redwire太空組件的需求同步增長。尚無GD已資助積壓，但商售供應模式意味其他主承商的勝出間接利好Redwire。高波動，投機性。"]},
{name:"Florida State University (FAMU-FSU)",ticker:"Academia",cat:"academia",tags:[{label:["Research Hub","研究樞紐"],color:"amber"},{label:["SHIELD Awardee","SHIELD授標"],color:"emerald"},{label:["Hypersonics / Cyber","高超音速/網安"],color:"cyan"}],summary:["SHIELD IDIQ awardee (Jan 27, 2026); FAMU-FSU College of Engineering as coordinating hub; research spans hypersonics, advanced propulsion, high-performance materials, cybersecurity, and data analytics.","SHIELD IDIQ授標（2026年1月27日）；FAMU-FSU工程學院為協調樞紐；研究涵蓋高超音速、先進推進、高性能材料、網安和數據分析。"],role:["Florida State University was announced on January 27, 2026 as a SHIELD IDIQ awardee — placing FSU in an elite tier of research institutions eligible to compete as prime contractors. The FAMU-FSU College of Engineering serves as the coordinating hub, with projects led by: the Florida Center for Advanced Aero-Propulsion (FCAAP), Center for Advanced Power Systems, High-Performance Materials Institute, National High Magnetic Field Laboratory, and Institute for Strategic Partnerships. Dean Suvranu De: 'This selection provides us with a seat at the table to help develop the next generation of U.S. homeland defense.' FSU can also serve as a subcontractor to other SHIELD awardees. The inclusion of academic institutions highlights that Golden Dome requires not just manufacturing capacity but fundamental R&D in areas like hypersonic materials, advanced propulsion, and AI/cybersecurity.","佛羅里達州立大學於2026年1月27日獲SHIELD IDIQ授標——躋身有資格作為主承商競標的精英研究機構。FAMU-FSU工程學院為協調樞紐，項目由先進航空推進中心（FCAAP）、先進動力系統中心、高性能材料研究所、國家高磁場實驗室和戰略合作研究所牽頭。院長De：「這為我們提供了參與開發下一代美國國土防禦的機會。」FSU也可作為其他SHIELD授標者的分包商。學術機構的納入凸顯Golden Dome不僅需要製造能力，更需要高超音速材料、先進推進和AI/網安等領域的基礎研發。"],contracts:[{name:"SHIELD IDIQ Awardee (Jan 27, 2026)",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ (qualification; no guaranteed funding at base level)","IDIQ（資格授予；基礎合約無保證資金）"],pop:["Jan 2026 – Dec 2035","2026年1月–2035年12月"],desc:["<p>Announced January 27, 2026. FSU placed in elite tier as prime contractor under SHIELD, eligible to compete for task and delivery orders over the next decade.</p><ul><li><b>Coordinating Hub:</b> FAMU-FSU College of Engineering (Dean Suvranu De led proposal).</li><li><b>Research Centers:</b> Florida Center for Advanced Aero-Propulsion (FCAAP), Center for Advanced Power Systems, High-Performance Materials Institute, National High Magnetic Field Laboratory.</li><li><b>Capabilities:</b> R&D, prototyping, systems engineering, cybersecurity, data analytics — interdisciplinary solutions spanning multiple Golden Dome technology domains.</li><li><b>Dual Role:</b> Can compete as prime AND serve as subcontractor to other SHIELD awardees for collaborative partnerships.</li><li>Dean De: 'This is a gateway that allows FSU to compete for task orders over the next decade, underscoring our standing as a top-tier national research hub for defense technology.'</li></ul>","<p>2026年1月27日公布。FSU以主承商身份取得SHIELD資格，可在未來十年競標任務訂單。</p><ul><li><b>協調樞紐：</b>FAMU-FSU工程學院（院長De主導提案）。</li><li><b>研究中心：</b>先進航空推進中心、先進動力系統中心、高性能材料研究所、國家高磁場實驗室。</li><li><b>能力：</b>研發、原型製作、系統工程、網安、數據分析——跨多個Golden Dome技術領域的跨學科方案。</li><li><b>雙重角色：</b>可作為主承商競標，也可作為其他SHIELD授標者的分包商。</li></ul>"]}],partners:["MDA","Other SHIELD awardees (subcontractor role)"],mkt:"academia",rev:["N/A (academic institution)","不適用（學術機構）"],gdVal:["IDIQ qualification — research task orders","IDIQ資格——研究任務訂單"],exp:"low",invNote:["Not investable. Academic research hub providing fundamental R&D in hypersonics, advanced materials, cybersecurity. Indicates Golden Dome's technology base extends beyond industry to universities.","不可投資。提供高超音速、先進材料、網安基礎研發的學術樞紐。"]},
{name:"V2X, Inc.",ticker:"NYSE: VVX",cat:"services",tags:[{label:["Early Warning Radar","早期預警雷達"],color:"amber"},{label:["COBRA DANE/KING","COBRA DANE/KING"],color:"blue"},{label:["SHIELD (Jan 2026)","SHIELD(2026年1月)"],color:"emerald"}],summary:["SHIELD IDIQ awardee (Jan 12, 2026); operates COBRA DANE and COBRA KING early warning radar systems in Alaska; decades of missile defense radar sustainment, systems engineering, and integration expertise.","SHIELD IDIQ授標（2026年1月12日）；運營阿拉斯加COBRA DANE和COBRA KING早期預警雷達系統；數十年導彈防禦雷達維護、系統工程和整合經驗。"],role:["V2X (NYSE: VVX) was announced January 12, 2026 as a SHIELD awardee. The company brings decades of missile defense radar sustainment and systems engineering experience, particularly through its operation of COBRA DANE (a 120-ft phased-array radar at Eareckson Air Station, Alaska, tracking objects up to 2,000 miles away, operational since 1977) and COBRA KING. CEO Jeremy Wensinger: 'The SHIELD IDIQ aligns directly with the work V2X is already performing to protect the nation.' V2X secured a separate $62M contract for COBRA DANE operational readiness in 2025. The company offers advanced analytics, rapid prototyping, cybersecurity, and scalable integrations — directly supporting Golden Dome's ground-based sensor architecture.","V2X（NYSE: VVX）於2026年1月12日獲SHIELD授標。數十年導彈防禦雷達維護和系統工程經驗，特別是運營COBRA DANE（阿拉斯加120英尺相控陣雷達，可追蹤2,000英里外目標，1977年投入運營）和COBRA KING。CEO Wensinger：「SHIELD IDIQ直接契合V2X正在執行的國防工作。」2025年另獲$6,200萬COBRA DANE運營保障合約。"],contracts:[{name:"SHIELD IDIQ Awardee (Jan 12, 2026)",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ (qualification; revenue at task-order level only)","IDIQ（資格授予；僅任務訂單層級有收入）"],pop:["Jan 2026 – Dec 2035","2026年1月–2035年12月"],desc:["<p>Announced January 12, 2026. V2X positioned as a key ground-sensor sustainment partner for Golden Dome.</p><ul><li><b>COBRA DANE:</b> 120-ft phased-array radar, Eareckson Air Station, Alaska. Tracks objects 2,000+ miles. Operational since Aug 1977, modernized 1990s. V2X holds separate $62M contract for operational readiness.</li><li><b>COBRA KING:</b> Additional early warning radar system maintained by V2X.</li><li><b>Capabilities:</b> Advanced analytics, rapid prototyping, cybersecurity, systems engineering, scalable integrations.</li><li><b>CEO Wensinger:</b> 'From supporting cornerstone sensor and missile defense programs like COBRA DANE and COBRA KING to enabling integrated defense operations worldwide, our teams deliver proven results every day.'</li><li>V2X also won $980M ATS IDIQ (Dec 2025) and $100M classified national security contracts (Q4 2025), demonstrating broad DoD integration footprint.</li></ul>","<p>2026年1月12日公布。V2X定位為Golden Dome地面感測器維護關鍵合作夥伴。</p><ul><li><b>COBRA DANE：</b>120英尺相控陣雷達，阿拉斯加Eareckson空軍站。追蹤2,000+英里。1977年投入運營。V2X另持$6,200萬運營保障合約。</li><li><b>COBRA KING：</b>由V2X維護的額外早期預警雷達。</li><li><b>能力：</b>先進分析、快速原型、網安、系統工程。</li><li><b>CEO Wensinger：</b>「SHIELD IDIQ直接契合V2X正在執行的國防工作。」</li></ul>"]}],partners:["MDA","U.S. Space Force","USSF (COBRA DANE)"],mkt:"public",rev:["$4.48B (FY2025, 10-K); Q2'26 $1.26B","$44.8億（FY2025，10-K）；2026年Q2 $12.6億"],gdVal:["IDIQ qualification + $62M COBRA DANE (separate)","IDIQ資格 + $6,200萬COBRA DANE（獨立合約）"],exp:"low",invNote:["COBRA DANE sustainment ($62M) is the only confirmed GD-adjacent funded work. SHIELD IDIQ provides upside if V2X wins ground-sensor sustainment task orders. Modest GD exposure relative to total revenue — the company's growth is primarily driven by broader DoD services.","COBRA DANE維護（$6,200萬）是唯一確認的GD相鄰資金。SHIELD IDIQ如贏得地面感測器任務訂單則有上行。GD曝險度相對營收溫和。"]},
{name:"Fuse Federal (Fuse Energy)",ticker:"Private",cat:"services",tags:[{label:["Radiation Testing","輻射測試"],color:"red"},{label:["EMP/EMI Resilience","EMP/EMI韌性"],color:"amber"},{label:["SHIELD (Feb 2026)","SHIELD(2026年2月)"],color:"emerald"}],summary:["SHIELD IDIQ awardee (Feb 2, 2026); radiation testing capabilities ensuring space and ground systems survive contested electromagnetic and radiation environments — critical for Golden Dome resilience.","SHIELD IDIQ授標（2026年2月2日）；輻射測試能力確保太空和地面系統在受對抗的電磁和輻射環境中存活——對Golden Dome韌性至關重要。"],role:["Fuse Federal Enterprise, LLC (subsidiary of California-based fusion company Fuse) was announced February 2, 2026 as a SHIELD awardee. Selected specifically for its radiation testing capabilities that accelerate test and evaluation while strengthening system resilience in contested electromagnetic and radiation environments. This is a critical capability for Golden Dome — space-based interceptors and sensors must survive: nuclear EMP effects from potential adversary detonations, natural space radiation degradation, and adversary directed-energy weapon attacks. By enabling earlier performance validation, Fuse Federal helps defense programs reduce technical risk. The company's core business is nuclear fusion energy, but its federal subsidiary provides essential radiation services to U.S. government defense and energy agencies.","Fuse Federal Enterprise, LLC（加州核融合公司Fuse的子公司）於2026年2月2日獲SHIELD授標。因其輻射測試能力被選中——加速測試評估並增強系統在受對抗的電磁和輻射環境中的韌性。這對Golden Dome至關重要——太空攔截器和感測器必須承受：核EMP效應、自然空間輻射退化和對手定向能武器攻擊。"],contracts:[{name:"SHIELD IDIQ Awardee (Feb 2, 2026)",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ (qualification; no guaranteed funding at base level)","IDIQ（資格授予；基礎合約無保證資金）"],pop:["Feb 2026 – Dec 2035","2026年2月–2035年12月"],desc:["<p>Announced February 2, 2026. Fuse Federal selected for its unique radiation testing and electromagnetic environment resilience capabilities.</p><ul><li><b>Core Capability:</b> Radiation testing that accelerates test & evaluation while ensuring system resilience in contested EM and radiation environments.</li><li><b>Golden Dome Relevance:</b> Space-based interceptors must survive nuclear EMP, natural space radiation, and directed-energy attacks — all requiring validated radiation hardening.</li><li><b>Value Proposition:</b> Enables earlier performance validation, reducing technical risk and accelerating fielding timelines toward the 2028 IOC target.</li><li><b>Parent Company:</b> Fuse (San Leandro, CA) — a nuclear fusion company whose federal subsidiary provides radiation services to U.S. government defense and energy agencies.</li></ul>","<p>2026年2月2日公布。Fuse Federal因其獨特的輻射測試和電磁環境韌性能力被選中。</p><ul><li><b>核心能力：</b>加速測試評估的輻射測試，確保系統在受對抗電磁和輻射環境中的韌性。</li><li><b>Golden Dome相關：</b>太空攔截器必須承受核EMP、自然空間輻射和定向能攻擊。</li><li><b>價值：</b>實現更早期的性能驗證，降低技術風險。</li><li><b>母公司：</b>Fuse（加州San Leandro）——核融合公司，聯邦子公司提供輻射服務。</li></ul>"]}],partners:["MDA","DoW agencies"],mkt:"private",rev:["Pre-revenue (nuclear fusion startup)","營收前（核融合新創）"],gdVal:["IDIQ qualification only","僅IDIQ資格"],exp:"low",invNote:["Private company — not directly investable. Niche radiation testing capability for space system hardening. SHIELD qualification is a credibility marker but unlikely to drive significant revenue near-term.","未上市——無法直接投資。太空系統加固的利基輻射測試能力。SHIELD資格為信譽標誌但短期難以驅動顯著營收。"]},
{name:"AST SpaceMobile",ticker:"NASDAQ: ASTS",cat:"newspace",tags:[{label:["Direct-to-Cell LEO","直連手機低軌"],color:"cyan"},{label:["Dual-Use Phased Array","雙用途相控陣"],color:"amber"},{label:["SHIELD T3 (Jan 2026)","SHIELD第3批(2026年1月)"],color:"emerald"}],summary:["SHIELD IDIQ awardee (Jan 15, 2026, third tranche); building world's first direct-to-smartphone satellite broadband network; dual-use LEO phased arrays for secure comms, sensing, and C2; also holds SDA Europa Track 2 agreement.","SHIELD IDIQ授標（2026年1月15日，第三批）；建造全球首個直連智慧手機衛星寬頻網絡；雙用途低軌相控陣用於安全通訊、感測和指揮控制；另持SDA Europa Track 2協議。"],role:["AST SpaceMobile (NASDAQ: ASTS) was awarded a SHIELD IDIQ contract on January 15, 2026, as part of the third tranche of 340 companies. The Midland, Texas-headquartered company is building the first and only space-based cellular broadband network accessible directly by standard smartphones. CCO Chris Ivory: 'Being selected as a prime contract awardee for the MDA's SHIELD program is a major validation of our unique, on-orbit, dual-use technology.' ASTS's value proposition for Golden Dome lies in its massive commercial phased-array satellites — the largest ever deployed in LEO — originally designed for 5G broadband but adaptable for resilient C2, battle management, and secure communications. The company is 95% vertically integrated with ~500,000 sq ft of manufacturing facilities, ~1,800 employees, and 3,800+ patents. Deploying 45-60 additional satellites by end of 2026 with dual commercial/government payload capability. Also holds a separate SDA Europa Track 2 Commercial Solutions agreement.","AST SpaceMobile（NASDAQ: ASTS）於2026年1月15日獲SHIELD IDIQ授標，為第三批340家公司之一。總部位於德州Midland，正在建造全球首個可由標準智慧手機直接訪問的天基蜂窩寬頻網絡。CCO Ivory：「被選為MDA SHIELD主承商是對我們獨特在軌雙用途技術的重大驗證。」ASTS對Golden Dome的價值在於其大型商用相控陣衛星——低軌有史以來最大——原為5G寬頻設計，可改造用於彈性C2、戰場管理和安全通訊。95%垂直整合，~50萬平方英尺設施，~1,800員工，3,800+專利。2026年底前再部署45-60顆衛星。另持SDA Europa Track 2協議。"],contracts:[{name:"SHIELD IDIQ Awardee (Jan 15, 2026 — Third Tranche)",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ (qualification; $151B shared ceiling / 2,440 vendors — no guaranteed funding, revenue at task-order level only)","IDIQ（資格授予；$1,510億由2,440家共享上限——無保證資金，僅任務訂單層級有收入）"],pop:["Jan 2026 – Dec 2035 (if all options exercised)","2026年1月–2035年12月（全選項行使）"],desc:["<p>Announced January 16, 2026 (awarded January 15). Part of the third tranche of 340 companies added to the SHIELD roster, bringing total awardees to 2,440.</p><ul><li><b>CCO Chris Ivory:</b> 'Being selected as a prime contract awardee for the MDA's SHIELD program is a major validation of our unique, on-orbit, dual-use technology and our growing capabilities within the defense sector.'</li><li><b>Dual-Use Technology:</b> Large commercial phased-array satellites (largest ever in LEO) designed for 5G broadband, now adaptable for secure C2, battle management, sensing, and resilient communications for Golden Dome.</li><li><b>Vertical Integration:</b> 95% vertically integrated, all major manufacturing under U.S. control (Texas HQ), ~500,000 sq ft facilities, ~1,800 employees, 3,800+ patents.</li><li><b>Deployment:</b> On track to deploy 45–60 additional satellites by end 2026, serving dual commercial (AT&T, Verizon roaming) and government payload roles.</li><li><b>⚠ IDIQ Qualification Only:</b> This is a 'hunting license' — zero funded Golden Dome task orders as of March 2026. The $151B ceiling is shared across all 2,440 vendors. Monitor for actual task order wins before assigning GD revenue contribution.</li></ul>","<p>2026年1月16日宣布（1月15日授標）。為第三批340家公司之一，總授標者達2,440家。</p><ul><li><b>CCO Ivory：</b>「被選為MDA SHIELD主承商是對我們獨特在軌雙用途技術的重大驗證。」</li><li><b>雙用途技術：</b>大型商用相控陣衛星（低軌有史以來最大），為5G設計，可改造用於安全C2、戰場管理、感測。</li><li><b>垂直整合：</b>95%垂直整合，全美製造（德州總部），~50萬平方英尺，~1,800員工，3,800+專利。</li><li><b>部署：</b>2026年底前再部署45–60顆衛星，兼具商業和政府載荷。</li><li><b>⚠ 僅IDIQ資格：</b>「狩獵許可證」——截至2026年3月零已資助GD任務訂單。$1,510億上限由2,440家共享。</li></ul>"]},{name:"SDA Europa Track 2 Commercial Solutions",value:"TBD (agreement, not funded contract)",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Commercial Solutions Agreement","商業解決方案協議"],pop:["2025 – ongoing","2025–進行中"],desc:["<p>Separate agreement with SDA for the Europa Track 2 Commercial Solutions program, independent of SHIELD.</p><ul><li>Leverages ASTS's commercial LEO constellation for SDA's data transport and communications needs.</li><li>Europa program explores commercial satellite services as supplements to government-owned PWSA satellites.</li><li>Not a funded production contract — positions ASTS for future integration into SDA's architecture.</li></ul>","<p>與SDA簽署的Europa Track 2商業解決方案協議，獨立於SHIELD。</p><ul><li>利用ASTS商業低軌星座滿足SDA數據傳輸和通訊需求。</li><li>Europa計劃探索商業衛星服務作為政府PWSA衛星的補充。</li><li>非已資助生產合約——為未來整合至SDA架構做好定位。</li></ul>"]}],partners:["MDA","SDA","AT&T (commercial)","Verizon (commercial)"],mkt:"public",rev:["$71M (FY2025, 10-K); Q2'26 $32M","$7,100萬（FY2025，10-K）；2026年Q2 $3,200萬"],gdVal:["IDIQ qualification only — zero funded GD task orders","僅IDIQ資格——零已資助GD任務訂單"],exp:"low",invNote:["<b>⚠ IDIQ 'hunting license' only — zero funded Golden Dome backlog.</b> ASTS stock surged 15%+ on the SHIELD announcement, but this is purely IDIQ qualification with no guaranteed revenue. The company is pre-profit with significant cash burn (~$1.06 EPS loss FY2025). Golden Dome's relevance to ASTS is the dual-use validation of its phased-array technology, not near-term revenue. The real catalysts remain commercial service launch, AT&T/Verizon roaming revenue, and constellation deployment execution. ASTS trades at extreme growth multiples (~450%+ 1yr gain) — any GD premium is speculative until task orders materialize. Also holds SDA Europa Track 2 agreement (separate from SHIELD).","<b>⚠ 僅IDIQ「狩獵許可證」——零已資助Golden Dome積壓訂單。</b>ASTS股價在SHIELD宣布後飆升15%+，但純屬IDIQ資格，無保證收入。公司尚未盈利，大量現金消耗（FY2025 EPS虧損~$1.06）。Golden Dome對ASTS的意義在於相控陣技術的雙用途驗證，而非近期營收。真正催化劑仍是商業服務啟動、AT&T/Verizon漫遊收入和星座部署執行。ASTS以極端增長倍數交易（1年+450%）——任何GD溢價在任務訂單實現前均為投機。另持SDA Europa Track 2協議。"]},
{name:"Aalyria Technologies",ticker:"Private (<b>$1.3B</b> val., Feb 2026)",cat:"tech",tags:[{label:["Network Orchestration","網絡編排"],color:"purple"},{label:["Google/Alphabet Origin","Google/Alphabet衍生"],color:"cyan"},{label:["C2 Consortium Prime","C2財團主導"],color:"pink"}],summary:["C2 consortium member (C2 tested twice incl. White Sands, Jun 2026); $100M Series B at $1.3B (Feb 2026); Spacetime AI network orchestration + Tightbeam 100 Gbps laser links; NASA PExT; Telesat Lightspeed integration; Google spin-out (2022), Livermore, CA.","C2財團成員（C2已測試兩次，含6月白沙靶場）；B輪$1億、估值$13億（2026年2月）；Spacetime AI網絡編排＋Tightbeam 100 Gbps雷射鏈路；NASA PExT；整合至Telesat Lightspeed；2022年自Google分拆，總部加州Livermore。"],role:["Aalyria orchestrates the networks Golden Dome depends on. Spun out of Google in 2022 (Loon-era temporospatial networking), it sells Spacetime — AI software that routes data dynamically across space, air, land and sea links — and Tightbeam laser terminals rated at 100 Gbps. WSJ (Mar 2026) named it in the C2 consortium; its natural role is keeping sensor-to-shooter data flowing across heterogeneous constellations (SDN Backbone, SDA transport, commercial). Commercial traction: NASA's PExT roaming demo and Telesat's Lightspeed architecture. A $100M Series B at $1.3B (Feb 2026) funds scale-up.","Aalyria負責編排Golden Dome賴以運作的網絡。2022年自Google分拆（源自Loon的時空網絡技術），產品Spacetime為可跨太空、空中、陸地與海上鏈路動態路由數據的AI軟體，另有額定100 Gbps的Tightbeam雷射終端。華爾街日報（2026年3月）點名其為C2財團成員；其自然角色是確保感測器至射手的數據在異構星座（SDN骨幹、SDA傳輸層、商業網絡）間暢通。商業進展：NASA PExT漫遊演示及Telesat Lightspeed架構。2026年2月B輪$1億、估值$13億用於擴張。"],contracts:[{name:"Golden Dome C2 Software Consortium",value:"Classified (9-firm consortium)",agency:["Golden Dome Office (DRPM Guetlein)","Golden Dome辦公室（Guetlein將軍）"],type:["Classified (consortium — tech firms as primes, defense primes as subs)","機密（財團——科技公司為主承商，國防巨頭為分包商）"],pop:["2025 – Summer 2026 (live demo target)","2025–2026年夏（實戰演示目標）"],desc:["<p>WSJ exclusive (March 24, 2026): Aalyria part of 9-firm C2 consortium. C2 is the ONLY Golden Dome program run directly from Guetlein's office.</p><ul><li><b>Role:</b> Network orchestration — managing multi-domain comms across Golden Dome architecture via Spacetime platform.</li><li><b>Heritage:</b> Adapted technology from Google/Alphabet (Project Loon).</li><li><b>DARPA:</b> Won Space-BACN contract for optical inter-satellite links.</li><li><b>Structure:</b> Tech companies (Anduril, Palantir, Aalyria, Scale AI, Swoop) are PRIMES; defense primes (LMT, NOC, RTX) are SUBCONTRACTORS.</li><li><b>Timeline:</b> Software ready for live testing summer 2026.</li><li><b>Guetlein quote:</b> C2 is the 'secret sauce' and the 'glue layer' connecting sensors, radars, and interceptors.</li></ul><p><b>Update (Aug–Sep 2026):</b> The C2 layer has been tested twice, most recently in a June 2026 integrated test at White Sands Missile Range that Guetlein called the most complex integrated missile defense test the US has run; both validated C2, the sensor network and effectors. Officials say the tests stressed software and new sensor-to-shooter links. Guetlein's office has also stood up 'ApexR', a digital ecosystem fusing sensor data with AI. Member-level contract values remain undisclosed.</p>","<p>WSJ獨家（2026年3月24日）：Aalyria為C2財團成員。C2是Guetlein辦公室唯一直接管理的Golden Dome項目。</p><ul><li><b>角色：</b>網絡編排——通過Spacetime平台管理跨域通訊。</li><li><b>技術傳承：</b>源自Google/Alphabet（Project Loon）。</li><li><b>結構：</b>科技公司為主承商，國防巨頭為分包商。</li><li><b>時間線：</b>2026年夏實戰演示。</li></ul><p><b>更新（2026年8–9月）：</b>C2層已完成兩次測試，最近一次為2026年6月在白沙飛彈靶場的整合測試，Guetlein稱之為美國史上最複雜的整合導彈防禦測試；兩次測試均驗證了C2、感測器網絡與攔截手段。官員表示測試重點在軟體及全新「感測器到射手」鏈路。Guetlein辦公室亦建立「ApexR」數位生態系統，以AI融合感測器數據。各成員合約金額仍未披露。</p>"]}],partners:["Anduril","Palantir","Scale AI","Swoop Technologies","LMT (sub)","NOC (sub)","RTX (sub)"],mkt:"private",rev:["Early revenue (~$144M raised)","早期營收（累計籌資約$1.44億）"],gdVal:["C2 consortium member — potentially transformative","C2財團成員——潛在變革性"],exp:"high",invNote:["Private — not investable. Network orchestration is the least visible but most reusable part of C2: if the consortium's software becomes the Epic 1 glue layer, Aalyria's routing layer is embedded across constellations. Watch for a Series C or strategic acquisition by a prime.","未上市——無法投資。網絡編排是C2中最不顯眼卻最可複用的一環：若財團軟體成為Epic 1膠合層，Aalyria的路由層將嵌入各星座。關注C輪或主承商策略收購。"]},
{name:"Scale AI",ticker:"Private (~<b>$29B</b> val.; Meta 49%)",cat:"tech",tags:[{label:["AI Data Infrastructure","AI數據基礎設施"],color:"purple"},{label:["Data Labeling / RLHF","數據標註/RLHF"],color:"amber"},{label:["C2 Consortium Prime","C2財團主導"],color:"pink"}],summary:["C2 consortium member; Meta took a 49% non-voting stake for $14.3B (Jun 2025, ~$29B val.) — founder Alexandr Wang left for Meta, CEO now Jason Droege; <b>$500M</b> CDAO Thunderforge contract (May 2026, 5x the Sept 2025 deal).","C2財團成員；Meta以$143億取得49%無表決權股份（2025年6月，估值約$290億）——創辦人Alexandr Wang轉任Meta，現任CEO為Jason Droege；<b>$5億</b>CDAO Thunderforge合約（2026年5月，為2025年9月合約的5倍）。"],role:["Scale AI supplies the data layer for military AI: cleaning, labeling and evaluating data so models fit real operational workflows. WSJ (Mar 2026) named it in the Golden Dome C2 consortium. Its flagship defense program is Thunderforge — AI agents embedded in military planning at INDOPACOM and EUCOM, with Microsoft models and Anduril wargaming tools — expanded to a $500M CDAO contract in May 2026. Ownership changed in June 2025 when Meta bought a 49% non-voting stake for $14.3B; founder Alexandr Wang joined Meta and Jason Droege became CEO.","Scale AI為軍事AI提供數據層：清理、標註與評估數據，使模型契合實際作戰流程。華爾街日報（2026年3月）點名其為Golden Dome C2財團成員。其旗艦國防計劃Thunderforge——將AI代理嵌入INDOPACOM與EUCOM作戰規劃，搭配微軟模型與Anduril兵推工具——於2026年5月擴大為$5億CDAO合約。2025年6月Meta以$143億購入49%無表決權股份；創辦人Wang加入Meta，Jason Droege接任CEO。"],contracts:[{name:"Golden Dome C2 Software Consortium",value:"Classified (9-firm consortium)",agency:["Golden Dome Office (DRPM Guetlein)","Golden Dome辦公室（Guetlein將軍）"],type:["Classified (consortium member)","機密（財團成員）"],pop:["2025 – Summer 2026 (live demo target)","2025–2026年夏（實戰演示目標）"],desc:["<p>WSJ exclusive (March 24, 2026): Scale AI part of 9-firm C2 consortium.</p><ul><li><b>Role:</b> AI data infrastructure — training and evaluating AI models powering autonomous threat detection.</li><li><b>DoD Track Record:</b> Existing contracts with Army, Air Force, IC.</li><li><b>CEO:</b> Alexandr Wang — youngest self-made billionaire, advocate for AI in national security.</li><li><b>Valuation:</b> ~$14B.</li><li><b>Consortium Expansion:</b> Part of Anduril-Palantir AI consortium (expanded Dec 2024).</li></ul><p><b>Update (Aug–Sep 2026):</b> The C2 layer has been tested twice, most recently in a June 2026 integrated test at White Sands Missile Range that Guetlein called the most complex integrated missile defense test the US has run; both validated C2, the sensor network and effectors. Officials say the tests stressed software and new sensor-to-shooter links. Guetlein's office has also stood up 'ApexR', a digital ecosystem fusing sensor data with AI. Member-level contract values remain undisclosed.</p>","<p>WSJ獨家（2026年3月24日）：Scale AI為C2財團成員。</p><ul><li><b>角色：</b>AI數據基礎設施——訓練和評估自主威脅偵測AI模型。</li><li><b>國防履歷：</b>現有陸軍、空軍、情報界合約。</li><li><b>CEO：</b>Alexandr Wang。</li><li><b>估值：</b>~$140億。</li></ul><p><b>更新（2026年8–9月）：</b>C2層已完成兩次測試，最近一次為2026年6月在白沙飛彈靶場的整合測試，Guetlein稱之為美國史上最複雜的整合導彈防禦測試；兩次測試均驗證了C2、感測器網絡與攔截手段。官員表示測試重點在軟體及全新「感測器到射手」鏈路。Guetlein辦公室亦建立「ApexR」數位生態系統，以AI融合感測器數據。各成員合約金額仍未披露。</p>"]}],partners:["Anduril","Palantir","Aalyria","Swoop Technologies"],mkt:"private",rev:["Undisclosed (private)","未公開（未上市）"],gdVal:["C2 consortium member","C2財團成員"],exp:"med",invNote:["Private. Defense is now Scale's clearest growth vector (Thunderforge $500M; Golden Dome C2) after several commercial AI labs reportedly scaled back work following Meta's stake. Governance question to watch: a Meta-affiliated vendor inside classified C2.","未上市。在Meta入股後據報多家商業AI實驗室縮減合作，國防成為Scale最明確的成長引擎（Thunderforge $5億；Golden Dome C2）。需關注的治理問題：與Meta關聯的供應商進入機密C2。"]},
