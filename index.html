{name:"Swoop Technologies",ticker:"Private",cat:"tech",tags:[{label:["Software / Comms","軟體/通訊"],color:"purple"},{label:["C2 Consortium Prime","C2財團主導"],color:"pink"}],summary:["C2 software consortium member (WSJ Mar 24 2026); software firm contributing to Golden Dome C2 operating system.","C2軟體財團成員（WSJ 2026年3月24日）；軟體公司，參與Golden Dome C2操作系統開發。"],role:["Swoop Technologies was identified by WSJ (March 24, 2026) as part of the Golden Dome C2 consortium. Limited public information — appears to be a specialized software firm contributing specific capabilities to the C2 glue layer. WSJ notes tech companies are PRIMES with defense primes as subcontractors. C2 software targeting summer 2026 live demonstration.","WSJ（2026年3月24日）確認Swoop Technologies為C2財團成員。公開資訊有限——專業軟體公司。科技公司為主承商，國防巨頭為分包商。目標2026年夏實戰演示。"],contracts:[{name:"Golden Dome C2 Software Consortium",value:"Classified (9-firm consortium)",agency:["Golden Dome Office (DRPM Guetlein)","Golden Dome辦公室（Guetlein將軍）"],type:["Classified (consortium member)","機密（財團成員）"],pop:["2025 – Summer 2026 (live demo target)","2025–2026年夏（實戰演示目標）"],desc:["<p>WSJ exclusive (March 24, 2026): Swoop Technologies part of 9-firm C2 consortium.</p><ul><li><b>Role:</b> Software development for Golden Dome C2 operating system.</li><li><b>Limited Public Info:</b> Specific capabilities not yet publicly detailed.</li><li><b>Significance:</b> Inclusion signals unique technical contribution valued by Golden Dome Office.</li></ul><p><b>Update (Aug–Sep 2026):</b> The C2 layer has been tested twice, most recently in a June 2026 integrated test at White Sands Missile Range that Guetlein called the most complex integrated missile defense test the US has run; both validated C2, the sensor network and effectors. Officials say the tests stressed software and new sensor-to-shooter links. Guetlein's office has also stood up 'ApexR', a digital ecosystem fusing sensor data with AI. Member-level contract values remain undisclosed.</p>","<p>WSJ獨家（2026年3月24日）：Swoop Technologies為C2財團成員。</p><ul><li><b>角色：</b>Golden Dome C2操作系統軟體開發。</li><li><b>公開資訊有限。</b></li></ul><p><b>更新（2026年8–9月）：</b>C2層已完成兩次測試，最近一次為2026年6月在白沙飛彈靶場的整合測試，Guetlein稱之為美國史上最複雜的整合導彈防禦測試；兩次測試均驗證了C2、感測器網絡與攔截手段。官員表示測試重點在軟體及全新「感測器到射手」鏈路。Guetlein辦公室亦建立「ApexR」數位生態系統，以AI融合感測器數據。各成員合約金額仍未披露。</p>"]}],partners:["Anduril","Palantir","Aalyria","Scale AI"],mkt:"private",rev:["Unknown (private)","未知（未上市）"],gdVal:["C2 consortium member","C2財團成員"],exp:"med",invNote:["Private — not investable. No public disclosures on Swoop's specific C2 role since the WSJ report (Mar 2026). Monitor for contract notices.","未上市——無法投資。自華爾街日報報導（2026年3月）以來，Swoop在C2中的具體角色無進一步公開資訊。持續關注合約公告。"]},
{name:"Impulse Space",ticker:"Private (<b>$4.26B</b> val., Jun 2026)",cat:"newspace",tags:[{label:["In-Space Mobility","軌道機動"],color:"cyan"},{label:["SBI Subcontractor","SBI分包商"],color:"red"},{label:["Ex-SpaceX","前SpaceX"],color:"purple"}],summary:["Anduril SBI team (in-space mobility); $500M Series D at $4.26B (Jun 2, 2026), >$1B raised; Mira flown 3 missions; Helios (2027) sold out; ~500 staff; founded by SpaceX's first employee Tom Mueller.","Anduril SBI團隊（軌道機動）；D輪$5億、估值$42.6億（2026年6月2日），累計逾$10億；Mira已飛3次任務；Helios（2027年）已售罄；約500名員工；由SpaceX首位員工Tom Mueller創立。"],role:["Impulse Space was identified by Bloomberg (April 4, 2026) as subcontractor to Anduril on Golden Dome's space-based interceptor (SBI) program. The company provides in-space propulsion, maneuvering, and orbital transfer vehicles that will carry interceptor payloads to operational orbits and enable proximity operations. Founded in 2021 by Tom Mueller — Elon Musk's first hire at SpaceX and the architect of Merlin/Kestrel engines. The company's Mira kick stage and Helios MEO tug are the core transport assets. Impulse also partners with Anduril on an upcoming 2026 self-funded GEO proximity operations mission. Other customers: NASA, NRO, Space Systems Command. The Anduril-Impulse pairing on SBI is another instance of the tech-centric 'new guard' structural pattern — specialized integrators (Anduril) leading with deep-expertise subs (Impulse) instead of traditional prime contractors.","Bloomberg（2026年4月4日）確認Impulse Space為Anduril在Golden Dome太空攔截器（SBI）計劃的分包商。公司提供軌道推進、機動和軌道轉移載具，搭載攔截器酬載至作戰軌道。由Tom Mueller（Musk在SpaceX的首位員工、Merlin/Kestrel引擎架構師）於2021年創立。核心產品：Mira推力級和Helios MEO拖船。其他客戶：NASA、NRO、SSC。Anduril-Impulse配對再次體現科技導向「新世代」結構模式。"],contracts:[{name:"Golden Dome SBI Prototype (Anduril sub)",value:"Classified (under Anduril's prime contract)",agency:["U.S. Space Force","美國太空軍"],type:["Classified OTA subcontract","機密OTA分包"],pop:["Nov 2025 – ongoing","2025年11月–進行中"],desc:["<p>Bloomberg exclusive (April 4, 2026): Impulse Space working as subcontractor to Anduril on space-based interceptor prototypes for Golden Dome.</p><ul><li><b>Role:</b> In-space mobility — propulsion and maneuvering systems for interceptor spacecraft that will track and destroy missiles from orbit.</li><li><b>Technology context:</b> Interceptors must rapidly maneuver to intercept fast-moving targets — Impulse's Mira and Helios platforms provide the high-delta-V mobility required.</li><li><b>Parallel structure:</b> Mirrors the C2 consortium pattern (tech primes with specialized subs) and the Kratos GMI model (specialist integrator leading traditional primes).</li><li><b>Status:</b> Technology still in early development — interceptor concept does not yet exist. Program aims for operational demo by 2028.</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>Bloomberg獨家（2026年4月4日）：Impulse Space擔任Anduril太空攔截器原型分包商。</p><ul><li><b>角色：</b>軌道機動——為從軌道追蹤和摧毀導彈的攔截器提供推進和機動系統。</li><li><b>技術背景：</b>攔截器須高速機動以攔截快速移動目標——Impulse的Mira和Helios平台提供所需的高delta-V。</li><li><b>平行結構：</b>呼應C2財團模式和Kratos GMI模式——專業整合商領導傳統巨頭。</li><li><b>狀態：</b>技術仍在早期開發——攔截器概念尚不存在。2028年作戰演示目標。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["Anduril (SBI prime)","NASA","NRO","Space Systems Command"],mkt:"private",rev:["~$200M contract backlog (reported); >$1B raised","合約積壓約$2億（據報）；累計籌資逾$10億"],gdVal:["SBI subcontract (classified, <$9M initial under Anduril)","SBI分包合約（機密，Anduril旗下<$900萬初始）"],exp:"med",invNote:["Private — not investable. Valuation 2.4x in ~13 months. Impulse's GD exposure is indirect (sub to Anduril's SBI effort), while Helios and GEO/cislunar logistics drive the business case. If SBI reaches production, orbital mobility content per interceptor constellation could be meaningful.","未上市——無法投資。約13個月估值增至2.4倍。Impulse的GD曝險為間接（Anduril SBI分包），業務主軸為Helios及同步軌道/地月物流。若SBI進入量產，每個攔截器星座的軌道機動需求可能相當可觀。"]},
{name:"GITAI USA",ticker:"Private (HQ Torrance, CA)",cat:"newspace",tags:[{label:["Space Robotics","太空機器人"],color:"cyan"},{label:["SBI $3.2B Pool","SBI $32億池"],color:"red"}],summary:["SBI OTA holder (selection announced May 4, 2026); vertically integrated — builds spacecraft, avionics, robotics and solid rocket motors in-house; deferred its S3 robotic-servicing mission to 2028+ to prioritize SBI; GITAI Defense & Space LLC (2025); SHIELD awardee.","SBI OTA持有者（2026年5月4日宣布）；垂直整合——航天器、航電、機器人與固體火箭發動機皆自製；為優先SBI將S3機器人服務任務延至2028年後；2025年成立GITAI Defense & Space LLC；SHIELD得主。"],role:["GITAI began as a Tokyo space-robotics startup, moved its headquarters to Torrance, California in late 2023 and formed GITAI Defense & Space LLC in 2025 to pursue US prime contracts. It demonstrated robotic arms inside and outside the ISS and has flown its own satellite platform. For SBI it is executing without major subcontractors, building spacecraft, avionics, software, robotics, solid rocket motors and mission systems in-house. In June 2026 it deferred its fully built S3 on-orbit servicing mission (planned for SpaceX Transporter-18, Oct 2026) to 2028 or later to prioritize Space Force SBI milestones.","GITAI起源於東京太空機器人新創，2023年底將總部遷至加州Torrance，2025年成立GITAI Defense & Space LLC以爭取美國主承商合約。曾在國際太空站內外演示機械臂，並已發射自有衛星平台。SBI方面不依賴主要分包商，自製航天器、航電、軟體、機器人、固體火箭發動機與任務系統。2026年6月，為優先太空軍SBI里程碑，將已完工的S3在軌服務任務（原定2026年10月搭乘SpaceX Transporter-18）延至2028年或更晚。"],contracts:[{name:"SBI Prototype OTA (part of $3.2B/12-firm pool)",value:"Share of $3.2B pool (individual award undisclosed)",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["OTA (1 of 20 agreements; pool of 12 firms)","OTA（20份協議之一；12家集團）"],pop:["Late 2025/Early 2026 – 2028 capability demo","2025年底/2026年初–2028年能力演示"],desc:["<p>Announced April 24, 2026 by Space Systems Command. GITAI USA among 12 companies sharing $3.2B in 20 total OTA agreements for SBI prototypes.</p><ul><li><b>Role:</b> Space robotics for autonomous interceptor satellite operations.</li><li><b>Demonstration target:</b> 2028 integrated capability into Golden Dome architecture.</li><li><b>Affordability gate:</b> Guetlein has stated SBI may not enter production if not affordable and scalable.</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>2026年4月24日宣布。GITAI USA為共享$32億的20份OTA協議的12家公司之一。</p><ul><li><b>角色：</b>自主攔截器衛星操作的太空機器人。</li><li><b>演示目標：</b>2028年整合至Golden Dome架構。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["JAXA","NASA"],mkt:"private",rev:["Pre-revenue commercial (gov contracts)","營收前（政府合約）"],gdVal:["SBI prototype share of $3.2B pool","SBI原型$32億池份額"],exp:"med",invNote:["Private — not investable. Betting the company on SBI (other missions deferred) raises both upside and risk; the prize-based gates reward self-funded progress but offer no guaranteed production.","未上市——無法投資。押注SBI（其他任務延後）同時放大上行與風險；獎勵制關卡獎勵自籌進展，但不保證量產。"]},
{name:"Quindar",ticker:"Private (Series A, ~$27M raised)",cat:"tech",tags:[{label:["Mission Ops Software","任務操作軟體"],color:"purple"},{label:["SBI $3.2B Pool","SBI $32億池"],color:"red"}],summary:["SBI OTA holder (mission-ops software for interceptor constellations); founded 2022 by ex-OneWeb engineers (CEO Nate Hamet), Lafayette, CO; $18M Series A (Nov 2025) led by Washington Harbour Partners with Booz Allen Ventures; classified ops center in Denver (late 2026).","SBI OTA持有者（攔截器星座任務運營軟體）；2022年由前OneWeb工程師創立（CEO Nate Hamet），總部科羅拉多州Lafayette；2025年11月A輪$1,800萬，由Washington Harbour Partners領投、Booz Allen Ventures參與；丹佛機密運營中心（2026年底）。"],role:["Quindar builds cloud-native mission-management software that automates the satellite lifecycle — planning, flight dynamics, command and control and event management — so one operator can run hundreds of spacecraft. Founded in 2022 by former OneWeb engineers, it is building a classified facility and growing from ~30 to ~100 staff after an $18M Series A (Nov 2025). For SBI, fleet command and control of a large interceptor constellation is a natural fit. Booz Allen Ventures is an investor, linking it to another SBI awardee.","Quindar開發雲原生任務管理軟體，自動化衛星全生命週期——規劃、飛行動力、指揮控制與事件管理——讓一名操作員可管理數百顆航天器。2022年由前OneWeb工程師創立，2025年11月完成$1,800萬A輪後正建設機密設施，員工由約30人擴至約100人。對SBI而言，大型攔截器星座的機隊指揮控制是天然切入點。Booz Allen Ventures為投資人，與另一SBI得主相連。"],contracts:[{name:"SBI Prototype OTA (part of $3.2B/12-firm pool)",value:"Share of $3.2B pool",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["OTA","OTA"],pop:["Late 2025/Early 2026 – 2028","2025年底/2026年初–2028年"],desc:["<p>Announced April 24, 2026. Quindar among 12 companies sharing $3.2B in 20 OTA agreements for SBI prototypes.</p><ul><li><b>Role:</b> Cloud-native mission operations software for SBI constellation.</li><li><b>Why it matters:</b> Software-defined satellite operations enable rapid response to engagement decisions across distributed constellation.</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>2026年4月24日宣布。Quindar為$32億20份OTA中的12家之一。</p><ul><li><b>角色：</b>SBI星座雲原生任務操作軟體。</li><li><b>意義：</b>軟體定義衛星操作實現跨分布式星座的快速交戰決策響應。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["Booz Allen Ventures (investor)","Washington Harbour Partners","Y Combinator"],mkt:"private",rev:["Early revenue (~$27M raised)","早期營收（累計籌資約$2,700萬）"],gdVal:["SBI prototype share of $3.2B pool","SBI原型$32億池份額"],exp:"med",invNote:["Private — not investable. A software-only SBI entrant: low capital intensity, but its value depends on being chosen as the fleet-ops layer by a hardware winner.","未上市——無法投資。純軟體SBI參與者：資本密集度低，但價值取決於能否被硬體勝出者選為機隊運營層。"]},
{name:"SciTec (Firefly Aerospace)",ticker:"Nasdaq: FLY (parent)",cat:"tech",tags:[{label:["SBI $3.2B Pool","SBI $32億池"],color:"red"},{label:["FORGE Missile-Warning Software","FORGE導彈預警軟體"],color:"cyan"},{label:["Firefly Subsidiary","Firefly子公司"],color:"purple"}],summary:["SBI OTA holder (May 4, 2026); Princeton, NJ developer of AI-enabled missile-warning/tracking data processing — prime for Space Force FORGE mission data processing; acquired by Firefly Aerospace (Nasdaq: FLY) for $855M (closed ~end-2025); ~$164M revenue (TTM Jun 2025).","SBI OTA持有者（2026年5月4日）；總部新澤西州普林斯頓，開發AI導彈預警/追蹤數據處理——太空軍FORGE任務數據處理主承商；Firefly Aerospace（Nasdaq: FLY）以$8.55億收購（約2025年底完成）；營收約$1.64億（截至2025年6月TTM）。"],role:["SciTec has supported DoD and the intelligence community for 45+ years with high-fidelity sensing, data fusion and mission software for missile warning, missile defense and space domain awareness. As Mission Data Processing Application Provider for FORGE — the Space Force's next-generation ground system for overhead-persistent-infrared missile warning — it turns sensor data into real-time strategic and theater warning, the processing layer Golden Dome's detection chain runs through (and which Kratos's GMI integrates with). Firefly Aerospace agreed in Oct 2025 to buy SciTec for $855M; it operates as a Firefly subsidiary. The SBI solicitation covered interceptors plus common-ground and fire-control elements; SciTec's software heritage points to the latter, though the company has not detailed its role.","SciTec逾45年來以高精度感測、數據融合與任務軟體支援國防部與情報體系，涵蓋導彈預警、導彈防禦與太空域感知。作為FORGE（太空軍次世代紅外導彈預警地面系統）任務數據處理應用供應商，將感測數據轉為即時戰略與戰區預警——Golden Dome偵測鏈必經的處理層（Kratos GMI亦與之整合）。Firefly Aerospace於2025年10月同意以$8.55億收購SciTec，現為其子公司。SBI徵求涵蓋攔截器及共用地面與火控元素；SciTec的軟體背景指向後者，但公司未說明具體角色。"],contracts:[{name:"SBI Prototype OTA (part of $3.2B/12-firm pool)",value:"Share of $3.2B pool",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["OTA","OTA"],pop:["Late 2025/Early 2026 – 2028","2025年底/2026年初–2028年"],desc:["<p>Announced May 4, 2026: SciTec received an SBI OTA from Space Systems Command — one of 20 agreements worth up to $3.2B across 12 companies. President David Simenc: the award lets SciTec apply its AI-powered defense technologies to Golden Dome.</p><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>2026年5月4日宣布：SciTec獲太空系統司令部SBI OTA——12家公司共20份協議、合計上限$32億之一。總裁David Simenc表示，此授標讓SciTec將AI國防技術應用於Golden Dome。</p><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]},{name:"FORGE Mission Data Processing (SSC)",value:"<b>$259M</b> (2025) + earlier MDPAP award",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["Production follow-on from SpEC OTA prototype","SpEC OTA原型後續生產合約"],pop:["Ongoing","進行中"],desc:["<p>SciTec leads the Mission Data Processing Application Provider team for FORGE, which sustains legacy SBIRS operations while extending to next-generation OPIR and proliferated sensors; teammates include L3Harris and RTX.</p><ul><li>2025: $259M award to extend FORGE with scalable, cyber-secure ground processing for missile warning and tracking.</li><li>Relevance: Golden Dome's detection chain ultimately runs through this processing layer.</li></ul>","<p>SciTec領導FORGE任務數據處理應用供應商團隊，在維持舊有SBIRS運作的同時延伸至次世代OPIR與分散式感測器；隊友包括L3Harris與RTX。</p><ul><li>2025年：$2.59億合約，為導彈預警與追蹤擴充可擴展、具網路韌性的地面處理。</li><li>相關性：Golden Dome偵測鏈最終經由此處理層。</li></ul>"]}],partners:["Firefly Aerospace (parent)","Space Systems Command","L3Harris (FORGE team)","RTX (FORGE team)"],mkt:"public",rev:["Parent Firefly: $160M (FY2025, 10-K); Q2'26 $118M incl. SciTec","母公司Firefly：$1.6億（FY2025，10-K）；2026年Q2 $1.18億（含SciTec）"],gdVal:["SBI OTA + FORGE missile-warning processing ($259M, 2025)","SBI OTA＋FORGE導彈預警處理（$2.59億，2025年）"],exp:"med",invNote:["<b>Correction:</b> earlier versions profiled 'SciTec' as a generic services firm in Albuquerque — it is SciTec, Firefly Aerospace's missile-warning software subsidiary. Investable via FLY: SciTec is a large share of Firefly's revenue base and gives the launch/lunar company a direct Golden Dome vector (SBI + FORGE). Risks: Firefly's launch execution and acquisition integration.","<b>更正：</b>先前版本將「SciTec」誤述為阿布奎基的一般服務公司——實為Firefly Aerospace旗下導彈預警軟體子公司SciTec。可透過FLY投資：SciTec佔Firefly營收比重大，為這家發射/登月公司提供直接Golden Dome路徑（SBI＋FORGE）。風險：Firefly發射執行與併購整合。"]},
{name:"Turion Space",ticker:"Private (~$82M raised; Series B Apr 2026)",cat:"newspace",tags:[{label:["Space Domain Awareness","太空域感知"],color:"cyan"},{label:["SBI $3.2B Pool","SBI $32億池"],color:"red"},{label:["In-Space Logistics","在軌物流"],color:"purple"}],summary:["SBI OTA holder; $75M+ Series B (Apr 15, 2026) led by Washington Harbour Partners (~$82M total); DROID.001 and DROID.002 both successful (40,000+ images); 28 US government contracts (NASA, USSF, SDA, NRO); scaling from 8 to 40 spacecraft/yr; Starfire OS; founded 2021, Irvine, CA.","SBI OTA持有者；2026年4月15日B輪逾$7,500萬，由Washington Harbour Partners領投（累計約$8,200萬）；DROID.001與DROID.002均成功（逾40,000張影像）；28份美國政府合約（NASA、太空軍、SDA、NRO）；年產能由8架擴至40架；Starfire作業系統；2021年成立於加州Irvine。"],role:["Turion (CEO Ryan Westerdahl) builds and operates maneuverable DROID spacecraft and the Starfire operating system for rendezvous and proximity operations, non-Earth imaging for space domain awareness and, longer term, debris removal and servicing. Both DROID missions succeeded and its imagery feeds the Space Force's Unified Data Library. RPO skills — tracking and closing on non-cooperative objects — map directly onto interceptor concepts, which is why it sits among the 12 SBI awardees. The April 2026 Series B funds a five-fold production ramp (8 to 40 vehicles a year) and growth to ~300 staff.","Turion（CEO Ryan Westerdahl）打造並營運可機動的DROID航天器及Starfire作業系統，用於交會接近操作、太空域感知的非地球影像，長期目標為碎片清除與在軌服務。兩次DROID任務皆成功，影像已接入太空軍統一數據庫。追蹤並逼近非合作目標的RPO能力可直接轉化為攔截器概念，因此躋身12家SBI得主。2026年4月B輪支持產能提升五倍（年產8至40架）及擴編至約300人。"],contracts:[{name:"SBI Prototype OTA (part of $3.2B/12-firm pool)",value:"Share of $3.2B pool",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["OTA","OTA"],pop:["Late 2025/Early 2026 – 2028","2025年底/2026年初–2028年"],desc:["<p>Announced April 24, 2026. Turion Space among 12 firms in $3.2B SBI prototype OTA pool.</p><ul><li><b>Role:</b> Droid spacecraft platform for SBI prototype — leveraging RPO heritage.</li><li><b>Heritage:</b> Founded by ex-SpaceX engineers; demonstrated DROID.001 SDA mission (2024).</li><li><b>VC backing:</b> Andreessen Horowitz, Y Combinator, USIT Fund — ~$50M raised.</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>2026年4月24日宣布。Turion Space為$32億SBI原型OTA池中的12家之一。</p><ul><li><b>角色：</b>SBI原型Droid航天器平台——利用RPO傳承。</li><li><b>傳承：</b>由前SpaceX工程師創立；演示DROID.001 SDA任務（2024）。</li><li><b>VC支持：</b>Andreessen Horowitz、Y Combinator、USIT Fund——已籌資~$5,000萬。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["Space Systems Command","SDA","NRO","Washington Harbour Partners"],mkt:"private",rev:["Early revenue (~$82M raised)","早期營收（累計籌資約$8,200萬）"],gdVal:["SBI prototype share of $3.2B pool","SBI原型$32億池份額"],exp:"med",invNote:["Private — not investable. Proven RPO hardware at small scale; SBI selection plus 28 government contracts de-risk the roadmap, but the company is far smaller than its SBI peers.","未上市——無法投資。小規模RPO硬體已驗證；SBI入選與28份政府合約降低路線風險，但規模遠小於其他SBI同業。"]},
{name:"Sierra Space",ticker:"Private (Louisville, CO)",cat:"satellite",tags:[{label:["AMDT3 $798M","AMDT3 $7.98億"],color:"red"},{label:["SDA Tracking T2/AMDT3","SDA追蹤T2/AMDT3"],color:"emerald"},{label:["Horizon Bus","Horizon平台"],color:"cyan"}],summary:["SDA AMDT3 firm-fixed-price OTA up to <b>$798M</b> for 18 missile-warning/tracking sats (Jul 13, 2026), launch-ready end-2028; also building 18 Tranche 2 Tracking sats; Horizon bus (Eclipse line); best known for Dream Chaser.","SDA AMDT3固定價格OTA上限<b>$7.98億</b>，18顆導彈預警/追蹤衛星（2026年7月13日），2028年底可發射；另建造18顆T2追蹤衛星；Horizon平台（Eclipse系列）；以Dream Chaser太空飛機聞名。"],role:["Best known for the Dream Chaser spaceplane, Sierra Space has pivoted hard into national-security satellites. On July 13–14, 2026 SDA awarded it a firm-fixed-price OTA worth up to $798M for 18 missile-warning/missile-tracking satellites under Accelerated Missile Defense Tranche 3 (AMDT3), launch-ready by end-2028 to meet Golden Dome's 2028 goal. They use its Horizon bus (Eclipse line) — the same design as its 18 Tranche 2 Tracking satellites, whose structures are complete and which were entering nine-satellite stack qualification in summer 2026. CFO Jeff Schrader described the award as Golden Dome money 'finally flowing'.","以Dream Chaser太空飛機聞名的Sierra Space已大幅轉向國安衛星。2026年7月13–14日，SDA授予其上限$7.98億固定價格OTA，於加速導彈防禦第3批次（AMDT3）打造18顆導彈預警/追蹤衛星，2028年底可發射以配合Golden Dome 2028目標。衛星採用Horizon平台（Eclipse系列）——與其18顆T2追蹤衛星同一設計；T2衛星結構已完成，2026年夏進入九星堆疊鑑定。財務長Jeff Schrader形容此授標代表Golden Dome資金「終於開始流動」。"],contracts:[{name:"SDA Accelerated Missile Defense Tranche 3 (AMDT3)",value:"Up to <b>$798M</b>",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Firm-Fixed-Price OTA","固定價格OTA"],pop:["Jul 2026 – end-2028 (launch-ready)","2026年7月–2028年底（可發射）"],desc:["<p>18 missile-warning/missile-tracking variant satellites across two orbital planes, co-awarded with L3Harris ($955M) — 36 AMDT3 satellites in total, lifting Tranche 3 tracking from 72 to 108 spacecraft.</p><ul><li>Accelerated schedule targets Golden Dome's 2028 capability (standard T3 launches 2029).</li><li>Risk: none of Sierra's tracking satellites has flown yet.</li></ul>","<p>18顆導彈預警/追蹤型衛星、分布於兩個軌道面，與L3Harris（$9.55億）共同得標——AMDT3共36顆，使T3追蹤星座由72顆增至108顆。</p><ul><li>加速時程對準Golden Dome 2028年能力（標準T3於2029年發射）。</li><li>風險：Sierra的追蹤衛星尚未有任何一顆升空。</li></ul>"]},{name:"SDA Tranche 2 Tracking Layer (18 sats)",value:"~<b>$740M</b> (Jan 2024)",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Firm-Fixed-Price OTA","固定價格OTA"],pop:["2024 – launch (2026–27)","2024年–發射（2026–27年）"],desc:["<p>One of three Tranche 2 Tracking awards (with L3Harris and Lockheed Martin, 54 satellites). Structural builds of all 18 Sierra spacecraft were complete by mid-2026, with system verification to follow.</p>","<p>T2追蹤層三份合約之一（另有L3Harris與洛馬，共54顆）。18顆Sierra航天器結構已於2026年中完成，隨後進行系統驗證。</p>"]}],partners:["SDA","L3Harris (AMDT3 co-awardee)"],mkt:"private",rev:["Undisclosed (private)","未公開（未上市）"],gdVal:["$798M AMDT3 + SDA Tranche 2 Tracking (~$740M)","$7.98億AMDT3＋SDA T2追蹤（約$7.4億）"],exp:"high",invNote:["Private — not investable. A direct, funded beneficiary of the accelerated tracking layer, but execution risk is high until its first tracking satellites fly. Last publicly reported valuation ~$5.3B (2023). A potential IPO candidate if the Horizon line proves out.","未上市——無法投資。加速追蹤層的直接且已獲資助受益者，但在首批追蹤衛星升空前執行風險高。最近公開估值約$53億（2023年）。若Horizon產品線驗證成功，具IPO潛力。"]},
{name:"Voyager Technologies",ticker:"NYSE: VOYG",cat:"newspace",tags:[{label:["SBI Team (Anduril)","SBI團隊（Anduril）"],color:"red"},{label:["Interceptor DACS","攔截器DACS"],color:"amber"},{label:["Starlab","Starlab太空站"],color:"cyan"}],summary:["Member of Anduril's SBI team (reported May 2026), supplying divert & attitude control systems that steer kinetic kill vehicles; Q2'26 revenue $52.7M; FY2025 $166.4M; NYSE-listed since 2025; also developing the Starlab commercial station.","Anduril SBI團隊成員（2026年5月報導），供應引導動能殺傷載具的轉向與姿態控制系統（DACS）；2026年Q2營收$5,270萬；FY2025 $1.664億；2025年起於紐約證交所上市；亦開發Starlab商業太空站。"],role:["Voyager Technologies is a defense and space technology company whose defense segment supplies propulsion hardware for missile defense — notably divert and attitude control systems (DACS), the thrusters that steer an interceptor's kill vehicle onto its target. Reporting in May 2026 placed Voyager on Anduril's space-based interceptor team alongside Impulse Space, Inversion Space, K2 Space and Sandia National Laboratories. If SBI reaches production, DACS content scales with interceptor count. Voyager is also leading the Starlab commercial space station.","Voyager Technologies為國防與太空科技公司，其國防部門為導彈防禦供應推進硬體——特別是轉向與姿態控制系統（DACS），即引導攔截器殺傷載具命中目標的推進器。2026年5月報導指Voyager加入Anduril天基攔截器團隊，與Impulse Space、Inversion Space、K2 Space及桑迪亞國家實驗室並列。若SBI進入量產，DACS需求將隨攔截器數量擴增。Voyager亦主導Starlab商業太空站。"],contracts:[{name:"Anduril SBI Team — Divert & Attitude Control (reported)",value:"Undisclosed (sub to Anduril's SBI OTA)",agency:["U.S. Space Force (via Anduril)","美國太空軍（經Anduril）"],type:["Subcontract (reported)","分包（據報）"],pop:["2026 – 2028 demo","2026年–2028年演示"],desc:["<p>Voyager provides divert and attitude control systems — propulsion that steers kinetic kill vehicles — within the commercial-space team Anduril assembled for its SBI prototype (Impulse, Inversion, K2, Sandia).</p>","<p>Voyager於Anduril為SBI原型組建的商業太空團隊（Impulse、Inversion、K2、桑迪亞）中提供轉向與姿態控制系統——引導動能殺傷載具的推進裝置。</p>"]}],partners:["Anduril (SBI prime)","Impulse Space","K2 Space","Sandia National Labs"],mkt:"public",rev:["$166.4M (FY2025, 10-K); Q2'26 $52.7M","$1.664億（FY2025，10-K）；2026年Q2 $5,270萬"],gdVal:["SBI subcontract (value undisclosed)","SBI分包（金額未披露）"],exp:"med",invNote:["Small-cap, speculative GD exposure: DACS content per interceptor could scale with any SBI production decision, but values are undisclosed and SBI must clear four affordability gates. Starlab and the broader defense-propulsion book dominate the near-term thesis.","小型股、投機性GD曝險：每具攔截器的DACS需求可能隨SBI量產決定放大，但金額未披露，且SBI須通過四道可負擔性關卡。短期論點仍由Starlab與國防推進業務主導。"]}

// ═══════════════════════════════════════════
// Engine
// ═══════════════════════════════════════════
let lang='en',curFilter='all',curSearch='',activeCo=null;
const $=id=>document.getElementById(id);
const grid=$('companyGrid'),searchInput=$('searchInput'),searchClear=$('searchClear'),resultCount=$('resultCount'),
  m1Overlay=$('m1Overlay'),m1Accent=$('m1Accent'),m1Name=$('m1Name'),m1Ticker=$('m1Ticker'),m1Tags=$('m1Tags'),m1Body=$('m1Body'),m1Close=$('m1Close'),
  m2Overlay=$('m2Overlay'),m2Body=$('m2Body'),m2Back=$('m2Back'),m2Close=$('m2Close');

const t=key=>L[lang][key]||key;
const tx=(v)=>Array.isArray(v)?(lang==='zh'?v[1]:v[0]):v;

function applyLang(){
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(L[lang][k])el.textContent=L[lang][k];});
  searchInput.placeholder=t('searchPh');
  // timeline
  const tlEl=$('timeline'); tlEl.innerHTML='';
  t('tl').forEach(x=>{
    tlEl.innerHTML+=`<div class="tl-item"><div class="tl-date">${x.d}</div><div class="tl-dot ${x.c}"></div><div class="tl-label">${x.l}</div></div>`;
  });
  // filters
  const fg=$('filterGroup'); fg.innerHTML='';
  const fk=t('filters');
  Object.keys(fk).forEach(k=>{
    const b=document.createElement('button'); b.className='filter-btn'+(curFilter===k?' active':''); b.dataset.filter=k; b.textContent=fk[k];
    b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');curFilter=k;renderCards();};
    fg.appendChild(b);
  });
  renderCards();
  // lang buttons
  document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);});
}

function matchesSearch(c,q){
  if(!q) return true;
  const s=[c.name,c.ticker,tx(c.summary),tx(c.role),...c.tags.map(t=>tx(t.label)),...(c.contracts||[]).flatMap(ct=>[ct.name,ct.value,tx(ct.desc)]),...(c.partners||[])].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(t=>s.includes(t));
}

function renderCards(){
  grid.innerHTML='';
  const f=C.filter(c=>(curFilter==='all'||c.cat===curFilter)&&matchesSearch(c,curSearch));
  resultCount.textContent=f.length+' / '+C.length;
  if(!f.length){grid.innerHTML='<div class="no-results"><span>⌀</span>'+(lang==='zh'?'沒有符合搜尋條件的公司。':'No companies match your search.')+'</div>';return;}
  f.forEach(c=>{
    const d=document.createElement('div');d.className='company-card';d.dataset.cat=c.cat;
    let mktHtml='';
    if(c.mkt){
      const mktClass=c.mkt==='public'?'public':c.mkt==='private'?'private':'academia-mkt';
      const mktLabel=c.mkt==='public'?'✅ '+t('publicLabel'):c.mkt==='private'?'🔒 '+t('privateLabel'):'🎓 '+t('academiaLabel');
      mktHtml=`<div class="card-market ${mktClass}" style="margin-top:0">${mktLabel}</div>`;
    }
    let expHtml='';
    if(c.exp){
      const expLabel=c.exp==='low'?t('lowExp'):c.exp==='med'?t('medExp'):c.exp==='high'?t('highExp'):t('vhighExp');
      expHtml=`<div class="exposure-bar" style="margin-top:12px;margin-bottom:4px"><div class="exposure-label">${t('exposureLabel')}</div><div class="exposure-track"><div class="exposure-fill exp-${c.exp}"></div></div><div class="exposure-text exp-${c.exp}">${expLabel}</div></div>`;
    }
    d.innerHTML=`<div class="card-top"><div><div class="company-name">${c.name}</div><div class="company-ticker">${c.ticker}</div></div>${mktHtml}</div>${expHtml}<div class="card-tags">${c.tags.map(t=>`<span class="tag tag-${t.color}">${tx(t.label)}</span>`).join('')}</div><div class="card-summary">${tx(c.summary)}</div><div class="card-cta">${t('clickForDetails')}</div>`;
    d.onclick=()=>openL1(c);grid.appendChild(d);
  });
}

function openL1(c){
  activeCo=c;
  m1Accent.className='modal-accent '+c.cat;
  m1Name.textContent=c.name;m1Ticker.textContent=c.ticker;
  m1Tags.innerHTML=c.tags.map(t=>`<span class="tag tag-${t.color}">${tx(t.label)}</span>`).join('');
  let h=`<div class="modal-section"><div class="modal-label">${t('roleLabel')}</div><div class="modal-text">${tx(c.role)}</div></div>`;
  if(c.contracts&&c.contracts.length){
    h+=`<div class="modal-section"><div class="modal-label">${t('contractsLabel')}</div>`;
    c.contracts.forEach((ct,i)=>{h+=`<div class="contract-card" data-ci="${i}"><div class="contract-name">${ct.name}</div><div class="contract-value">${ct.value}</div><div class="contract-hint">${t('clickDetail')}</div></div>`;});
    h+=`</div>`;
  }
  if(c.partners&&c.partners.length){h+=`<div class="modal-section"><div class="modal-label">${t('partnersLabel')}</div><div class="partner-list">${c.partners.map(p=>`<span class="partner-chip">${p}</span>`).join('')}</div></div>`;}
  if(c.mkt){
    h+='<div class="modal-inv-panel"><div class="modal-inv-title">'+t('invTitle')+'</div><div class="inv-grid">';
    h+='<div class="inv-item"><div class="inv-k">'+t('marketLabel')+'</div><div class="inv-v">'+(c.mkt==='public'?'✅ '+t('publicLabel')+' ('+c.ticker+')':c.mkt==='private'?'🔒 '+t('privateLabel'):'🎓 '+t('academiaLabel'))+'</div></div>';
    h+='<div class="inv-item"><div class="inv-k">'+t('revLabel')+'</div><div class="inv-v">'+tx(c.rev)+'</div></div>';
    h+='<div class="inv-item"><div class="inv-k">'+t('gdBacklogLabel')+'</div><div class="inv-v">'+tx(c.gdVal)+'</div></div>';
    h+='<div class="inv-item"><div class="inv-k">'+t('exposureLabel')+'</div><div class="inv-v exposure-text exp-'+c.exp+'">'+(c.exp==='low'?t('lowExp'):c.exp==='med'?t('medExp'):c.exp==='high'?t('highExp'):t('vhighExp'))+'</div></div>';
    if(c.invNote)h+='<div class="inv-note">'+tx(c.invNote)+'</div>';
    h+='</div></div>';
  }
  m1Body.innerHTML=h;
  m1Body.querySelectorAll('.contract-card').forEach(el=>{el.onclick=e=>{e.stopPropagation();openL2(+el.dataset.ci);};});
  m1Overlay.classList.add('open');document.body.style.overflow='hidden';
}
function closeL1(){m1Overlay.classList.remove('open');document.body.style.overflow='';activeCo=null;}
m1Close.onclick=closeL1;m1Overlay.onclick=e=>{if(e.target===m1Overlay)closeL1();};

function openL2(i){
  if(!activeCo)return;const ct=activeCo.contracts[i];
  let metaHtml='';
  if(ct.agency||ct.type||ct.pop){
    metaHtml='<div class="modal2-meta">';
    if(ct.agency)metaHtml+='<div class="meta-row"><div class="meta-k">'+t('agencyLabel')+'</div><div class="meta-v">'+tx(ct.agency)+'</div></div>';
    if(ct.type)metaHtml+='<div class="meta-row"><div class="meta-k">'+t('typeLabel')+'</div><div class="meta-v">'+tx(ct.type)+'</div></div>';
    if(ct.pop)metaHtml+='<div class="meta-row"><div class="meta-k">'+t('popLabel')+'</div><div class="meta-v">'+tx(ct.pop)+'</div></div>';
    metaHtml+='</div>';
  }
  m2Body.innerHTML=`<div class="modal2-contract-title">${ct.name}</div><div class="modal2-contract-company">${activeCo.name} · ${activeCo.ticker}</div><div class="modal2-value-box"><div class="modal2-value-label">${t('contractValue')}</div><div class="modal2-value">${ct.value}</div></div>${metaHtml}<div style="margin-top:12px"><div class="modal2-desc-label">${t('fullDesc')}</div><div class="modal2-desc">${tx(ct.desc)}</div></div>`;
  m2Overlay.classList.add('open');
}
function closeL2(){m2Overlay.classList.remove('open');}
m2Back.onclick=closeL2;m2Close.onclick=()=>{closeL2();closeL1();};m2Overlay.onclick=e=>{if(e.target===m2Overlay)closeL2();};
document.onkeydown=e=>{if(e.key==='Escape'){if(m2Overlay.classList.contains('open'))closeL2();else closeL1();}};

searchInput.oninput=()=>{curSearch=searchInput.value.trim();searchClear.classList.toggle('show',curSearch.length>0);renderCards();};
searchClear.onclick=()=>{searchInput.value='';curSearch='';searchClear.classList.remove('show');searchInput.focus();renderCards();};

document.querySelectorAll('.lang-btn').forEach(b=>{b.onclick=()=>{lang=b.dataset.lang;applyLang();
document.querySelector('.timeline-scroll').addEventListener('scroll',function(){this.classList.add('scrolled');},{once:true});};});

applyLang();
document.querySelector('.timeline-scroll').addEventListener('scroll',function(){this.classList.add('scrolled');},{once:true});

async function checkPwd(){
  var storedHashes=["bebc79734038e684e2d9bd00f8a0bcebb96fbffbdb699ffd076732806fe1cde0","253bfb44c32d3066af094ac8e640262ef483d48e022391dbc6c79098a408bbb6"];
  var input=document.getElementById("pwd-input").value;
  var encoder=new TextEncoder();
  var data=encoder.encode(input);
  var hashBuffer=await crypto.subtle.digest("SHA-256",data);
  var hashArray=Array.from(new Uint8Array(hashBuffer));
  var hashHex=hashArray.map(function(b){return b.toString(16).padStart(2,"0")}).join("");
  if(storedHashes.indexOf(hashHex)!==-1){
    document.getElementById("pwd-screen").style.display="none";
    document.querySelector(".app").style.display="block";
  }else{
    document.getElementById("pwd-error").style.display="block";
    document.getElementById("pwd-input").value="";
    document.getElementById("pwd-input").focus();
  }
}
