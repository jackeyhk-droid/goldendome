<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Dome — Project Relationship Map</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#0a0e17;--bg-secondary:#111827;--bg-card:#151d2e;--bg-card-hover:#1a2540;--bg-modal:#141c2f;--bg-modal2:#0f1625;--border:#1e2d4a;--border-active:#3b82f6;--text-primary:#e2e8f0;--text-secondary:#94a3c0;--text-muted:#5f7196;--accent-blue:#3b82f6;--accent-cyan:#06b6d4;--accent-emerald:#10b981;--accent-amber:#f59e0b;--accent-red:#ef4444;--accent-purple:#8b5cf6;--accent-pink:#ec4899;--accent-orange:#f97316;--radius:10px;--font-sans:'DM Sans','Noto Sans TC',sans-serif;--font-mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;font-size:16px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,.08),transparent),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(6,182,212,.05),transparent);pointer-events:none;z-index:0}
.app{display:none;max-width:1920px;margin:0 auto;padding:0 52px}
.header{padding:36px 0 28px;margin:0 -52px;padding-left:52px;padding-right:52px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(17,24,39,.97) 0%,var(--bg-primary) 100%)}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.header-left{flex:1}
.project-label{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent-cyan);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.project-label .dot{width:7px;height:7px;border-radius:50%;background:var(--accent-cyan);animation:pd 2s ease-in-out infinite}
@keyframes pd{0%,100%{opacity:1;box-shadow:0 0 4px var(--accent-cyan)}50%{opacity:.4;box-shadow:0 0 10px var(--accent-cyan)}}
.project-title{font-size:34px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#e2e8f0 30%,var(--accent-cyan) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.project-subtitle{font-size:15px;color:var(--text-secondary);margin-top:6px;max-width:660px;line-height:1.55}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0}
.lang-btn{font-family:var(--font-sans);font-size:13px;font-weight:600;padding:7px 14px;background:transparent;border:none;color:var(--text-muted);cursor:pointer;transition:all .2s}
.lang-btn.active{background:var(--accent-blue);color:#fff}
.header-stats{display:flex;gap:16px;flex-wrap:wrap}
.stat-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;min-width:138px;text-align:center}
.stat-value{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--accent-blue)}
.stat-value.cyan{color:var(--accent-cyan)}.stat-value.emerald{color:var(--accent-emerald)}.stat-value.amber{color:var(--accent-amber)}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);margin-top:3px}
.timeline-section{padding:24px 0 20px;margin:0 -52px;padding-left:52px;padding-right:52px;border-bottom:1px solid var(--border);background:var(--bg-secondary);overflow:hidden}
.timeline-title{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px}
.timeline-scroll{overflow-x:auto;padding-bottom:6px;position:relative}
.timeline-scroll::after{content:'scroll →';position:absolute;right:0;top:0;bottom:6px;display:flex;align-items:center;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);background:linear-gradient(90deg,transparent,var(--bg-secondary) 40%);padding:0 12px 0 40px;pointer-events:none;opacity:.6;animation:fadeHint 2.5s ease-in-out infinite}
@keyframes fadeHint{0%,100%{opacity:.6}50%{opacity:.2}}
.timeline-scroll.scrolled::after{display:none}
.timeline{display:flex;position:relative;min-width:max-content}
.timeline::before{content:'';position:absolute;top:8px;left:0;right:0;height:2px;background:var(--border)}
.tl-item{flex-shrink:0;text-align:center;position:relative;padding:0 16px;min-width:128px;cursor:default;transition:transform .15s}
.tl-item:hover{transform:translateY(-2px)}
.tl-item:hover .tl-date{color:#60a5fa}
.tl-item:hover .tl-dot{transform:scale(1.4);box-shadow:0 0 8px currentColor}
.tl-item:hover .tl-label{color:var(--text-primary)}
.tl-dot{width:10px;height:10px;transition:transform .15s,box-shadow .15s;border-radius:50%;background:var(--accent-blue);margin:3px auto 10px;position:relative;z-index:1;border:2px solid var(--bg-secondary)}
.tl-dot.cyan{background:var(--accent-cyan)}.tl-dot.emerald{background:var(--accent-emerald)}.tl-dot.amber{background:var(--accent-amber)}.tl-dot.red{background:var(--accent-red)}
.tl-date{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent-blue);transition:color .15s}
.tl-label{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.45;max-width:150px;margin-left:auto;margin-right:auto}
.toolbar{position:sticky;top:0;z-index:100;background:rgba(10,14,23,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 0;margin:0 -52px;padding-left:52px;padding-right:52px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.search-wrap{position:relative;flex:0 1 320px;min-width:200px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px;pointer-events:none}
.search-input{width:100%;font-family:var(--font-sans);font-size:14px;padding:10px 14px 10px 40px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--text-muted)}.search-input:focus{border-color:var(--accent-blue)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;display:none;padding:2px 6px;border-radius:4px}
.search-clear:hover{color:var(--text-primary);background:rgba(255,255,255,.06)}.search-clear.show{display:block}
.filter-group{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.filter-btn{font-family:var(--font-sans);font-size:13px;font-weight:600;padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-btn:hover{border-color:var(--accent-blue);color:var(--text-primary)}
.filter-btn.active{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff}
.result-count{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);white-space:nowrap}
.main{padding:24px 0 60px}
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);font-size:16px}
.no-results span{display:block;font-size:40px;margin-bottom:12px}
.company-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden}
.company-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:3px 0 0 3px;opacity:.7;transition:opacity .25s}
.company-card:hover{border-color:var(--border-active);background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.35),0 0 0 1px rgba(59,130,246,.1)}
.company-card:hover::before{opacity:1}
.company-card[data-cat=prime]::before{background:var(--accent-blue)}.company-card[data-cat=newspace]::before{background:var(--accent-cyan)}.company-card[data-cat=tech]::before{background:var(--accent-purple)}.company-card[data-cat=satellite]::before{background:var(--accent-emerald)}.company-card[data-cat=startup]::before{background:var(--accent-orange)}.company-card[data-cat=services]::before{background:var(--accent-amber)}.company-card[data-cat=academia]::before{background:#64748b}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-top>div:first-child{min-width:0;flex:1}
.card-market{white-space:nowrap;flex-shrink:0}
.company-name{font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.company-ticker{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--text-muted);margin-top:3px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:4px;letter-spacing:.3px;text-transform:uppercase}
.tag-blue{background:rgba(59,130,246,.15);color:#60a5fa}.tag-cyan{background:rgba(6,182,212,.15);color:#22d3ee}.tag-emerald{background:rgba(16,185,129,.15);color:#34d399}.tag-amber{background:rgba(245,158,11,.15);color:#fbbf24}.tag-purple{background:rgba(139,92,246,.15);color:#a78bfa}.tag-red{background:rgba(239,68,68,.15);color:#f87171}.tag-orange{background:rgba(249,115,22,.15);color:#fb923c}.tag-pink{background:rgba(236,72,153,.15);color:#f472b6}
.card-summary{font-size:14px;color:var(--text-secondary);margin-top:12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-cta{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent-blue);margin-top:14px;letter-spacing:.5px;opacity:0;transition:opacity .2s}
.company-card:hover .card-cta{opacity:1}
.modal-overlay{position:fixed;inset:0;z-index:9000;background:rgba(5,8,15,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s ease}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg-modal);border:1px solid var(--border);border-radius:14px;width:100%;max-width:740px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(59,130,246,.08);transform:translateY(20px) scale(.97);transition:transform .3s ease;position:relative}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal::-webkit-scrollbar{width:6px}.modal::-webkit-scrollbar-track{background:transparent}.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.modal-accent{height:4px;border-radius:14px 14px 0 0}
.modal-accent.prime{background:var(--accent-blue)}.modal-accent.newspace{background:var(--accent-cyan)}.modal-accent.tech{background:var(--accent-purple)}.modal-accent.satellite{background:var(--accent-emerald)}.modal-accent.startup{background:var(--accent-orange)}.modal-accent.services{background:var(--accent-amber)}.modal-accent.academia{background:#64748b}
.modal-header{padding:28px 32px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.modal-company-name{font-size:26px;font-weight:700;letter-spacing:-.3px}
.modal-ticker{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:4px}
.modal-close{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-secondary);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.modal-close:hover{background:rgba(255,255,255,.1);color:var(--text-primary)}
.modal-tags-wrap{display:flex;gap:7px;flex-wrap:wrap;padding:14px 32px 0}
.modal-body{padding:20px 32px 32px}
.modal-section{margin-bottom:24px}.modal-section:last-child{margin-bottom:0}
.modal-label{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.modal-label::after{content:'';flex:1;height:1px;background:var(--border)}
.modal-text{font-size:15px;color:var(--text-secondary);line-height:1.7}
.contract-card{background:rgba(59,130,246,.04);border:1px solid rgba(59,130,246,.12);border-radius:8px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s;position:relative}
.contract-card:hover{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08);transform:translateX(3px)}
.contract-card::after{content:'▸';position:absolute;right:16px;top:16px;font-family:var(--font-mono);font-size:14px;color:var(--text-muted);transition:color .2s}
.contract-card:hover::after{color:var(--accent-blue)}
.contract-name{font-size:15px;font-weight:700;color:var(--text-primary);padding-right:28px}
.contract-value{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--accent-emerald);margin-top:4px}
.contract-hint{font-size:11px;color:var(--text-muted);margin-top:4px;font-style:italic}
.partner-list{display:flex;gap:8px;flex-wrap:wrap}
.partner-chip{font-size:13px;font-weight:500;padding:5px 14px;border-radius:14px;background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.2)}
.modal2-overlay{backdrop-filter:blur(6px);position:fixed;inset:0;z-index:9500;background:rgba(5,8,15,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal2-overlay.open{opacity:1;pointer-events:auto}
.modal2{box-shadow:0 0 40px rgba(59,130,246,0.12),0 24px 48px rgba(0,0,0,0.5);background:var(--bg-modal2);border:1px solid var(--border);border-radius:12px;width:100%;max-width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.7),0 0 0 1px rgba(59,130,246,.1);transform:translateY(16px) scale(.96);transition:transform .25s ease;position:relative}
.modal2-overlay.open .modal2{box-shadow:0 0 40px rgba(59,130,246,0.12),0 24px 48px rgba(0,0,0,0.5);transform:translateY(0) scale(1)}
.modal2::-webkit-scrollbar{width:5px}.modal2::-webkit-scrollbar-track{background:transparent}.modal2::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.modal2-header{padding:24px 28px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.modal2-back{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-secondary);height:32px;padding:0 14px;border-radius:6px;cursor:pointer;font-family:var(--font-mono);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:all .15s}
.modal2-back:hover{background:rgba(255,255,255,.1);color:var(--text-primary)}
.modal2-close{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-secondary);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.modal2-close:hover{background:rgba(255,255,255,.1);color:var(--text-primary)}
.modal2-body{padding:20px 28px 28px}
.modal2-contract-title{font-size:20px;font-weight:700;margin-bottom:4px;line-height:1.35}
.modal2-contract-company{font-size:13px;color:var(--text-muted);margin-bottom:16px}
.modal2-value-box{display:inline-block;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:10px 18px;margin-bottom:20px}
.modal2-value-label{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.modal2-value{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--accent-emerald)}
.modal2-meta{margin:16px 0;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:2px 0;overflow:hidden}
.meta-row{display:flex;align-items:baseline;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.04);gap:12px}
.meta-row:last-child{border-bottom:none}
.meta-k{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);min-width:110px;flex-shrink:0}
.meta-v{font-size:14px;color:var(--text-primary);font-weight:500}
.modal2-desc-label{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.modal2-desc{font-size:15px;color:var(--text-secondary);line-height:1.75}
.modal2-desc p{margin:0 0 12px;line-height:1.7}
.modal2-desc p:last-child{margin-bottom:0}
.modal2-desc ul{margin:0 0 14px;padding-left:0;list-style:none}
.modal2-desc li{position:relative;padding:6px 0 6px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px;line-height:1.6}
.modal2-desc li::before{content:'›';position:absolute;left:0;color:var(--accent-blue);font-weight:700}
.modal2-desc li:last-child{border-bottom:none}
.modal2-desc strong,.modal2-desc b{color:var(--text-primary);font-weight:600}
.modal2-desc .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:12px 0;font-size:14px}
.modal2-desc .kv dt{color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px;padding-top:2px;font-family:var(--font-mono)}
.modal2-desc .kv dd{color:var(--text-secondary);margin:0;line-height:1.55}
.modal2-desc .ctx{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--text-muted);line-height:1.65;font-style:italic}

.card-market{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.5px;padding:3px 8px;border-radius:4px;margin-top:8px}
.card-market.public{background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.2)}
.card-market.private{background:rgba(245,158,11,.08);color:#fbbf24;border:1px solid rgba(245,158,11,.15)}
.card-market.academia-mkt{background:rgba(100,116,139,.1);color:#94a3b8;border:1px solid rgba(100,116,139,.2)}
.exposure-bar{margin-top:10px;display:flex;align-items:center;gap:8px}
.exposure-label{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);white-space:nowrap}
.exposure-track{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;max-width:120px}
.exposure-fill{height:100%;border-radius:3px;transition:width .3s}
.exposure-fill.exp-low{width:15%;background:#3b82f6}
.exposure-fill.exp-med{width:45%;background:#f59e0b}
.exposure-fill.exp-high{width:75%;background:#f97316}
.exposure-fill.exp-vhigh{width:100%;background:#ef4444}
.exposure-text{font-size:10px;font-weight:600;white-space:nowrap}
.exposure-text.exp-low{color:#60a5fa}
.exposure-text.exp-med{color:#fbbf24}
.exposure-text.exp-high{color:#fb923c}
.exposure-text.exp-vhigh{color:#f87171}
.modal-inv-panel{margin-top:16px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:14px 18px}
.modal-inv-title{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.modal-inv-title::after{content:'';flex:1;height:1px;background:var(--border)}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.inv-item{display:flex;flex-direction:column;gap:2px}
.inv-k{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}
.inv-v{font-size:14px;font-weight:600;color:var(--text-primary)}
.inv-v.warn{color:var(--accent-amber)}
.inv-note{grid-column:1/-1;margin-top:6px;font-size:12px;color:var(--text-muted);line-height:1.6;padding-top:8px;border-top:1px solid rgba(255,255,255,.04)}
.inv-note b{color:var(--accent-amber);font-weight:600}
.disclaimer{padding:24px 0;margin:0 -52px;padding-left:52px;padding-right:52px;text-align:center;font-size:11px;color:var(--text-muted);letter-spacing:.3px;line-height:1.7;border-top:1px solid var(--border)}
.content-wrap{max-width:1600px;margin:0 auto;width:100%}
@media(min-width:1600px){.company-grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:768px){
  .inv-grid{grid-template-columns:1fr}

{name:"SpaceX",ticker:"Nasdaq: SPCX (IPO Jun 12, 2026)",cat:"newspace",tags:[{label:["~$8.1B GD Awards","~$81億GD合約"],color:"red"},{label:["SB-AMTI $4.16B","SB-AMTI $41.6億"],color:"cyan"},{label:["SDN Backbone $2.29B","SDN骨幹 $22.9億"],color:"emerald"},{label:["C2 Consortium Prime","C2財團主導"],color:"pink"},{label:["SBI $3.2B Pool","SBI $32億池"],color:"amber"},{label:["Nasdaq: SPCX","那斯達克上市"],color:"blue"}],summary:["<b>~$8.1B</b> in Golden Dome awards — <b>$4.16B</b> SB-AMTI (May 29), <b>$2.29B</b> Space Data Network Backbone (May 26), <b>$1.6B</b> for 18 Falcon 9 launches (Jul); C2 consortium member; SBI prototype; listed Jun 12, 2026 (Nasdaq: SPCX, ~$2.07T mkt cap).","Golden Dome合約約<b>$81億</b>——<b>$41.6億</b>SB-AMTI（5月29日）、<b>$22.9億</b>太空數據網絡骨幹（5月26日）、<b>$16億</b>18次Falcon 9發射（7月）；C2財團成員；SBI原型；2026年6月12日上市（Nasdaq: SPCX，市值約$2.07兆）。"],role:["SpaceX has become the single largest Golden Dome contractor. In May 2026 Space Systems Command awarded it a $2.29B fixed-price agreement for the Space Data Network (SDN) Backbone — a Starshield-based, laser-linked data-transport layer connecting sensors, C2 nodes and interceptors, with an operational prototype due by end-2027 — and, three days later, $4.16B for the Space-Based Airborne Moving Target Indicator (SB-AMTI) constellation that tracks aircraft and missiles from orbit. In late July the Space Force added $1.6B for 18 Falcon 9 launches for its Space-Based Sensing & Targeting portfolio, all by end-2027. The WSJ (Aug 2026) tallied more than $8B of Golden Dome work — at least one-third of the funding so far. SpaceX is also the ninth member of the C2 software consortium (satcom integration) and one of 12 SBI prototype OTA holders. It listed on Nasdaq (SPCX) on June 12, 2026 after a record $75B IPO, following its February 2026 merger with xAI. Its share of Golden Dome and Musk's political ties remain live congressional concerns.","SpaceX已成為Golden Dome單一最大承包商。2026年5月，太空系統司令部授予其$22.9億固定價格太空數據網絡（SDN）骨幹協議——以Starshield為基礎、雷射互聯的數據傳輸層，連接感測器、C2節點與攔截器，須於2027年底前交付作戰原型；三天後再獲$41.6億天基空中移動目標指示（SB-AMTI）星座合約，從軌道追蹤飛機與導彈。7月底太空軍再追加$16億、18次Falcon 9發射，服務天基感測與瞄準組合，2027年底前完成。華爾街日報（2026年8月）統計其Golden Dome合約逾$80億——至少佔迄今資金三分之一。SpaceX同時是C2軟體財團第9位成員（衛星通訊整合）及12家SBI原型OTA持有者之一。公司於2026年2月與xAI合併後，6月12日以創紀錄$750億IPO在那斯達克上市（SPCX）。其Golden Dome份額及Musk政治關係仍是國會關注焦點。"],contracts:[{name:"SB-AMTI Constellation (May 29, 2026)",value:"<b>$4.16B</b>",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["Contract (initial SB-AMTI constellation)","合約（初始SB-AMTI星座）"],pop:["May 2026 – initial constellation (2027+)","2026年5月–初始星座（2027年起）"],desc:["<p>Awarded May 29, 2026. The Space-Based Airborne Moving Target Indicator is a system-of-systems combining orbital sensors, secure comms links and AI-enabled ground processing to detect, track and alert on airborne threats worldwide — closing blind spots of ground radars and surveillance aircraft.</p><ul><li>Earlier reporting (WSJ, 2025) pointed to a ~$2B, 600-satellite deal; the final award is roughly twice that.</li><li>SpaceX must integrate the AMTI sensors with the SDN Backbone it is also building.</li><li>Part of the +$10B added to the $185B architecture in March 2026 (AMTI, HBTSS, space data network).</li></ul>","<p>2026年5月29日授予。天基空中移動目標指示（SB-AMTI）為「系統的系統」，結合軌道感測器、安全通訊鏈路與AI地面處理，在全球偵測、追蹤並預警空中威脅——填補地面雷達與預警機的盲區。</p><ul><li>早前報導（華爾街日報，2025年）指約$20億、600顆衛星；最終授標約為兩倍。</li><li>SpaceX須將AMTI感測器與其同時建造的SDN骨幹整合。</li><li>屬2026年3月為$1,850億架構追加的$100億（AMTI、HBTSS、太空數據網絡）。</li></ul>"]},{name:"Space Data Network (SDN) Backbone (May 26, 2026)",value:"<b>$2.29B</b> (fixed-price)",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["Fixed-price OTA","固定價格OTA"],pop:["May 2026 – end-2027 (operational prototype)","2026年5月–2027年底（作戰原型）"],desc:["<p>High-capacity, low-latency data transport built on Starshield satellites with optical inter-satellite links — the layer that carries sensor tracks to C2 and interceptors for Golden Dome and CJADC2.</p><ul><li>Operational prototype capability due by end-2027.</li><li>Space Force says the acquisition preserves competition through an industry consortium for SDN integration.</li></ul>","<p>以Starshield衛星及光學星間鏈路構建的高容量、低延遲數據傳輸層——為Golden Dome與CJADC2將感測器追蹤數據送達C2與攔截器。</p><ul><li>須於2027年底前交付作戰原型能力。</li><li>太空軍表示採購透過產業聯盟進行SDN整合以維持競爭。</li></ul>"]},{name:"NSSL Phase 3 Lane 1 — 18 Falcon 9 Launches (Jul 2026)",value:"<b>$1.6B</b>",agency:["U.S. Space Force — SSC (Space Access)","美國太空軍——SSC（太空進入）"],type:["Launch service task orders (NSSL Phase 3 Lane 1)","發射服務任務訂單（NSSL第3階段Lane 1）"],pop:["Jul 2026 – end-2027","2026年7月–2027年底"],desc:["<p>A $1.6B order for 18 Falcon 9 missions supporting the Space-Based Sensing and Targeting portfolio (airborne-target tracking and data-relay satellites), to be completed by end-2027 — awarded on a two-month requirement-to-award timeline.</p>","<p>$16億訂單、18次Falcon 9任務，支援天基感測與瞄準組合（空中目標追蹤與數據中繼衛星），2027年底前完成——從需求確認到授標僅兩個月。</p>"]},{name:"Starshield / NRO Spy Satellite Network",value:"<b>$1.8B+</b> (classified, revealed 2023)",agency:["National Reconnaissance Office (NRO)","國家偵察局（NRO）"],type:["Classified contract","機密合約"],pop:["2021 – ongoing (ops since May 2024)","2021至今（2024年5月投入運營）"],desc:["<p><b>$1.8B</b> classified contract entered 2021, revealed by Reuters 2023. Hundreds of LEO spy satellites for continuous global monitoring.</p><ul><li>Purpose-built platforms adapted from Starlink with target tracking, optical/radio reconnaissance, early missile warning.</li><li>Primary customers: SDA, NRO, USSF.</li><li>Operations commenced May 2024 (NROL-146). 183+ launched including NROL-145 (22 sats, Apr 2025).</li><li>Northrop Grumman manufacturing partner.</li><li>Imaging exceeds most existing U.S. gov systems.</li><li>Air-gapped Starlink variant with military-grade encryption.</li><li>Col.</li><li>Weisler (Delta 8) confirmed enhanced encryption.</li><li>Forms foundational Golden Dome sensor layer.</li></ul>","<p>2021年簽訂<b>$18</b>億機密合約（路透社2023年披露）。數百顆低軌偵察衛星。</p><ul><li>基於Starlink改造，增加目標追蹤、偵察及導彈預警。</li><li>2024年5月投入運營。</li><li>183+已發射。</li><li>與Northrop Grumman合作製造。</li><li>成像超越現有大多數美國政府系統。</li><li>軍用級加密。</li><li>構成Golden Dome感測器基礎層。</li></ul>"]},{name:"Milnet Military Comms",value:"Classified (multi-billion est.)",agency:["U.S. Space Force / NRO (joint)","太空軍/NRO（聯合）"],type:["Classified","機密"],pop:["Ongoing","進行中"],desc:["<p>Classified military comms backbone funded by Space Force, NRO managing.</p><ul><li>Uses Starshield terminals with military-grade encryption, linkable to commercial Starlink.</li><li>Passes weapons-quality targeting tracks via Link-182 data link standard (adopted by USSF for future LEO comms).</li><li>Apex Space pre-integrating via Link-182.</li><li>SpaceX expected to manage Milnet, ground-vehicle tracking, and AMTI as interconnected portfolio.</li></ul>","<p>太空軍資助、NRO管理的機密通訊骨幹。</p><ul><li>使用Starshield軍用終端，可連接Starlink。</li><li>通過Link-182數據鏈傳送武器級瞄準數據。</li><li>SpaceX預計以組合方式管理Milnet、地面追蹤及AMTI多個環節。</li></ul>"]},{name:"Golden Dome C2 Software Consortium (Prime)",value:"Classified (9-firm consortium — satcom integration lead)",agency:["Golden Dome Office (DRPM Guetlein)","Golden Dome辦公室（Guetlein將軍）"],type:["Classified (tech firms as PRIMES, defense primes as SUBS)","機密（科技公司為主承商，國防巨頭為分包商）"],pop:["2025 – Summer 2026 live demo, then ongoing","2025–2026年夏演示，後續持續"],desc:["<p><b>Bloomberg exclusive (April 22, 2026)</b>: SpaceX revealed as the 9th and previously unnamed member of the Golden Dome C2 software consortium — completing the set after WSJ (Mar 24) named the first eight. SpaceX's role: <b>integrating satellite communications for military operations</b> across the Golden Dome architecture.</p><ul><li><b>Full 9-firm consortium:</b> SpaceX, Anduril, Palantir, Aalyria Technologies, Scale AI, Swoop Technologies as PRIMES; Lockheed Martin, Northrop Grumman, RTX as SUBCONTRACTORS.</li><li><b>SpaceX's contribution:</b> Leveraging Starshield/Starlink-derived satcom infrastructure to provide the communications backbone connecting space-based sensors, ground radars, and weapon systems.</li><li><b>Unprecedented structure:</b> Traditional defense primes working as SUBS to tech companies — and SpaceX is both a sensor provider (AMTI $2B) AND part of the software glue layer.</li><li><b>Guetlein:</b> C2 is the 'secret sauce' — the ONLY Golden Dome program run directly from his office.</li><li><b>Timeline:</b> Live software demonstration targeting summer 2026.</li><li><b>Significance:</b> Deepens SpaceX's role across multiple Golden Dome layers — custody (AMTI), comms (Milnet), and now C2 integration. Increasingly looks like SpaceX is the indispensable backbone.</li></ul><p><b>Update (Aug–Sep 2026):</b> The C2 layer has been tested twice, most recently in a June 2026 integrated test at White Sands Missile Range that Guetlein called the most complex integrated missile defense test the US has run; both validated C2, the sensor network and effectors. Officials say the tests stressed software and new sensor-to-shooter links. Guetlein's office has also stood up 'ApexR', a digital ecosystem fusing sensor data with AI. Member-level contract values remain undisclosed.</p>","<p><b>Bloomberg獨家（2026年4月22日）</b>：SpaceX被揭示為C2軟體財團的第9位、此前未公開成員——補齊了WSJ（3月24日）點名的前八家之後的完整名單。SpaceX的角色：<b>整合軍事衛星通訊</b>。</p><ul><li><b>完整9企業財團：</b>SpaceX、Anduril、Palantir、Aalyria、Scale AI、Swoop為主承商；LMT、NOC、RTX為分包商。</li><li><b>SpaceX貢獻：</b>利用Starshield/Starlink衍生的衛星通訊基礎設施，提供連接太空感測器、地面雷達和武器系統的通訊骨幹。</li><li><b>前所未有結構：</b>傳統國防巨頭作為科技公司的分包商——SpaceX同時身兼感測器供應商（AMTI $20億）和軟體膠合層成員。</li><li><b>時間線：</b>2026年夏實戰演示。</li><li><b>意義：</b>深化SpaceX在多個Golden Dome層的角色——監視（AMTI）、通訊（Milnet）、現在加上C2整合。越來越像不可或缺的骨幹。</li></ul><p><b>更新（2026年8–9月）：</b>C2層已完成兩次測試，最近一次為2026年6月在白沙飛彈靶場的整合測試，Guetlein稱之為美國史上最複雜的整合導彈防禦測試；兩次測試均驗證了C2、感測器網絡與攔截手段。官員表示測試重點在軟體及全新「感測器到射手」鏈路。Guetlein辦公室亦建立「ApexR」數位生態系統，以AI融合感測器數據。各成員合約金額仍未披露。</p>"]},{name:"Space-Based Interceptor (SBI) Prototype — Part of $3.2B/12-firm Pool",value:"Share of <b>$3.2B</b> pool (Apr 24, 2026 announcement, awarded late 2025/early 2026)",agency:["U.S. Space Force","美國太空軍"],type:["Classified OTA — prototype competition","機密OTA——原型競爭"],pop:["Nov 2025 – ongoing prototype phase","2025年11月–原型階段進行中"],desc:["<p>SpaceX reportedly among the recipients of late-November 2025 classified OTAs for space-based interceptor (SBI) prototypes alongside Northrop Grumman, Lockheed Martin, Anduril, and True Anomaly.</p><ul><li><b>Mission:</b> Destroy enemy missiles during boost phase (minutes after launch) from orbit.</li><li><b>Structure:</b> Each initial contract <$9M; companies compete for multi-billion dollar production awards via ground demo → two flight tests → final intercept test.</li><li><b>Guetlein caveat (Apr 2026 Congressional testimony):</b> 'We are so focused on affordability. If we cannot do it affordably, we will not go into production.' SBI may not make final architecture if cost prohibitive.</li><li><b>Reconciliation funding:</b> $5.59B earmarked for FY2026 'space-based and boost phase interceptor capabilities.'</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>SpaceX據報為2025年11月底機密OTA太空攔截器（SBI）原型合約得主之一，與NOC、LMT、Anduril、True Anomaly並列。</p><ul><li><b>任務：</b>助推階段（發射後數分鐘）從軌道摧毀敵方導彈。</li><li><b>結構：</b>每份初始合約<$900萬；競爭數十億美元生產合約。</li><li><b>Guetlein警告（2026年4月國會證詞）：</b>如成本不可負擔，SBI可能不進入生產。</li><li><b>調節撥款：</b>FY2026專款<b>$55.9</b>億用於「太空基地和助推階段攔截器能力」。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["Palantir","Anduril","Northrop Grumman (Starshield)","Castelion (SBI spinoff)"],mkt:"public",rev:["~$18.7B (FY2025); Q2'26 revenue $7.81B incl. xAI (10-Q) · mkt cap ~$2.07T","約$187億（FY2025）；2026年Q2營收$78.1億（含xAI，10-Q）·市值約$2.07兆"],gdVal:["~$8.1B awarded: SB-AMTI $4.16B + SDN $2.29B + 18 launches $1.6B; plus C2 + SBI","已獲約$81億：SB-AMTI $41.6億＋SDN $22.9億＋18次發射$16億；另有C2＋SBI"],exp:"high",invNote:["<b>Now investable (Nasdaq: SPCX).</b> Golden Dome awards (~$8.1B, executing through 2027) equal ~43% of FY2025 revenue but well under 1% of a ~$2.07T market cap — equity value is driven by Starlink and xAI, not missile defense. GD matters as validation of Starshield as the government's default space backbone and as long-tail O&M optionality. Risks: extreme valuation and beta, staggered lock-up expiries (180 days for pre-IPO holders; 366 days for insiders), heavy AI capex (Q1'26 capex $10.1B) and political/concentration scrutiny of SpaceX's share of Golden Dome. Next earnings Nov 5, 2026.","<b>現已可投資（Nasdaq: SPCX）。</b>Golden Dome合約（約$81億，執行至2027年）相當於FY2025營收約43%，但佔約$2.07兆市值遠低於1%——股權價值由Starlink與xAI驅動，而非導彈防禦。GD的意義在於確立Starshield為政府預設太空骨幹，並帶來長尾維運選擇權。風險：極高估值與貝塔、分階段禁售期解除（IPO前股東180天；內部人366天）、龐大AI資本支出（2026年Q1達$101億），以及國會對SpaceX佔Golden Dome份額的政治/集中度審視。下次財報2026年11月5日。"]},
{name:"Lockheed Martin",ticker:"NYSE: LMT",cat:"prime",tags:[{label:["THAAD $35B MYP","THAAD $350億多年期"],color:"red"},{label:["Defense Prime","國防主承商"],color:"blue"},{label:["SBI On-Orbit Demo 2028","太空攔截器2028在軌演示"],color:"cyan"},{label:["C2BMC Lead","C2BMC主導"],color:"emerald"},{label:["C2 Consortium (Sub)","C2財團(分包商)"],color:"pink"}],summary:["Record <b>$230.4B</b> backlog incl. a <b>$35B</b> 7-yr MDA THAAD multiyear (late Jun 2026, ~4x output); Q2'26 sales $20.1B (+11%), FY26 guide $79.75–81.75B; NGI entering production (operational 2030); SBI on-orbit demo by end-2027; C2 sub; THAAD/PAC-3 are Epic 1's 'existing kit'.","創紀錄<b>$2,304億</b>積壓訂單，含<b>$350億</b>、7年期MDA THAAD多年期合約（2026年6月底，產能約4倍）；2026年Q2銷售$201億（+11%），FY26指引$797.5–817.5億；NGI進入量產（2030年服役）；SBI在軌演示2027年底；C2分包；THAAD/PAC-3即Epic 1的「現有裝備」。"],role:["Lockheed Martin is the most deeply embedded legacy prime. Leads MDA's National Team for C2BMC — the 'world's most powerful missile defense software network.' <b>CEO Taiclet</b> (Q3 2025 earnings): building 'full-up operational prototypes that will go into space,' targeting on-orbit SBI demonstration by 2028. Amanda Pound (Director Advanced Programs, Aug 5 2025 Huntsville briefing): exploring orbital lasers and maneuverable kinetic projectiles. Center for Innovation opened in Virginia for Golden Dome C2 prototyping using open systems architecture fusing capabilities 'from seabed to space.' Named prime vendor for C2 architecture. Classified SBI contract. <b>$1.65B</b> FY2026 capex for Space Park high-rate kill vehicle production. NGI prime (beat Northrop, Apr 2024). Core systems: PAC-3 MSE, THAAD, SBIRS, LRDR (first ICBM tracking Jun 2025), Aegis BMD, Tranche 2 sats. On March 17, 2026, Gen. Guetlein revealed LMT, RTX, and NOC have formally joined a nine-company C2 consortium — described as Golden Dome's 'secret sauce' — that briefs Guetlein every Thursday evening and can vote out underperforming members.","Lockheed Martin是嵌入最深的主承商。主導C2BMC國家團隊。<b>CEO Taiclet</b>（Q3 2025）：建造「完整運作原型，將上太空」，目標2028年在軌演示。Pound（2025年8月Huntsville）：探索軌道雷射和機動動能彈。維吉尼亞州創新中心進行Golden Dome C2原型開發。C2架構主要供應商。<b>$16.5</b>億資本支出。NGI主承商（2024年4月擊敗Northrop）。"],contracts:[{name:"MDA THAAD Multiyear Production (Jun 2026)",value:"<b>$35B</b> (7-year)",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["Multiyear production contract","多年期生產合約"],pop:["Jun 2026 – ~2033 (7 years)","2026年6月–約2033年（7年）"],desc:["<p>Seven-year, $35B contract awarded in late June 2026 to roughly quadruple production of Terminal High Altitude Area Defense interceptors — the largest single driver of Lockheed's record $230.4B backlog and 3.2x Q2 book-to-bill.</p><ul><li>THAAD and PAC-3 are exactly the fielded kit Guetlein says Epic 1 (2028) will repackage for homeland defense.</li><li>Funded through regular MDA procurement rather than the Golden Dome reconciliation pot — though the September CR's lack of multiyear anomalies creates ordering-quantity risk.</li></ul>","<p>2026年6月底授予的7年期$350億合約，將THAAD攔截彈產量提升約四倍——洛馬創紀錄$2,304億積壓及Q2訂單出貨比3.2倍的最大單一來源。</p><ul><li>THAAD與PAC-3正是Guetlein所說Epic 1（2028年）將重新組合用於本土防禦的已部署裝備。</li><li>資金來自MDA常規採購而非Golden Dome調和法案資金池——但9月CR未納入多年期特例，存在訂購數量風險。</li></ul>"]},{name:"SBI Prototype — OTA + Self-funded Demo",value:"Classified OTA (~<b>$9</b>-10M) + IR&D (2028 on-orbit target)",agency:["U.S. Space Force (SSC)","太空軍（SSC）"],type:["OTA + Company IR&D","OTA + 公司內部研發"],pop:["Nov 2025 – 2028 (on-orbit demo)","2025年11月–2028年（在軌演示）"],desc:["<p>Among 18 firms awarded classified OTA for boost-phase SBI prototypes (Nov 2025). SatNews reported ~<b>$120K</b> initial 'prize' funds for ground demos; true value in future production contracts worth billions annually.</p><ul><li><b>CEO Taiclet</b> (Q3 2025 earnings): 'We are building prototypes, full-up operational prototypes, not things in labs.</li><li>Things that will go into space and can be produced at scale.' Amanda Pound (Aug 5, 2025 Huntsville press briefing): exploring multiple concepts including orbital lasers and satellites converting to kinetic projectiles, targeting on-orbit demonstration by 2028.</li><li>Full-scale SBI flight tests scheduled early 2027 to meet 2028 IOC.</li><li>Lockheed shifting internal R&D allocation toward SBI — <b>CEO described</b> reaching <b>'the mountaintop'</b> in five-year IR&D strategy transformation.</li></ul><p>Aug 2026: Lockheed reiterated it is on track to demonstrate its SBI on orbit by end-2027.</p><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>18家獲機密OTA合約的公司之一（2025年11月）。</p><ul><li><b>CEO Taiclet</b>（Q3 2025）：「建造完整運作原型，將上太空，可量產。</li><li>」Pound（2025年8月）：探索軌道雷射和機動動能彈，目標2028年在軌演示。</li><li>SBI飛行測試定於2027年初。</li><li>Lockheed正轉移研發重心至SBI。</li></ul><p>2026年8月：洛馬重申SBI在軌演示進度可於2027年底前完成。</p><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]},{name:"Golden Dome C2 Architecture (Prime Vendor)",value:"Classified",agency:["Golden Dome Office (DRPM Guetlein)","Golden Dome辦公室（Guetlein將軍）"],type:["Classified (9-firm C2 consortium)","機密（九企業C2財團）"],pop:["Ongoing – Summer 2028 IOC","進行中–2028年夏IOC"],desc:["<p>Named prime vendor for Golden Dome C2 architecture.</p><ul><li>Leads MDA's C2BMC National Team — 'world's most powerful missile defense software network' connecting forces 24/7.</li><li>Opened Center for Innovation in Virginia for collaborative Golden Dome C2 development.</li><li>Open systems architecture already fusing C2 capabilities <b>'from seabed to space,'</b> including other companies' systems.</li><li>This digital backbone role is critical — Golden Dome's effectiveness requires sub-second integration of orbital sensors, ground interceptors, and AI battle management.</li></ul>","<p>被指定為Golden Dome C2架構主要供應商。</p><ul><li>主導C2BMC國家團隊。</li><li>在維吉尼亞州開設創新中心進行C2原型開發。</li><li>開放系統架構融合「從海底到太空」的C2能力。</li><li>數位骨幹角色至關重要。</li></ul>"]},{name:"THAAD / Aegis / NGI / PAC-3 / LRDR",value:"Multi-billion (NDAA FY2026 fully funded)",agency:["MDA / U.S. Army / U.S. Navy","MDA/美國陸軍/海軍"],type:["Multiple (FFP & Cost-Plus)","多種（FFP及成本加成）"],pop:["Ongoing (multi-decade programs)","進行中（跨數十年計劃）"],desc:["<p>Core fielded systems forming Golden Dome's ground/terminal layers. NDAA FY2026 authorized full THAAD and SM-3 IIA funding.</p><ul><li>PAC-3 MSE and THAAD battle-proven including Operation Epic Fury (Feb 2026).</li><li>NGI prime (beat Northrop, Apr 2024) — first-line-of-defense interceptor within GMD.</li><li>LRDR in Alaska tracked first ICBM-representative target (Jun 2025) — prerequisite for Golden Dome's integrated detection chain.</li><li>SBIRS provides IR missile warning.</li><li>CEO: 'rapidly increasing production capacity across missiles, sensors, battle management, satellite integration.'</li></ul>","<p>核心系統構成Golden Dome地面/末端層。</p><ul><li>FY2026 NDAA全額資助THAAD和SM-3。</li><li>PAC-3和THAAD在Epic Fury行動（2026年2月）中實戰驗證。</li><li>NGI主承商。</li><li>LRDR 2025年6月首次追蹤ICBM級目標。</li></ul>"]}],partners:["Northrop Grumman","RTX","Boeing","MDA (C2BMC)"],mkt:"public",rev:["$75.0B (FY2025, 10-K); FY26 guide $79.75–81.75B","$750億（FY2025，10-K）；FY26指引$797.5–817.5億"],gdVal:["$35B THAAD MYP + SBI prototype + NGI + PAC-3 + C2 sub","$350億THAAD多年期＋SBI原型＋NGI＋PAC-3＋C2分包"],exp:"med",invNote:["<b>Upgraded to Medium exposure.</b> The $35B THAAD multiyear makes Lockheed the clearest near-term winner of Epic 1's 'repackage existing kit' approach: THAAD, PAC-3, Aegis/C2BMC and NGI all map to the 2028 homeland layer. Q2 book-to-bill of 3.2x and a raised guide (FY26 sales +8% at midpoint) show demand is broad (F-35, munitions). SBI remains a free option (Gate 1 passed; on-orbit demo end-2027). Risks: CR limits on new starts and multiyear quantities; Space segment margins.","<b>曝險上調至「中」。</b>$350億THAAD多年期合約使洛馬成為Epic 1「重新組合現有裝備」路線最明確的近期贏家：THAAD、PAC-3、Aegis/C2BMC與NGI皆對應2028年本土防禦層。Q2訂單出貨比3.2倍、指引上調（FY26銷售中值+8%）顯示需求廣泛（F-35、彈藥）。SBI為免費選擇權（已過第一關；2027年底在軌演示）。風險：CR限制新項目與多年期數量；太空部門利潤率。"]},
{name:"Northrop Grumman",ticker:"NYSE: NOC",cat:"prime",tags:[{label:["SBI Demo (Jun 2026)","SBI演示(2026年6月)"],color:"red"},{label:["Defense Prime","國防主承商"],color:"blue"},{label:["SBI Ground Testing","太空攔截器地面測試"],color:"cyan"},{label:["IBCS / 150 Sats","IBCS/150衛星"],color:"emerald"},{label:["C2 Consortium (Sub)","C2財團(分包商)"],color:"pink"}],summary:["Q2'26 sales $10.88B (+5%), record <b>$104.7B</b> backlog; ~$0.8B Glide Phase Interceptor award in Q2; GMD weapon system; SBI demo with Apex (self-funded, on-orbit by end-2027; Gate 1 passed); sub on KTOS GMI and C2; FY26 guide $43.75–44.25B.","2026年Q2銷售$108.8億（+5%），創紀錄<b>$1,047億</b>積壓；Q2獲約$8億滑翔段攔截彈（GPI）訂單；GMD武器系統；與Apex合作SBI演示（自籌資金，2027年底在軌；已過第一關）；KTOS GMI及C2分包；FY26指引$437.5–442.5億。"],role:["Northrop has the deepest SBI heritage — prime contractor for SDI's SBI component in the 1980s. <b>CEO Warden</b> (Q3 2025 earnings): 'Space-based interceptors, which we're testing now... ground-based tests today.' Raymond Sharp (Golden Dome Enterprise Lead): SBI technology 'light-years ahead' of Brilliant Pebbles era. Positioned IBCS, G/ATOR (AN/TPS-80), Triton (MQ-4C), plus restricted programs for Golden Dome. Committed to 150 SDA satellites. <b>$1.65B</b> FY2026 capex for Space Park. ICBM target redesign first flight Jan 8, 2026 — critical for testing interceptors. Starshield manufacturing partner with SpaceX.","Northrop擁有最深SBI歷史——SDI SBI主承商。<b>CEO Warden</b>（Q3 2025）：「太空攔截器，正在測試。」Sharp（Golden Dome企業負責人）：技術比Brilliant Pebbles「超前光年」。定位IBCS、G/ATOR、Triton。150顆SDA衛星。<b>$16.5</b>億資本支出。ICBM靶彈2026年1月8日首飛。Starshield合作。"],contracts:[{name:"SBI Demonstration Selection (Jun 1, 2026)",value:"Company-funded demo + <b>$3.2B</b> pool prototype OTA",agency:["U.S. Space Force (SSC)","太空軍（SSC）"],type:["OTA + Company IR&D","OTA + 公司內部研發"],pop:["Nov 2025 – TBD (ground testing)","2025年11月–待定（地面測試中）"],desc:["<p><b>June 1, 2026: Space Force selected Northrop Grumman to demonstrate space-based interceptor capabilities — with Apex Space as key industrial collaborator. On track for on-orbit demonstration by 2027 following successful 2026 ground tests.</b> Part of $3.2B/12-firm SBI pool. Unique heritage: prime contractor for SDI's SBI component (1980s Brilliant Pebbles).</p><ul><li><b>CEO Warden</b> (Jul 2025): 'Space-based interceptors, which we're testing now... these are ground-based tests today, and we are in competition.' Raymond Sharp (Golden Dome Enterprise Lead): 'Processing speed is significantly more advanced, faster than it was in the 1980s...</li><li>SBIs are a lot more achievable and realistic now.' Already providing operational analysis to Pentagon on SBI concepts.</li><li><b>Michelle Mathieson (SBI Lead)</b>: SBIs would be 'the first to see, engage and intercept the threat' — the 'first up<b>' in America'</b>s missile defense, engaging with less time and energy than ground-based systems.</li><li>Warden declined to detail kill mechanism but confirmed it can be 'accelerated into the time frame the administration is looking for.'</li></ul><p>Breaking Defense (Jun 2026): the demonstration is self-funded under the Space Force prize competition; Northrop says key ground tests are complete and it is on track for on-orbit demo by end-2027.</p><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>18家獲機密OTA合約的公司之一（2025年11月）。</p><ul><li>獨特歷史：SDI SBI主承商。</li><li><b>CEO Warden</b>（2025年7月）：「太空攔截器，正在地面測試。</li><li>」Sharp：「處理速度比1980年代顯著提升。</li><li>」Mathieson（SBI負責人）：太空攔截器將是「第一個發現、交戰和攔截威脅的」——以更少時間和能量比地面系統交戰。</li></ul><p>Breaking Defense（2026年6月）：演示在太空軍獎勵競賽下自籌資金；諾格表示關鍵地面測試已完成，2027年底前在軌演示進度正常。</p><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]},{name:"Glide Phase Interceptor (GPI) — Q2 2026 Award",value:"~<b>$0.8B</b> (Q2 2026 net awards)",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["Development contract","開發合約"],pop:["Ongoing (hypersonic defense)","進行中（高超音速防禦）"],desc:["<p>Northrop booked about $0.8B of GPI awards in Q2 2026 within $20.0B of net awards; GPI and Ground-based Midcourse Defense weapon-system volume drove Space Systems sales +4%.</p><ul><li>GPI targets hypersonic glide vehicles during the glide phase — a core Golden Dome threat set.</li></ul>","<p>諾格於2026年Q2在$200億淨訂單中獲約$8億GPI訂單；GPI與陸基中段防禦（GMD）武器系統推動太空系統部門銷售+4%。</p><ul><li>GPI於滑翔段攔截高超音速滑翔載具——Golden Dome核心威脅類型。</li></ul>"]},{name:"SDA 150-Satellite Commitment",value:"Multi-billion (across tranches)",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Firm-Fixed-Price OTA (across tranches)","FFP OTA（跨多批次）"],pop:["2022 – FY2029+ (spiral development)","2022–FY2029+（螺旋開發）"],desc:["<p>150 satellites across SDA tranches for PWSA tracking and transport layers.</p><ul><li><b>$1.65B</b> FY2026 capex for Space Park to handle rapid production.</li><li>Represents fundamental shift toward high-volume orbital hardware manufacturing for the defense industrial base.</li></ul>","<p>跨SDA批次為PWSA製造150顆衛星。</p><ul><li><b>$16.5億</b>資本支出擴建Space Park。</li></ul>"]},{name:"IBCS / G/ATOR / Triton + Restricted Programs",value:"Multi-billion (ongoing)",agency:["U.S. Army / USMC / Navy","美國陸軍/陸戰隊/海軍"],type:["Multiple (program-dependent)","多種"],pop:["Ongoing (fielded systems)","進行中（已部署系統）"],desc:["<p><b>CEO Warden</b> specifically named: IBCS (Integrated Battle Command System) — connects sensors and shooters across domains; G/ATOR (AN/TPS-80) — ground/air task-oriented radar; Triton (MQ-4C) — unmanned maritime surveillance; plus restricted portfolio programs.</p><ul><li>IBCS is critical — the Army selected Anduril's Lattice for the IBCS-M variant, creating competitive dynamics.</li><li>These form Golden Dome's near-term operational backbone.</li><li>Redesigned ICBM target vehicle first flight Jan 8, 2026 (Robin Heard, Director Targets & Interceptors confirmed <b>'all performance goals met'</b>) — supports NGI testing and Golden Dome interceptor validation.</li></ul>","<p><b>CEO Warden點名</b>：IBCS、G/ATOR雷達、Triton無人機及限制計劃。</p><ul><li>IBCS連接跨域感測器和武器。</li><li>改型ICBM靶彈2026年1月8日首飛成功——支持攔截器測試驗證。</li></ul>"]}],partners:["SpaceX (Starshield)","Lockheed Martin","L3Harris","MDA"],mkt:"public",rev:["$41.95B (FY2025, 10-K); FY26 guide $43.75–44.25B","$419.5億（FY2025，10-K）；FY26指引$437.5–442.5億"],gdVal:["SBI demo (self-funded) + GPI + GMD + SDA tracking + C2/GMI sub","SBI演示（自籌）＋GPI＋GMD＋SDA追蹤＋C2/GMI分包"],exp:"med",invNote:["Northrop touches more Golden Dome layers than any prime — SBI demo (with Apex), the GPI hypersonic interceptor, GMD and SDA tracking satellites — yet it is a sub on both C2 and Kratos's GMI, a reminder that tech-led integrators now sit above primes in parts of the architecture. Backlog rose 17% YoY to a record $104.7B, but margins are under pressure (SiAW and GEM 63XL charges; Space margin 8.6%). SBI is self-funded under the prize model: upside if selected, sunk R&D if SBI is descoped.","諾格觸及的Golden Dome層級多於任何主承商——SBI演示（與Apex）、GPI高超音速攔截彈、GMD及SDA追蹤衛星——但在C2與Kratos GMI中均為分包商，顯示科技型整合商已在部分架構中位居主承商之上。積壓年增17%至創紀錄$1,047億，但利潤率承壓（SiAW與GEM 63XL減值；太空部門利潤率8.6%）。SBI以獎勵制自籌：獲選則有上行，若SBI被刪減則研發成本沉沒。"]},
{name:"RTX Corporation (Raytheon)",ticker:"NYSE: RTX",cat:"prime",tags:[{label:["SBI $3.2B Pool","SBI $32億池"],color:"red"},{label:["Defense Prime","國防主承商"],color:"blue"},{label:["Kinetic Interceptors","動能攔截器"],color:"red"},{label:["Patriot/SM-3/SM-6","愛國者/SM-3/SM-6"],color:"emerald"},{label:["C2 Consortium (Sub)","C2財團(分包商)"],color:"pink"}],summary:["Q2'26 sales $24.7B (+14%), record <b>$289B</b> backlog ($119B defense); Raytheon +18% with $19.9B bookings incl. ~$5B GEM-T Patriot; FY26 guide $95–96B; $515M SPY-6 + $100M RI capacity (Jun); SBI OTA (Rocket Lab supporting); selling Blue Canyon ($620M); C2 sub.","2026年Q2銷售$247億（+14%），創紀錄<b>$2,890億</b>積壓（國防$1,190億）；Raytheon +18%，訂單$199億含約$50億GEM-T愛國者；FY26指引$950–960億；6月$5.15億SPY-6＋$1億羅德島產能；SBI OTA（Rocket Lab支援）；出售Blue Canyon（$6.2億）；C2分包。"],role:["Raytheon anchors Golden Dome's ground and sea kinetic layers: Patriot (GEM-T/PAC-2), Standard Missile (SM-3 Block IIA, SM-6) and SPY-6 radars — precisely the fielded kit Guetlein says Epic 1 will repackage for homeland defense by 2028. In Q2 2026 Raytheon sales rose 18% on $19.9B of bookings (incl. ~$5B GEM-T); June brought a $515M SPY-6 award and a $100M Rhode Island radar/interceptor capacity investment; and Raytheon holds one of the 20 SBI prototype OTAs, with Rocket Lab supporting. RTX is a subcontractor in the C2 consortium and is selling smallsat-bus maker Blue Canyon Technologies for $620M. (Glide Phase Interceptor development sits with Northrop Grumman.)","Raytheon是Golden Dome地面與海上動能層的支柱：愛國者（GEM-T/PAC-2）、標準飛彈（SM-3 Block IIA、SM-6）及SPY-6雷達——正是Guetlein所說Epic 1將於2028年重新組合用於本土防禦的已部署裝備。2026年Q2 Raytheon銷售+18%，訂單$199億（含約$50億GEM-T）；6月獲$5.15億SPY-6合約並投資$1億擴充羅德島雷達/攔截彈產能；Raytheon持有20份SBI原型OTA之一，由Rocket Lab支援。RTX為C2財團分包商，並以$6.2億出售小衛星平台商Blue Canyon Technologies。（滑翔段攔截彈GPI由諾格負責。）"],contracts:[{name:"Patriot / SM-3 / SM-6 (Ongoing)",value:"Multi-billion (NDAA FY2026 fully funded)",agency:["U.S. Army / U.S. Navy / MDA","美國陸軍/海軍/MDA"],type:["Multiple (FFP production + CPFF dev)","多種（FFP生產+CPFF開發）"],pop:["Ongoing (NDAA FY2026 funded)","進行中（FY2026全額資助）"],desc:["<p>NDAA FY2026 authorized full funding. Army quadrupling Patriot missile procurement (Defense One, Jul 2025).</p><ul><li>SM-3 Block IIA provides sea-based BMD via Aegis ships — proven in real-world intercepts.</li><li>Q2 2026: Raytheon bookings $19.9B (2.42x book-to-bill) incl. ~$5B of GEM-T Patriot orders; sales +18%.</li><li><b>$1.7B</b> for four Patriot systems to Spain.</li><li>Patriot combat-proven in Operation Epic Fury (Feb 2026).</li><li>These ground/terminal systems form the layer that space-based sensors and interceptors will cue.</li></ul>","<p>FY2026 NDAA全額資助。陸軍愛國者採購量翻四倍。</p><ul><li>SM-3 Block IIA海基彈道導彈防禦。</li><li>2026年Q2：Raytheon訂單$199億（訂單出貨比2.42倍），含約$50億GEM-T愛國者訂單；銷售+18%。</li><li><b>$17億</b>西班牙合約。</li><li>愛國者在Epic Fury行動中實戰驗證。</li></ul>"]},{name:"USAF Contract Modification",value:"<b>$2.01B</b>",agency:["U.S. Air Force","美國空軍"],type:["Cost-Plus-Fixed-Fee (CPFF)","成本加固定費用（CPFF）"],pop:["Ongoing (multi-year sustainment)","進行中（多年維護）"],desc:["<p>Raytheon secured <b>$2.01B</b> USAF contract modification extending missile defense radar and interceptor support.</p><ul><li>Backbone of CONUS air defense that Golden Dome integrates and augments.</li></ul>","<p>Raytheon獲<b>$20.1</b>億空軍合約修訂，擴展導彈防禦雷達和攔截器支持工作。</p><ul><li>延續美國本土（CONUS）防空骨幹系統的運營和維護支持。</li><li>Golden Dome 將整合並強化（而非替換）這些已部署的現有雷達和攔截器系統。</li><li>涵蓋雷達維護、攔截器後勤保障及系統升級工作，確保地面防禦層在太空組件開發期間持續運作。</li></ul>"]},{name:"SHIELD IDIQ (Phase 2)",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Qualified Dec 18, 2025.</p><ul><li>Pursues kinetic interceptor, directed energy, ground defense task orders.</li><li>RTX's breadth across radar, interceptors, EW makes it a candidate for multiple Golden Dome layers.</li></ul>","<p>2025年12月18日取得資格。</p><ul><li>RTX在雷達、攔截器和電子戰方面的廣度適合多個Golden Dome層面。</li></ul>"]},{name:"RI Production Expansion + SPY-6 (Jun 2026)",value:"<b>$100M</b> RI investment + <b>$515M</b> SPY-6 contract",agency:["U.S. Navy / U.S. Army","美國海軍/陸軍"],type:["Capital investment + FFP production","資本投資+FFP生產"],pop:["Jun 2026 – ongoing","2026年6月–進行中"],desc:["<p>June 2026: RTX accelerating missile-defense production capacity to meet Golden Dome demand.</p><ul><li><b>$100M (Jun 8):</b> Investment to accelerate radar testing and interceptor production in Rhode Island.</li><li><b>$515M (Jun 3):</b> Raytheon awarded contract for SPY-6 family of radars — the Navy's next-gen air & missile defense radar used on Aegis ships (relevant to Golden Dome's land-based Aegis sites).</li><li><b>SBI partnership:</b> Raytheon is the prime under which Rocket Lab supports the Space-Based Interceptor program (Jun 2026).</li><li>RTX positioned across Golden Dome ground/sea layers: Patriot, SM-3, GPI (hypersonic), SPY-6 radar, plus SBI via partnership.</li></ul>","<p>2026年6月：RTX加速導彈防禦生產能力以滿足Golden Dome需求。</p><ul><li><b>$1億（6月8日）：</b>投資加速羅德島州雷達測試和攔截器生產。</li><li><b>$5.15億（6月3日）：</b>Raytheon獲SPY-6雷達系列合約——海軍次世代防空導彈防禦雷達（與Golden Dome陸基Aegis陣地相關）。</li><li><b>SBI合作：</b>Raytheon為主承商，Rocket Lab支持太空攔截器計劃（2026年6月）。</li></ul>"]},{name:"SBI Prototype OTA (part of $3.2B/12-firm pool)",value:"Share of <b>$3.2B</b> pool (20 OTAs)",agency:["U.S. Space Force — Space Systems Command (SSC)","美國太空軍——太空系統司令部（SSC）"],type:["OTA (prize-based, 4 gates)","OTA（獎勵制，4道關卡）"],pop:["Late 2025 – 2028 demo","2025年底–2028年演示"],desc:["<p>Raytheon holds one of the 20 SBI OTAs; Rocket Lab supports Raytheon's effort with launch and orbital infrastructure (Jun 2026).</p><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>Raytheon持有20份SBI OTA之一；Rocket Lab以發射及軌道基礎設施支援（2026年6月）。</p><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]}],partners:["Lockheed Martin (THAAD)","Rafael (David's Sling)","U.S. Army","Rocket Lab (SBI)"],mkt:"public",rev:["$88.6B (FY2025, 10-K); FY26 guide $95–96B","$886億（FY2025，10-K）；FY26指引$950–960億"],gdVal:["Patriot/SM-3/SM-6 ramp + SPY-6 + SBI OTA + C2 sub","愛國者/SM-3/SM-6擴產＋SPY-6＋SBI OTA＋C2分包"],exp:"low",invNote:["RTX is Epic 1's workhorse: Patriot and Standard Missile are the existing kit Guetlein plans to repackage by 2028, and Raytheon's 2.42x Q2 book-to-bill shows demand far exceeding Golden Dome itself (Iran-war replenishment, Europe). Golden Dome is incremental, not defining, for a $95B revenue base — exposure stays Low. Blue Canyon sale trims a space-bus business that was a secondary GD vector.","RTX是Epic 1的主力：愛國者與標準飛彈即Guetlein計劃於2028年重新組合的現有裝備，Raytheon Q2訂單出貨比2.42倍顯示需求遠超Golden Dome本身（伊朗戰爭補庫、歐洲）。對$950億營收而言，Golden Dome屬增量而非決定性因素——曝險維持「低」。出售Blue Canyon削減了一項次要的GD衛星平台業務。"]},
{name:"Anduril Industries",ticker:"Private (<b>$61B</b> Series H; ~$100B round reported)",cat:"tech",tags:[{label:["Defense Tech","國防科技"],color:"purple"},{label:["SBI Prototype","太空攔截器原型"],color:"cyan"},{label:["Lattice OS / IBCS-M","Lattice/IBCS-M"],color:"orange"},{label:["C2 Consortium Prime","C2財團主導"],color:"pink"}],summary:["<b>$61B</b> Series H (May 2026; reported talks at ~$100B, Jul); FY2025 revenue $2.2B (2x); C2 consortium prime (tested twice incl. White Sands, Jun 2026); SBI OTA with Impulse/Inversion/K2/Voyager/Sandia team (Gate 1 passed); $20B Army enterprise; ExoAnalytic; Mississippi SRM plant.","<b>$610億</b>H輪（2026年5月；7月據報洽談約$1,000億估值）；FY2025營收$22億（翻倍）；C2財團主導（含6月白沙飛彈靶場共兩次測試）；SBI OTA，團隊含Impulse/Inversion/K2/Voyager/Sandia（已過第一關）；$200億陸軍企業合約；ExoAnalytic；密西西比固體火箭發動機廠。"],role:["Anduril now sits in three Golden Dome roles at once. (1) C2: a prime in the software consortium building the 'glue layer', which has passed two integrated tests. (2) SBI: one of 12 prototype OTA holders, leading its own supplier team — Impulse Space (in-space mobility), Inversion Space (reentry), K2 Space (large buses), Voyager Technologies (divert & attitude control) and Sandia National Laboratories. (3) Industrial base: its Mississippi solid-rocket-motor plant (online Aug 2025, targeting 6,000 tactical motors/yr by end-2026) makes it a third US SRM supplier as Congress pushes for SRM competition. Around this sit the $20B Army enterprise contract (Mar 2026, Lattice), the ExoAnalytic acquisition (400+ telescopes for space domain awareness) and Arsenal-1 in Ohio. Financially: FY2025 revenue $2.2B (more than doubled), a $5B Series H at $61B (May 13, 2026) and reported talks in July at ~$100B.","Anduril目前同時擔任Golden Dome三種角色。（1）C2：打造「膠合層」的軟體財團主導成員，已通過兩次整合測試。（2）SBI：12家原型OTA持有者之一，並率領自有供應團隊——Impulse Space（軌道機動）、Inversion Space（再入艙）、K2 Space（大型衛星平台）、Voyager Technologies（轉向與姿態控制）及桑迪亞國家實驗室。（3）工業基礎：密西西比固體火箭發動機廠（2025年8月投產，目標2026年底年產6,000具戰術發動機）使其成為美國第三家SRM供應商，正值國會推動SRM競爭。此外還有$200億陸軍企業合約（2026年3月，Lattice）、收購ExoAnalytic（400+台望遠鏡）及俄亥俄Arsenal-1工廠。財務：FY2025營收$22億（翻倍以上），2026年5月13日H輪$50億、估值$610億，7月據報洽談約$1,000億。"],contracts:[{name:"SBI Prototype — Part of $3.2B/12-firm Pool",value:"Share of <b>$3.2B</b> pool (Apr 24, 2026 — 20 OTAs to 12 firms)",agency:["U.S. Space Force (SSC)","太空軍（SSC）"],type:["OTA","OTA"],pop:["Nov 2025 – TBD","2025年11月–待定"],desc:["<p>One of 20 SBI OTAs (12 firms; up to $3.2B combined). Anduril leads a commercial-space team: Impulse Space (orbital mobility), Inversion Space (reentry vehicles), K2 Space (high-power buses), Voyager Technologies (divert & attitude control systems) and Sandia National Laboratories (weapons heritage).</p><ul><li>Lattice software for interceptor autonomy and engagement management.</li><li>Competes with Lockheed, Northrop, SpaceX, True Anomaly and others.</li></ul><p><b>Update (Aug 11, 2026):</b> SBI Gate 1 of 4 (design + component-level testing) has closed and SSC reports all providers progressing into Gate 2 (build space-capable hardware). Gate 3 proves it on orbit; Gate 4 proves it inside the Golden Dome architecture — only then a prize-based production decision, contingent on affordability and scalability.</p>","<p>20份SBI OTA之一（12家公司，合計上限$32億）。Anduril率領商業太空團隊：Impulse Space（軌道機動）、Inversion Space（再入載具）、K2 Space（高功率平台）、Voyager Technologies（轉向與姿態控制系統）及桑迪亞國家實驗室（武器研發傳承）。</p><ul><li>以Lattice軟體實現攔截器自主與交戰管理。</li><li>與洛馬、諾格、SpaceX、True Anomaly等競爭。</li></ul><p><b>更新（2026年8月11日）：</b>SBI四道關卡的第一道（設計＋組件級測試）已完成，SSC表示所有供應商均進入第二道（打造可上太空的硬體）。第三道為在軌驗證、第四道為在Golden Dome架構內驗證——全部通過後才以獎勵制作出量產決定，並取決於可負擔性與可擴展性。</p>"]},{name:"SpaceX-Palantir-Anduril Consortium",value:"TBD (est. multi-billion)",agency:["DoD / Golden Dome Office (bid stage)","國防部（競標階段）"],type:["TBD (consortium proposal)","待定（聯盟提案）"],pop:["TBD","待定"],desc:["<p>Reuters (Apr 2025): six sources confirmed the three companies met with top officials.</p><ul><li>Proposal: 400-1,000 tracking satellites + ~200 attack satellites with interceptors/lasers.</li><li>Anduril contributes Lattice OS (autonomous C2), Menace C4 platforms, autonomous defense systems.</li><li>Dec 2024: formalized consortium with Palantir combining Lattice (edge) + Maven/AIP (enterprise) — 'a deployment platform for new AI applications that anyone can build.' Expanding to OpenAI, Scale AI, Saronic per FT reporting.</li><li>Pitched subscription model.</li></ul>","<p>路透社（2025年4月）：六位消息人士確認與高官會面。</p><ul><li>提案：400-1,000追蹤衛星+~200攻擊衛星。</li><li>Anduril貢獻Lattice OS、Menace C4平台。</li><li>2024年12月與Palantir正式化聯盟。</li><li>擴展至OpenAI、Scale AI等。</li></ul>"]},{name:"Army IBCS-M / Lattice Selection + <b>$100M</b> CDAO",value:"Classified (IBCS-M) + <b>$100M</b> (CDAO)",agency:["U.S. Army (IBCS-M) / CDAO (edge AI)","美國陸軍/CDAO"],type:["OTA (IBCS-M + CDAO $100M)","OTA"],pop:["2025 – ongoing","2025–進行中"],desc:["<p>Army selected Lattice as IBCS-M fire control platform (2025) — single operator manages multiple UAS threats via fused sensor data, automated fire control. Yuma Proving Ground live-fire: integrated new sensor/effector within hours, successful engagements. 4th Infantry Division Ivy Sting exercises (1-6+) every ~6 weeks.</p><ul><li>Ivy Sting 4 (Feb 2026) largest — logistics integration, EW jamming.</li><li><b>Ivy Mass (~May 2026)</b> full-division event.</li><li>Separately, <b>$100M</b> CDAO OTA for edge data integration.</li><li>Positions Lattice as potential Golden Dome ground-layer C2.</li></ul>","<p>陸軍選擇Lattice為IBCS-M火控平台（2025）。</p><ul><li>Yuma實彈演習：數小時內整合新感測器。</li><li>第四步兵師Ivy Sting演習。</li><li>Ivy Mass（~2026年5月）師級演習。</li><li>另獲<b>$1億</b>CDAO OTA邊緣數據整合。</li></ul>"]},{name:"U.S. Army $20B Enterprise Contract (Mar 2026)",value:"Up to <b>$20B</b> (10-yr ceiling, FFP IDIQ)",agency:["U.S. Army Contracting Command (Aberdeen)","美國陸軍合約司令部（Aberdeen）"],type:["Firm-Fixed-Price IDIQ (5-yr base + 5-yr option)","固定價格IDIQ（5年基礎+5年選項）"],pop:["Mar 2026 – Mar 2036 (10 years)","2026年3月–2036年3月（10年）"],desc:["<p>Announced March 13, 2026. Largest single contract in Anduril history — consolidates 120+ separate procurement actions into a single enterprise agreement centered on the Lattice AI platform.</p><ul><li><b>First Task Order:</b> $87M for Lattice-based C2 under JIATF 401 (counter-UAS), signed same week.</li><li><b>Scope:</b> Lattice software suite, Altius UAVs, Ghost/Anvil counter-drone systems, Menace interceptors, Dive autonomous submarines, edge-compute infrastructure, and technical support.</li><li><b>Structure:</b> No money attached at signing — contract vehicle reduces procurement friction. Army issues task orders as funds are allocated from O&M, RDT&E, and procurement accounts.</li><li><b>Precedent:</b> Follows Army's $10B Palantir enterprise agreement (Aug 2025). Army signaling that Anduril's hardware+software model is worth 2x the bet.</li><li><b>Steckman (President):</b> 'There's no money attached to it, this is just a contract vehicle, but it reduces a lot of friction.'</li><li><b>Anduril 2025 revenue:</b> ~$2B. Arsenal-1 hyperscale manufacturing (Ohio) under construction.</li></ul>","<p>2026年3月13日宣布。Anduril史上最大單一合約——將120+獨立採購整合至以Lattice AI平台為核心的單一企業協議。</p><ul><li><b>首筆任務訂單：</b>$8,700萬Lattice C2（反無人機）。</li><li><b>範圍：</b>Lattice軟體、Altius無人機、Ghost/Anvil反無人機、Menace攔截器、Dive自主潛艇、邊緣計算。</li><li><b>結構：</b>簽約時無附帶資金——合約載具減少採購摩擦。</li><li><b>先例：</b>繼Palantir $100億陸軍企業協議（2025年8月）之後。陸軍信號：Anduril硬體+軟體模式值雙倍押注。</li></ul>"]},{name:"ExoAnalytic Solutions Acquisition (Mar 2026)",value:"Undisclosed (strategic acquisition)",agency:["N/A (commercial M&A)","不適用（商業併購）"],type:["Acquisition (pending regulatory approval)","收購（待監管批准）"],pop:["Mar 2026 – integration ongoing","2026年3月–整合進行中"],desc:["<p>Announced March 11, 2026. Anduril's first acquisition for its space business unit (11th overall). ExoAnalytic operates 400+ ground-based optical telescopes worldwide tracking thousands of orbital objects.</p><ul><li><b>Capability:</b> Space situational awareness — detecting satellite maneuvers, flagging anomalous behavior, supporting missile warning missions. Billions of observations for U.S. national security agencies.</li><li><b>Golden Dome Relevance:</b> Real-time awareness and coordination among thousands of GD satellites. Machine vision algorithms for orbital tracking directly applicable to missile defense.</li><li><b>Scale:</b> Anduril space team doubles overnight (~120 + ExoAnalytic ~130 = ~250 employees).</li><li><b>2026 Launches:</b> 3 self-funded spacecraft — IR tracking sat with Apex Space, GEO proximity ops with Impulse Space, and mission with Argo Space.</li></ul>","<p>2026年3月11日宣布。Anduril太空業務首筆收購（第11筆整體）。ExoAnalytic運營全球400+地面光學望遠鏡。</p><ul><li><b>能力：</b>太空域態勢感知——偵測衛星機動、標記異常行為。</li><li><b>Golden Dome相關：</b>數千顆GD衛星的實時感知和協調。</li><li><b>規模：</b>太空團隊翻倍（~120+~130=~250人）。</li><li><b>2026年發射：</b>3顆自資衛星（與Apex Space、Impulse Space、Argo Space合作）。</li></ul>"]},{name:"Golden Dome C2 Software Consortium (Prime)",value:"Classified (consortium prime — potentially billions in recurring maintenance)",agency:["Golden Dome Office (DRPM Guetlein)","Golden Dome辦公室（Guetlein將軍）"],type:["Classified (tech firms as PRIMES, defense primes as SUBS)","機密（科技公司為主承商，國防巨頭為分包商）"],pop:["2025 – Summer 2026 live demo, then ongoing","2025–2026年夏演示，後續持續"],desc:["<p>WSJ exclusive (March 24, 2026, Drew FitzGerald): Anduril named as part of 9-firm consortium developing Golden Dome's C2 'glue layer' software — the ONLY GD program run directly from Guetlein's office.</p><ul><li><b>Consortium members (WSJ):</b> Anduril, Palantir, Aalyria Technologies (Google/Alphabet spin-out), Scale AI, Swoop Technologies + LMT, NOC, RTX as <b>subcontractors</b>.</li><li><b>Structural reversal:</b> Traditional defense primes acting as SUBS to tech companies — unprecedented in Pentagon acquisition history.</li><li><b>Timeline:</b> Consortium aims for software ready for live testing <b>summer 2026</b>.</li><li><b>Guetlein:</b> 'We recognized on day one that command-and-control was going to be our secret sauce.' Described software as 'glue layer' connecting sensors, radars, and interceptors across services.</li><li><b>If successful:</b> Could become cornerstone of $185B system, giving makers potentially lucrative opportunity to make billions developing and maintaining the system over time.</li><li><b>NOC VP Rob Fleming:</b> 'Integrating the needed capabilities at scale requires a strong coalition working together across the industry.'</li></ul><p><b>Update (Aug–Sep 2026):</b> The C2 layer has been tested twice, most recently in a June 2026 integrated test at White Sands Missile Range that Guetlein called the most complex integrated missile defense test the US has run; both validated C2, the sensor network and effectors. Officials say the tests stressed software and new sensor-to-shooter links. Guetlein's office has also stood up 'ApexR', a digital ecosystem fusing sensor data with AI. Member-level contract values remain undisclosed.</p>","<p>WSJ獨家（2026年3月24日）：Anduril被點名為開發Golden Dome C2「膠合層」軟體的九企業財團成員——Guetlein辦公室唯一直接管理的GD項目。</p><ul><li><b>財團成員：</b>Anduril、Palantir、Aalyria（Google衍生）、Scale AI、Swoop + LMT、NOC、RTX為<b>分包商</b>。</li><li><b>結構性逆轉：</b>國防巨頭擔任科技公司的分包商——五角大廈採購史上前所未有。</li><li><b>時間線：</b>目標<b>2026年夏</b>軟體實戰演示。</li><li><b>如成功：</b>將成為$1,850億系統基石，帶來數十億開發和維護收入。</li></ul><p><b>更新（2026年8–9月）：</b>C2層已完成兩次測試，最近一次為2026年6月在白沙飛彈靶場的整合測試，Guetlein稱之為美國史上最複雜的整合導彈防禦測試；兩次測試均驗證了C2、感測器網絡與攔截手段。官員表示測試重點在軟體及全新「感測器到射手」鏈路。Guetlein辦公室亦建立「ApexR」數位生態系統，以AI融合感測器數據。各成員合約金額仍未披露。</p>"]}],partners:["SpaceX","Palantir","Apex Space","Impulse Space (SBI)","Inversion Space (SBI)","K2 Space (SBI)","Voyager Technologies (SBI)","Sandia National Labs (SBI)","ExoAnalytic Solutions"],mkt:"private",rev:["$2.2B (FY2025, 2x YoY) · $61B post-money (May 2026)","$22億（FY2025，年增1倍）·投後估值$610億（2026年5月）"],gdVal:["$20B Army enterprise + C2 consortium prime + SBI OTA + IBCS-M","$200億陸軍企業＋C2財團主導＋SBI OTA＋IBCS-M"],exp:"vhigh",invNote:["Private — not directly investable (secondary marks imply ~$100B). Anduril is the only company that is simultaneously a C2 prime, an SBI prime with its own supplier consortium and a solid-rocket-motor producer — relevant to the NDAA push for a second SRM source. CEO Brian Schimpf said in July there is no rush to IPO. Watch: the FY27 reconciliation outcome (C2 and SBI are GD-funded), SBI Gate 2 and any C2 production award.","未上市——無法直接投資（二級市場隱含約$1,000億）。Anduril是唯一同時身兼C2主導、自組供應團隊的SBI主承商及固體火箭發動機製造商的公司——與NDAA推動第二SRM來源直接相關。CEO Brian Schimpf 7月表示不急於IPO。關注：FY27調和法案結果（C2與SBI由GD資金支持）、SBI第二關及任何C2量產授標。"]},
{name:"Palantir Technologies",ticker:"Nasdaq: PLTR",cat:"tech",tags:[{label:["AI / Data Analytics","AI/數據分析"],color:"purple"},{label:["Maven <b>$1.3B</b>","Maven <b>$13</b>億"],color:"amber"},{label:["C2 Consortium Prime","C2財團主導"],color:"pink"}],summary:["Q2'26 revenue <b>$1.935B</b> (+93%), US government $809M (+90%); FY26 guide raised to ~$8.15B (+82%); Maven selected as platform for a program of record (25,000+ builders); C2 consortium prime (C2 tested twice); $10B Army EA.","2026年Q2營收<b>$19.35億</b>（+93%），美國政府$8.09億（+90%）；FY26指引上調至約$81.5億（+82%）；Maven獲選為正式計劃平台（25,000+開發者）；C2財團主導（C2已測試兩次）；$100億陸軍企業協議。"],role:["Palantir is Golden Dome's AI and data analytics backbone. Maven Smart System (MSS) expanded <b>$795M</b> (May 2025) to <b>$1.3B</b> through 2029, driven by CENTCOM/EUCOM/PACOM demand. MSS embedded in CJADC2 initiative. For Golden Dome: data fusion turning raw sensor feeds from AMTI, Starshield, SDA tracking, ground radars into weapons-quality targeting tracks. MetaConstellation provides space AI (reportedly leveraged by Israel for Iron Dome accuracy). Dec 2024: formalized consortium with Anduril combining Maven/AIP (enterprise) + Lattice (edge). Army data platform since 2017.","Palantir是Golden Dome AI骨幹。Maven 2025年5月擴展<b>$7.95</b>億至<b>$13</b>億。嵌入CJADC2。為Golden Dome將原始感測器數據轉化為武器級瞄準追蹤。MetaConstellation太空AI。2024年12月與Anduril成立聯盟。"],contracts:[{name:"Maven Smart System (MSS)",value:"<b>$1.3B</b> total (expanded <b>$795M</b>, May 2025)",agency:["Chief Digital & AI Office (CDAO)","CDAO"],type:["IDIQ (expanded $795M, May 2025)","IDIQ（2025年5月擴展$7.95億）"],pop:["Expanded May 2025 – 2029","2025年5月擴展–2029年"],desc:["<p>Pentagon expanded Maven by <b>$795M</b> (May 2025) to <b>$1.3B</b> through 2029.</p><ul><li>Computer vision and AI analytics for object detection, ISR analysis, battlespace awareness.</li><li>Deployed across CENTCOM, EUCOM, PACOM, NORTHCOM/NORAD, TRANSCOM.</li><li>For Golden Dome: processes orbital sensor data flows — fusing AMTI radar tracks, Starshield IR detections, SDA tracking data into unified targeting picture.</li><li>MSS embedded in CJADC2 initiative.</li></ul><p><b>Update (Q2 2026):</b> Maven was selected as the platform for a government program of record; 25,000+ service members, civilians and contractors now build agents and applications on it.</p>","<p>五角大樓2025年5月擴展Maven <b>$7.95</b>億至<b>$13</b>億（至2029年）。</p><ul><li>計算機視覺和AI分析。</li><li>部署於各作戰司令部。</li><li>為Golden Dome處理軌道感測器數據流——融合AMTI雷達追蹤、Starshield紅外偵測、SDA追蹤數據。</li><li>嵌入CJADC2。</li></ul><p><b>更新（2026年Q2）：</b>Maven獲選為政府正式計劃（program of record）平台；逾25,000名軍人、文職與承包商在其上開發代理與應用。</p>"]},{name:"Consortium Bid (SpaceX-Palantir-Anduril)",value:"TBD (est. multi-billion)",agency:["DoD / Golden Dome Office (bid stage)","國防部（競標階段）"],type:["TBD (not yet awarded)","待定（尚未授標）"],pop:["TBD","待定"],desc:["<p>Provides AI analytics, sensor data fusion, and battle management for custody/tracking layer.</p><ul><li>Turns raw feeds from 400-1,000 constellation satellites into actionable targeting with sub-second latency.</li><li>MetaConstellation for space AI orchestration.</li><li>AIP for cloud data management across classification levels.</li></ul>","<p>為監測/追蹤層提供AI分析、感測器融合和戰鬥管理。</p><ul><li>將400-1,000顆衛星原始數據轉化為亞秒延遲的可操作瞄準。</li><li>MetaConstellation太空AI。</li><li>AIP跨密級雲端管理。</li></ul>"]},{name:"SHIELD IDIQ Awardee",value:"Up to <b>$151B</b> pool",agency:["Missile Defense Agency (MDA)","導彈防禦局（MDA）"],type:["IDIQ ($151B shared ceiling / 2,440 vendors; no guaranteed funding — revenue at task-order level only)","IDIQ（$1,510億共享上限/2,440家；基礎合約無保證資金——僅任務訂單層級有收入）"],pop:["Dec 2025 – Dec 2035 (if all options)","2025年12月–2035年12月（全選項行使）"],desc:["<p>Qualified for AI/ML, C2, data integration task orders.</p><ul><li>Embedded across DoD since 2017 (Army data platform, Maven, Gotham in IC).</li><li>Structural advantage for Golden Dome AI work.</li></ul>","<p>AI/ML、C2、數據整合任務訂單。</p><ul><li>2017年起嵌入國防部。</li><li>Golden Dome AI工作的結構性優勢。</li></ul>"]},{name:"U.S. Army $10B Enterprise Agreement (Aug 2025)",value:"Up to <b>$10B</b> (10-yr ceiling)",agency:["U.S. Army","美國陸軍"],type:["Enterprise Service Agreement (10-yr, consolidating 75 contracts)","企業服務協議（10年，整合75份合約）"],pop:["Aug 2025 – 2035","2025年8月–2035年"],desc:["<p>Signed August 2025. Army consolidated 75 separate Palantir contracts into a single 10-year enterprise channel with a $10B ceiling.</p><ul><li><b>Scope:</b> Software and data analytics services across the Army — Gotham, Foundry, AIP, and Apollo platforms.</li><li><b>Precedent-setting:</b> First such mega-enterprise deal with a VC-backed tech company. Eight months later, Army awarded Anduril a $20B version of the same model.</li><li><b>Structure:</b> Single procurement vehicle for rapid task order issuance across all Army data and AI needs.</li><li><b>Palantir-Anduril synergy:</b> The two enterprise contracts create a combined $30B Army umbrella — Palantir for software/analytics, Anduril for hardware+software — forming the Army's AI backbone.</li></ul>","<p>2025年8月簽署。陸軍將75份Palantir合約整合至單一10年企業協議，上限$100億。</p><ul><li><b>範圍：</b>陸軍全軍軟體和數據分析——Gotham、Foundry、AIP和Apollo平台。</li><li><b>先例：</b>首筆與VC支持的科技公司簽訂的超大型企業協議。8個月後Anduril獲$200億版本。</li><li><b>Palantir-Anduril協同：</b>兩份企業合約創造$300億陸軍傘狀結構。</li></ul>"]},{name:"Golden Dome C2 Software Consortium (Prime)",value:"Classified (consortium prime — potentially billions in recurring maintenance)",agency:["Golden Dome Office (DRPM Guetlein)","Golden Dome辦公室（Guetlein將軍）"],type:["Classified (tech firms as PRIMES, defense primes as SUBS)","機密（科技公司為主承商，國防巨頭為分包商）"],pop:["2025 – Summer 2026 live demo, then ongoing","2025–2026年夏演示，後續持續"],desc:["<p>WSJ exclusive (March 24, 2026): Palantir named as part of 9-firm consortium developing Golden Dome's C2 'glue layer' — the project's operating system.</p><ul><li><b>Palantir's C2 role:</b> Gotham/AIP provides the AI analytics layer — processing sensor data from AMTI, Starshield, SDA tracking, and ground radars into weapons-quality targeting tracks for interceptor engagement.</li><li><b>Maven integration:</b> MSS ($1.3B) already embedded in CJADC2 — natural extension into Golden Dome's distributed C2 architecture.</li><li><b>Consortium:</b> Anduril, Palantir, Aalyria, Scale AI, Swoop as PRIMES; LMT, NOC, RTX as SUBCONTRACTORS.</li><li><b>Summer 2026:</b> Live demonstration to prove C2 can receive data from different sources, process information, and take action.</li><li><b>If successful:</b> Palantir becomes the AI brain of a $185B defense system — recurring SaaS-style revenue for decades.</li></ul><p><b>Update (Aug–Sep 2026):</b> The C2 layer has been tested twice, most recently in a June 2026 integrated test at White Sands Missile Range that Guetlein called the most complex integrated missile defense test the US has run; both validated C2, the sensor network and effectors. Officials say the tests stressed software and new sensor-to-shooter links. Guetlein's office has also stood up 'ApexR', a digital ecosystem fusing sensor data with AI. Member-level contract values remain undisclosed.</p>","<p>WSJ獨家（2026年3月24日）：Palantir被點名為開發Golden Dome C2「膠合層」的九企業財團成員。</p><ul><li><b>Palantir C2角色：</b>Gotham/AIP提供AI分析層——將感測器數據處理為武器級瞄準追蹤。</li><li><b>Maven整合：</b>MSS（$13億）已嵌入CJADC2——自然延伸至Golden Dome。</li><li><b>財團：</b>科技公司為主承商，國防巨頭為分包商。</li><li><b>如成功：</b>Palantir成為$1,850億系統的AI大腦——數十年經常性SaaS收入。</li></ul><p><b>更新（2026年8–9月）：</b>C2層已完成兩次測試，最近一次為2026年6月在白沙飛彈靶場的整合測試，Guetlein稱之為美國史上最複雜的整合導彈防禦測試；兩次測試均驗證了C2、感測器網絡與攔截手段。官員表示測試重點在軟體及全新「感測器到射手」鏈路。Guetlein辦公室亦建立「ApexR」數位生態系統，以AI融合感測器數據。各成員合約金額仍未披露。</p>"]}],partners:["SpaceX","Anduril","OpenAI","Scale AI","Aalyria","Swoop"],mkt:"public",rev:["$4.475B (FY2025, 10-K); FY26 guide $8.150–8.158B","$44.75億（FY2025，10-K）；FY26指引$81.50–81.58億"],gdVal:["C2 consortium prime + Maven (program of record) + $10B Army EA","C2財團主導＋Maven（正式計劃）＋$100億陸軍企業協議"],exp:"med",invNote:["<b>Exposure revised to Medium.</b> Earlier versions treated Maven's $1.3B ceiling as ~45% of revenue; with FY26 revenue guided to ~$8.15B, Golden Dome C2 is strategically central but financially small near term. The stock is driven by US commercial (+149% in Q2) and AIP adoption. GD's value to PLTR is platform lock-in: if the consortium's C2 becomes the operational glue layer in Epic 1 (2028), it creates decades of sustainment revenue. Valuation remains the key risk.","<b>曝險下調至「中」。</b>先前版本將Maven $13億上限視為約45%營收；FY26營收指引約$81.5億下，Golden Dome C2雖具戰略核心地位，但短期財務占比小。股價主要由美國商業（Q2 +149%）與AIP採用驅動。GD對PLTR的價值在於平台鎖定：若財團C2成為Epic 1（2028年）的作戰膠合層，將帶來數十年維運收入。估值仍是主要風險。"]},
{name:"L3Harris Technologies",ticker:"NYSE: LHX",cat:"satellite",tags:[{label:["AMDT3 $955M","AMDT3 $9.55億"],color:"red"},{label:["All SDA Tranches (T0-T3)","全部SDA批次"],color:"emerald"},{label:["<b>$125M</b> Expansion","<b>$1.25</b>億擴建"],color:"blue"},{label:["><b>$2B</b> Cumulative","><b>$20</b>億累計"],color:"amber"}],summary:["SDA AMDT3 ~<b>$955M</b> for 18 HBTSS-like missile-defense sats (Jul 2026, launch-ready end-2028); ≥70 US missile-tracking/defense sats on order (5 in orbit); Q2'26 revenue $5.9B (+8%), record $42B backlog; FY26 guide $23.2–23.7B; Aerojet SRMs (Missile Solutions +14%).","SDA AMDT3約<b>$9.55億</b>，18顆類HBTSS導彈防禦衛星（2026年7月，2028年底可發射）；已獲≥70顆美國導彈追蹤/防禦衛星訂單（5顆在軌）；2026年Q2營收$59億（+8%），創紀錄$420億積壓；FY26指引$232–237億；Aerojet固體火箭發動機（導彈方案+14%）。"],role:["Anchor vendor for Golden Dome's tracking layer — only company in every SDA tranche T0-T3. ><b>$2B</b> cumulative contracts. Ed Zoiss (President Space & Airborne Systems) confirmed 'full-rate production' at Palm Bay, FL (Dec 2025): 'No ifs, ands, or buts.' Palm Bay expanded Aug 2025 for SDA/Golden Dome. <b>$125M</b> Fort Wayne IR payload expansion. Developing sensors maintaining 'custody' of high-speed targets across orbital planes. Sensors also merchant-supplied to other TRKT3 primes (including Rocket Lab StarLite adoption).","Golden Dome追蹤層核心供應商——唯一入選T0-T3所有批次。累計><b>$20</b>億。Zoiss（2025年12月）：「全速生產，毫無疑問。」Palm Bay 2025年8月擴建。<b>$1.25</b>億Fort Wayne擴建。感測器也供應其他主承商。"],contracts:[{name:"SDA Accelerated Missile Defense Tranche 3 (AMDT3)",value:"Up to ~<b>$955M</b>",agency:["Space Development Agency (SDA)","太空發展局（SDA）"],type:["Firm-Fixed-Price OTA","固定價格OTA"],pop:["Jul 2026 – end-2028 (launch-ready)","2026年7月–2028年底（可發射）"],desc:["<p>Awarded July 13–14, 2026 alongside Sierra Space ($798M): 36 satellites across four LEO planes, accelerated for the 2028 Golden Dome capability (the original Tranche 3 Tracking Layer launches in 2029).</p><ul><li>L3Harris builds 18 'HBTSS-like' missile-defense variant satellites with medium-field-
